<article class="card app-card">
	<div class="app-card-body">
		<div class="app-heading">
			<div class="app-identity">
				<span class="app-image">
					<span class="app-icon">
						<i src="/assets/svg/remix/rss-line.svg" aria-hidden="true"></i>
					</span>
					<img
						class="app-custom-image"
						key="image"
						alt=""
						hidden
						onload="this.hidden = false"
						onerror="this.hidden = true" />
				</span>
				<h5 class="app-title" key="title"></h5>
			</div>
			<span class="text-muted fs-12">By <span key="author"></span></span>
			<div class="app-badges">
				<span
					class="badge app-badge"
					key="publish_status"
					data-value
					input.data-value="$value"
					input.value="$value"></span>
			</div>
		</div>
		<p class="app-description" key="caption"></p>
		<div class="d-flex justify-content-between pt-2 border-top border-top-dashed text-muted fs-12">
			<span>Published: <span key="publish_date"></span></span>
			<span>
				<i src="/assets/svg/remix/map-pin-line.svg" class="me-1"></i>
				<span key="location"></span>
			</span>
		</div>
	</div>
</article>
