<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/rss-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.image}}"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/blog/app.html"
							aria-controls="offcanvas-app"
							aria-open
							aria-haspopup="dialog"
							aria-expanded="false"><span state-to="offcanvas-app-form" state.array="posts" state.object="{{object._id}}" hidden></span>{{object.title}}</a>
					</h5>
				</div>
				<span class="text-muted fs-12">By {{object.author}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="publish_status" data-value="{{object.publish_status}}">{{object.publish_status}}</span>
				</div>
			</div>
			<p class="app-description">{{object.caption}}</p>
			<div class="d-flex justify-content-between pt-2 border-top border-top-dashed text-muted fs-12">
				<span>Published: {{object.publish_date}}</span>
				<span><i src="/assets/svg/remix/map-pin-line.svg" class="me-1"></i>{{object.location}}</span>
			</div>
		</div>
	</article>
</template>
<div hidden onload.array="posts" onload-query="$parent"></div>
