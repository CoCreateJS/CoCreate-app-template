<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/bill-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.avatar[0].src}}"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/invoices/app.html"
							aria-controls="offcanvas-app"
							aria-open
							aria-haspopup="dialog"
							aria-expanded="false"><span state-to="offcanvas-app-form" state.array="invoices" state.object="{{object._id}}" hidden></span>{{object.invoice.number}}</a>
					</h5>
				</div>
				<span class="text-muted fs-12">{{object.customer}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="payment.status" data-value="{{object.payment.status}}">{{object.payment.status}}</span>
				</div>
			</div>
			<p class="app-description">{{object.notes}}</p>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Subtotal</span>
					<strong>{{object.subtotal}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Tax</span>
					<strong>{{object.tax}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Total</span>
					<strong>{{object.total}}</strong>
				</div>
			</div>
			<div
				class="d-flex justify-content-between gap-3 pt-2 border-top border-top-dashed text-muted fs-12">
				<span><i src="/assets/svg/remix/calendar-line.svg" class="me-1"></i>{{object.date}}</span>
				<span><i src="/assets/svg/remix/mail-line.svg" class="me-1"></i>{{object.email}}</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="invoices" onload-query="$parent"></div>
