<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<div value-type="outerHTML" src="/apps/apis/components/provider-icon.html" class="app-image"></div>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/webhooks/app.html"
							aria-controls="offcanvas-app"
							aria-open
							aria-haspopup="dialog"
							aria-expanded="false"><span hidden state-to="offcanvas-app-form" state.array="webhooks" state.object="{{object._id}}"></span>{{object.path}}</a>
					</h5>
				</div>
				<div class="app-badges">
					<span class="badge app-badge" key="method" data-value="POST">POST</span>
					<span
						class="badge app-badge"
						role="status"
						aria-label="Enabled status"
						key="enabled"
						data-value="{{object.enabled}}"
						onload.value="$(`{{object.enabled}}` === 'true' ? 'Enabled' : 'Disabled')"></span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
		</div>
	</article>
</template>
<div onload.array="webhooks" onload-query="$parent"></div>
