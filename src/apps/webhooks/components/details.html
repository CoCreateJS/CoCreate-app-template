<div class="card-body d-flex flex-column gap-4 h-100">
		<section
			class="app-card d-flex flex-column gap-3 pb-3 w-100"
			src="/apps/webhooks/components/card.html"></section>

		<div class="flex-shrink-0 d-flex width:100% app-identity">
			<!-- Dynamic provider lookup linking back to apis collection -->

			<!-- Operational developer sandboxing hooks -->
			<ul
				class="list-inline mb-0 d-flex gap-2 mt-3"
				aria-label="Webhook Debugger Handshakes">
				<li class="avatar-xs">
					<button
						type="button"
						class="avatar-title bg-info-subtle text-info fs-15 rounded border-0"
						aria-label="Copy Webhook Endpoint URL"
						onclick="
							const pathVal = document.getElementById(
								'webhook-path-string'
							).innerText;
							const fullUrl =
								window.location.origin +
								'/webhooks/' +
								pathVal;
							const tempInput =
								document.createElement('input');
							tempInput.value = fullUrl;
							document.body.appendChild(tempInput);
							tempInput.select();
							document.execCommand('copy');
							document.body.removeChild(tempInput);
						">
						<i src="/assets/svg/remix/file-copy-line.svg"></i>
					</button>
				</li>
				<li class="avatar-xs">
					<button
						type="button"
						class="avatar-title bg-success-subtle text-success fs-15 rounded border-0"
						aria-label="Simulate Webhook POST Handshake">
						<i src="/assets/svg/remix/terminal-window-line.svg"></i>
					</button>
				</li>
			</ul>
		</div>

		<div
			class="flex-grow-1"
			style="flex-basis: 0; min-width: 300px">
			<h6
				class="text-muted text-uppercase fw-semibold mb-3"
				aria-label="Webhook Specifications Panel">
				Webhook Specifications
			</h6>

			<p
				class="text-muted mb-4 fs-14"
				key="description"
				aria-describedby="webhook-specs-heading"></p>

			<div class="table-responsive table-card">
				<table
					class="table table-borderless mb-0"
					aria-label="Webhook Specification Settings">
					<tbody>
						<tr>
							<td
								class="fw-medium text-muted"
								scope="row"
								style="width: 35%">
								API Provider
							</td>
							<td>
								<span
									class="fw-bold text-dark text-capitalize"
									array="apis"
									object="{{object.api_id}}"
									key="name"></span>
							</td>
						</tr>
						<tr>
							<td
								class="fw-medium text-muted"
								scope="row">
								Webhook URL Path
							</td>
							<td>
								<code class="text-danger"
									>/webhooks/<span
										id="webhook-path-string"
										key="path"></span
								></code>
							</td>
						</tr>
						<tr>
							<td
								class="fw-medium text-muted"
								scope="row">
								Event Locator Key
							</td>
							<td>
								<code
									class="text-dark"
									key="action"
									aria-label="Dynamic Event Selector"></code>
							</td>
						</tr>
						<tr>
							<td
								class="fw-medium text-muted"
								scope="row">
								System Status
							</td>
							<td aria-label="Webhook Active State">
								<span
									key="status"
									class="badge border border-success text-success text-uppercase"
									>Active</span
								>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<!-- Inbound Webhook Execution Metrics and History logs -->
		<div
			class="w-100"
			src="components/activities.html"
			aria-label="Webhook Transaction Audit Logs"></div>
	</div>
