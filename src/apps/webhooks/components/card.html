<div class="app-card-body">
	<div class="app-heading">
		<div class="app-identity">
			<div value-type="outerHTML" src="/apps/apis/components/provider-icon.html" class="app-image"></div>
			<h5 class="app-title" key="path"></h5>
		</div>
		<div class="app-badges">
			<span class="badge app-badge" key="method" data-value="POST">POST</span>
			<span
				class="badge app-badge"
				role="status"
				aria-label="Enabled status"
				key="enabled"
				data-value
				input.data-value="$value"
				input.value="$(`$value` === 'true' ? 'Enabled' : 'Disabled')"></span>
		</div>
	</div>
	<p class="app-description" key="description"></p>
</div>
