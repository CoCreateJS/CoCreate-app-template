<div
	class="offcanvas-app-create app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Create apis webhooks">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="ApisWebhooks"
		value-type="outerHtml"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0">
		<form
			state-id="offcanvas-app-form"
			class="app-form"
			array
			object
			autocomplete="off">
			<div scrollbar>
				<div src="/apps/webhooks/components/form.html"></div>
			</div>
			<footer
				src="/components/offcanvas-app/footer.html"
				value-type="outerHtml"></footer>
		</form>
	</div>
</div>
