<div
	class="container-fluid d-flex flex-column flex-grow-1 min-height:0 overflow-hidden">
	<div class="d-flex flex-wrap flex-grow-1 min-height:0 overflow-hidden">
		<div
			class="width:100% d-flex flex-column flex-grow-1 min-height:0 overflow-hidden">
			<div class="d-flex flex-wrap flex-grow-1 min-height:0 overflow-hidden">
				<div class="flex-grow-1 flex-basis:25% min-width:260px min-height:0 overflow:auto">
					<div class="card card-h-100">
						<div class="card-body">
							<button
								class="btn btn-primary w-100"
								id="btn-new-event">
								<i class="mdi mdi-plus"></i>
								Create New Event
							</button>

							<div id="external-events">
								<br />
								<p class="text-muted">
									Drag and drop your event or click in the
									calendar
								</p>
								<div
									class="external-event fc-event bg-success-subtle text-success"
									data-class="bg-success-subtle">
									<i
										class="mdi mdi-checkbox-blank-circle me-2"></i
									>New Event Planning
								</div>
								<div
									class="external-event fc-event bg-info-subtle text-info"
									data-class="bg-info-subtle">
									<i
										class="mdi mdi-checkbox-blank-circle me-2"></i
									>Meeting
								</div>
								<div
									class="external-event fc-event bg-warning-subtle text-warning"
									data-class="bg-warning-subtle">
									<i
										class="mdi mdi-checkbox-blank-circle me-2"></i
									>Generating Reports
								</div>
								<div
									class="external-event fc-event bg-danger-subtle text-danger"
									data-class="bg-danger-subtle">
									<i
										class="mdi mdi-checkbox-blank-circle me-2"></i
									>Create New theme
								</div>
							</div>
						</div>
					</div>
					<div>
						<h5 class="mb-1">Upcoming Events</h5>
						<p class="text-muted">Don't miss scheduled events</p>
						<div
							class="pe-2 me-n1 mb-3"
							scrollbar
							style="height: 400px">
							<div id="upcoming-event-list"></div>
						</div>
					</div>

					<div class="card">
						<div class="card-body bg-info-subtle">
							<div class="d-flex">
								<div class="flex-shrink-0">
									<i
										src="/assets/svg/remix/calendar-line.svg"
										class="text-info"></i>
								</div>
							</div>
						</div>
					</div>
					<!--end card-->
				</div>
				<!-- end col-->

				<div class="flex-grow-1 flex-basis:75% min-width:400px d-flex flex-column min-height:0">
					<div
						class="card card-h-100 d-flex flex-column flex-grow-1 min-height:0 mb-0">
						<div
							class="card-body d-flex flex-column flex-grow-1 min-height:0 overflow-hidden">
							<!-- The core FullCalendar element bound to the CoCreate CRUD Ecosystem -->
							<div
								id="calendar"
								array="calendar"
								object
								component
								filter-limit
								class="flex-grow-1 min-height:0"
								plugin='{
									"$FullCalendar": {
										"Calendar": [
											"$this",
											{
												"timeZone": "local",
												"editable": true,
												"droppable": true,
													"selectable": true,
													"navLinks": true,
													"initialView": "dayGridMonth",
													"themeSystem": "bootstrap",
													"height": "100%",
													"expandRows": true,
													"stickyHeaderDates": true,
												"headerToolbar": {
													"left": "prev,next today",
													"center": "title",
													"right": "dayGridMonth,timeGridWeek,timeGridDay,listMonth"
												},
												"events": [
													{ "title": "Initial AST Meeting", "start": "2026-07-13" }
												]
											}
										]
									},
									"$FullCalendar.render": []
								}'></div>
						</div>
					</div>
				</div>
				<!-- end col -->
			</div>
			<!--end row-->

			<div style="clear: both"></div>
		</div>
	</div>
	<!-- end row-->
</div>
<!-- container-fluid -->
