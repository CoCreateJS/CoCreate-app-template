<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<div value-type="outerHTML" src="/apps/apis/components/provider-icon.html" class="app-image"></div>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/servers/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-open><span state-to="offcanvas-app-form" state.array="servers" state.object="{{object._id}}" hidden></span>{{object.name}}</a>
					</h5>
				</div>
				<div class="app-badges">
					<span class="badge app-badge" role="status" key="status" data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<code class="fs-12 text-break">{{object.host}}</code>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Region</span>
					<strong>{{object.infrastructure.region}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Zone</span>
					<strong>{{object.infrastructure.zone}}</strong>
				</div>
			</div>
			<div class="d-flex flex-column gap-2 text-muted fs-12">
				<span>
					<i src="/assets/svg/remix/cpu-line.svg" class="me-2" aria-hidden="true"></i>
					<span>{{object.infrastructure.vmType}}</span>
				</span>
				<span><i src="/assets/svg/remix/map-pin-line.svg" class="me-2" aria-hidden="true"></i><span>{{object.location.city}}</span>, <span>{{object.location.country}}</span></span>
			</div>
			<div
				class="d-flex flex-wrap justify-content-between gap-2 pt-2 border-top border-top-dashed"
				style="margin-top: auto">
				<span class="text-muted fs-12">Master: <strong class="text-capitalize">{{object.master.status}}</strong></span>
				<span class="text-muted fs-12">Workers: <strong>{{object.totalWorkers}}</strong></span>
			</div>
		</div>
	</article>
</template>
<div onload.array="servers" onload-query="$parent"></div>
