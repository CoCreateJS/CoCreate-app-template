<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image" aria-hidden="true">
						<img
							src="/assets/svg/providers/{{object.provider}}.svg"
							alt=""
							onload="this.hidden = false"
							onerror="if (this.getAttribute('src') === '/assets/svg/providers/configuration.svg') { this.hidden = true; } else { this.src = '/assets/svg/providers/configuration.svg'; }" />
						<img
							class="app-custom-image"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true"
							src="{{object.avatar[0].src}}" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/servers/configs/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-open><span state-to="offcanvas-app-form" state.array="servers_config" state.object="{{object._id}}" hidden></span>{{object.name}}</a>
					</h5>
				</div>
				<div class="app-badges">
					<span class="badge app-badge" key="type" data-value="{{object.type}}">{{object.type}}</span>
					<span
						class="badge app-badge"
						role="status"
						aria-label="Enabled status"
						key="enabled"
						data-value="{{object.enabled}}"
						onload.value="$(`{{object.enabled}}` === 'true' ? 'Enabled' : 'Disabled')"></span>
				</div>
			</div>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Driver</span>
					<strong>{{object.driver}}</strong>
				</div>
			</div>
			<div
				class="d-flex flex-wrap gap-3 pt-2 border-top border-top-dashed text-muted fs-12"
				style="margin-top: auto">
				<span class="text-break">
					<i src="/assets/svg/remix/stack-line.svg" class="me-1" aria-hidden="true"></i>
					<span>{{object.cluster}}</span>
				</span>
				<span class="text-break">
					<i src="/assets/svg/remix/server-line.svg" class="me-1" aria-hidden="true"></i>
					<span>{{object.server}}</span>
				</span>
				<span class="text-break">
					<i src="/assets/svg/remix/cpu-line.svg" class="me-1" aria-hidden="true"></i>
					<span>{{object.worker}}</span>
				</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="servers_config" onload-query="$parent"></div>
