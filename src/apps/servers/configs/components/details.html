<link rel="stylesheet" href="/components/code/index.css" />

	<div class="card-body d-flex flex-column gap-4 h-100">
		<section
			class="app-card d-flex flex-column gap-3 pb-3 w-100"
			src="/apps/servers/configs/components/card.html"></section>
		<div class="text-muted">
			<i src="/assets/svg/remix/cloud-line.svg" class="me-1" aria-hidden="true"></i><span key="provider"></span>
		</div>

		<section class="border-top border-top-dashed pt-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">Runtime scope</h6>
			<div class="d-flex flex-wrap gap-3">
				<div class="border border-dashed rounded p-3 flex-grow-1" style="flex-basis: 200px; min-width: 180px">
					<span class="text-muted d-block mb-1">Cluster</span>
					<code class="text-break" key="cluster"></code>
				</div>
				<div class="border border-dashed rounded p-3 flex-grow-1" style="flex-basis: 240px; min-width: 210px">
					<span class="text-muted d-block mb-1">Server</span>
					<code class="text-break" key="server"></code>
				</div>
				<div class="border border-dashed rounded p-3 flex-grow-1" style="flex-basis: 200px; min-width: 180px">
					<span class="text-muted d-block mb-1">Worker</span>
					<code class="text-break" key="worker"></code>
				</div>
			</div>
		</section>

		<section class="border-top border-top-dashed pt-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">Configuration</h6>
			<div class="component-code border rounded p-3">
    <pre aria-hidden="true"><code class="language-json"></code></pre>
    <textarea id="server-config-json-details" key="config" type="code" lang="json"
        value-type="json" value-evaluate="false" height="auto" rows="1"
        class="form-control font-monospace" spellcheck="false"
        aria-label="Runtime configuration" readonly save="false"></textarea>
    <button type="button" class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
        clipboard
        clipboard-query="$parent textarea"
        aria-label="Copy configuration" title="Copy configuration">
        <i src="/assets/svg/remix/file-copy-line.svg" aria-hidden="true"></i>
        <i src="/assets/svg/remix/check-line.svg" aria-hidden="true"></i>
    </button>
</div>
		</section>

		<section class="border-top border-top-dashed pt-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">Record information</h6>
			<div class="d-flex flex-wrap gap-4">
				<div>
					<span class="text-muted d-block">Record ID</span>
					<code key="_id"></code>
				</div>
				<div>
					<span class="text-muted d-block">Last updated</span>
					<span key="updated.on"></span>
				</div>
			</div>
		</section>

		<div
			class="w-100"
			src="components/activities.html"
			aria-label="Server Configuration Activities"></div>
	</div>
