<div class="app-card-body">
	<div class="app-heading">
		<div class="app-identity">
			<div value-type="outerHTML" src="/apps/apis/components/provider-icon.html" class="app-image"></div>
			<h5 class="app-title" key="name"></h5>
		</div>
		<div class="app-badges">
			<span
				class="badge app-badge"
				role="status"
				key="status"
				data-value
				input.data-value="$value"
				input.value="$value"></span>
		</div>
	</div>
	<code class="fs-12 text-break" key="host"></code>
	<div class="d-flex flex-wrap gap-3">
		<div>
			<span class="text-muted fs-12 d-block">Region</span>
			<strong key="infrastructure.region"></strong>
		</div>
		<div>
			<span class="text-muted fs-12 d-block">Zone</span>
			<strong key="infrastructure.zone"></strong>
		</div>
	</div>
	<div class="d-flex flex-column gap-2 text-muted fs-12">
		<span>
			<i src="/assets/svg/remix/cpu-line.svg" class="me-2" aria-hidden="true"></i>
			<span key="infrastructure.vmType"></span>
		</span>
		<span><i src="/assets/svg/remix/map-pin-line.svg" class="me-2" aria-hidden="true"></i><span key="location.city"></span>, <span key="location.country"></span></span>
	</div>
	<div
		class="d-flex flex-wrap justify-content-between gap-2 pt-2 border-top border-top-dashed"
		style="margin-top: auto">
		<span class="text-muted fs-12">Master: <strong class="text-capitalize" key="master.status"></strong></span>
		<span class="text-muted fs-12">Workers: <strong key="totalWorkers"></strong></span>
	</div>
</div>
