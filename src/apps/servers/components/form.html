
	<div class="card-body d-flex flex-column gap-4 h-100">
		<input
			type="hidden"
			key="_id" />

		<section>
			<h5 class="text-uppercase fw-semibold mb-3">Server identity</h5>
			<div class="d-flex flex-wrap gap-3">
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-2 flex-basis:280px min-width:220px">
					Name
					<input
						type="text"
						class="form-control"
						key="name"
						placeholder="production-aws-us-east-1-01"
						required />
				</label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-2 flex-basis:280px min-width:220px">
					Host
					<input
						type="text"
						class="form-control"
						key="host"
						placeholder="server.example.com" />
				</label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:200px">
					IP Address
					<input
						type="text"
						class="form-control"
						key="ip"
						placeholder="0.0.0.0"
						readonly />
				</label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:200px">
					Organization ID
					<input
						type="text"
						class="form-control"
						key="organization_id"
						readonly />
				</label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:180px min-width:160px">
					Server Status
					<select
						class="form-select"
						key="status">
						<option value="running">Running</option>
						<option value="starting">Starting</option>
						<option value="draining">Draining</option>
						<option value="stopping">Stopping</option>
						<option value="stopped">Stopped</option>
						<option value="offline">Offline</option>
						<option value="error">Error</option>
					</select>
				</label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:160px min-width:140px">
					Total Workers
					<input
						type="number"
						class="form-control"
						key="totalWorkers"
						min="0"
						readonly />
				</label>
			</div>
		</section>

		<section class="border-top border-top-dashed pt-3">
			<h5 class="text-uppercase fw-semibold mb-3">Infrastructure</h5>
			<div class="d-flex flex-wrap gap-3">
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
					Provider
					<input
						type="text"
						class="form-control"
						key="infrastructure.provider" />
				</label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
					Region
					<input
						type="text"
						class="form-control"
						key="infrastructure.region" />
				</label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
					Zone
					<input
						type="text"
						class="form-control"
						key="infrastructure.zone" />
				</label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:240px min-width:220px">
					VM ID
					<input
						type="text"
						class="form-control"
						key="infrastructure.vmId"
						readonly />
				</label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
					VM Type
					<input
						type="text"
						class="form-control"
						key="infrastructure.vmType" />
				</label>
			</div>
		</section>

		<section class="border-top border-top-dashed pt-3">
			<h5 class="text-uppercase fw-semibold mb-3">Process control</h5>
			<div class="d-flex flex-wrap gap-3">
				<div
					class="d-flex flex-column gap-3 flex-grow-1 flex-basis:260px min-width:240px border border-dashed rounded p-3">
					<h6 class="mb-0">Master</h6>
					<label class="form-label d-flex flex-column gap-1">
						PID
						<input
							type="number"
							class="form-control"
							key="master.pid"
							readonly />
					</label>
					<label class="form-label d-flex flex-column gap-1">
						Status
						<select
							class="form-select"
							key="master.status">
							<option value="running">Running</option>
							<option value="starting">Starting</option>
							<option value="stopping">Stopping</option>
							<option value="stopped">Stopped</option>
							<option value="error">Error</option>
						</select>
					</label>
				</div>

				<div
					class="d-flex flex-column gap-3 flex-grow-2 flex-basis:420px min-width:280px border border-dashed rounded p-3">
					<h6 class="mb-0">Worker 1</h6>
					<div class="d-flex flex-wrap gap-3">
						<label
							class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:160px min-width:140px">
							PID
							<input
								type="number"
								class="form-control"
								key="worker1.pid"
								readonly />
						</label>
						<label
							class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:180px min-width:160px">
							Status
							<select
								class="form-select"
								key="worker1.status">
								<option value="running">Running</option>
								<option value="starting">Starting</option>
								<option value="draining">Draining</option>
								<option value="stopping">Stopping</option>
								<option value="stopped">Stopped</option>
								<option value="error">Error</option>
							</select>
						</label>
					</div>
					<div class="d-flex flex-wrap gap-3">
						<label
							class="form-check form-switch flex-grow-1 min-width:140px">
							<input
								class="form-check-input"
								type="checkbox"
								role="switch"
								key="worker1.isCordoned" />
							<span class="form-check-label">Cordoned</span>
						</label>
						<label
							class="form-check form-switch flex-grow-1 min-width:140px">
							<input
								class="form-check-input"
								type="checkbox"
								role="switch"
								key="worker1.isShedding" />
							<span class="form-check-label"
								>Shedding Load</span
							>
						</label>
						<label
							class="form-check form-switch flex-grow-1 min-width:140px">
							<input
								class="form-check-input"
								type="checkbox"
								role="switch"
								key="worker1.isDraining" />
							<span class="form-check-label">Draining</span>
						</label>
					</div>
				</div>
			</div>
		</section>

		<section class="border-top border-top-dashed pt-3">
			<h5 class="text-uppercase fw-semibold mb-3">
				Detected location
			</h5>
			<div class="d-flex flex-wrap gap-3">
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:180px min-width:160px"
					>City<input
						type="text"
						class="form-control"
						key="location.city"
						readonly
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:180px"
					>Region<input
						type="text"
						class="form-control"
						key="location.region"
						readonly
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:180px min-width:160px"
					>Country<input
						type="text"
						class="form-control"
						key="location.country"
						readonly
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:160px min-width:140px"
					>Country Code<input
						type="text"
						class="form-control"
						key="location.countryCode"
						readonly
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:180px"
					>Timezone<input
						type="text"
						class="form-control"
						key="location.timezone"
						readonly
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:160px min-width:140px"
					>Latitude<input
						type="number"
						step="any"
						class="form-control"
						key="location.latitude"
						readonly
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:160px min-width:140px"
					>Longitude<input
						type="number"
						step="any"
						class="form-control"
						key="location.longitude"
						readonly
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:300px min-width:240px"
					>Network Organization<input
						type="text"
						class="form-control"
						key="location.org"
						readonly
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:160px min-width:140px"
					>Source<input
						type="text"
						class="form-control"
						key="location.source"
						readonly
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:120px min-width:110px"
					>Continent<input
						type="text"
						class="form-control"
						key="location.continent"
						readonly
				/></label>
			</div>
		</section>
	</div>
