
	<div class="card-body d-flex flex-column gap-4 h-100">
<div class="flex-grow-1 w-100">
	<div
		class="mb-3 app-identity"
		style="flex: 1">
		<h6
			class="card-title mb-3"
			key="name"></h6>

		<div class="mb-2">
			<lord-icon
				id="timer-icon"
				src="https://cdn.lordicon.com/kbtmbyzy.json"
				trigger=""
				colors="primary:#405189,secondary:#02a8b5"
				style="width: 100px; height: 100px">
			</lord-icon>
		</div>
		<h3
			id="elapsed-time"
			class="timer app-title mb-1">
			00:00:00
		</h3>

		<div class="hstack gap-2 justify-content-center">
			<!-- <input type="datetime-local" key="sessions.startTime" now hidden /> -->
			<input
				type="datetime-local"
				key="sessions.endTime"
				now
				hidden />
			<input
				type="hidden"
				key="sessions.userId"
				value="$user_id" />
			<button
				class="btn btn-danger btn-sm"
				click-query="$document #timer-icon"
				click.trigger=""
				toggle.save
				toggle
				type="datetime-local"
				key="$push.sessions.endTime"
				now
				aria-label="Stop Timer">
				<i src="/assets/svg/remix/stop-circle-line.svg" class="align-bottom me-1"></i>
				Stop
			</button>
			<button
				class="btn btn-success btn-sm"
				click-query="$document #timer-icon"
				click.trigger="loop"
				toggle.save
				toggle
				type="datetime-local"
				key="$push.sessions"
				now
				aria-label="Start Timer">
				<i src="/assets/svg/remix/play-circle-line.svg" class="align-bottom me-1"></i>
				Start
			</button>
		</div>
	</div>
</div>
<div class="mb-4 w-100">
	<select
		class="form-control mb-4"
		id="task-status-select"
		key="status"
		aria-label="Task Status">
		<option value="">Select Status</option>
		<option value="Unassigned">Unassigned</option>
		<option value="To Do">To Do</option>
		<option value="Inprogress">Inprogress</option>
		<option value="In Reviews">In Reviews</option>
		<option value="Completed">Completed</option>
	</select>
	<table class="table mb-0">
		<tbody>
			<tr>
				<td class="fw-medium">Task No</td>
				<td
					key="_id"
					input-query="$document .current_id"
					input-object="$value"></td>
			</tr>
			<tr>
				<td class="fw-medium">Task Title</td>
				<td key="name"></td>
			</tr>
			<tr>
				<td class="fw-medium">Project Name</td>
				<td key="project_name"></td>
			</tr>
			<tr>
				<td class="fw-medium">Priority</td>
				<td>
					<span
						class="badge border border-danger text-danger"
						key="priority"></span>
				</td>
			</tr>
			<tr>
				<td class="fw-medium">Status</td>
				<td>
					<span
						class="badge border border-secondary text-secondary"
						key="status"></span>
				</td>
			</tr>
			<tr>
				<td class="fw-medium">Due Date</td>
				<td><span key="dueDate"></span></td>
			</tr>
			<tr>
				<td class="fw-medium">Due Time</td>
				<td><span key="dueTime"></span></td>
			</tr>
		</tbody>
	</table>
</div>
<div class="card w-100">
	<div class="mb-4">
		<h6 class="mb-3 fw-semibold text-uppercase">Description</h6>
		<p key="description"></p>
	</div>
	<div class="mb-4">
		<h6 class="mb-3 fw-semibold text-uppercase">Tasks</h6>
		<ul
			class="ps-3 list-unstyled vstack gap-2"
			array="sub_tasks"
			object=""
			render-query="[data-template='subtask-template']">
			<li
				data-template="subtask-template"
				object="">
				<div class="form-check">
					<input
						class="form-check-input"
						type="checkbox"
						value=""
						key="completed"
						id="productTask" />
					<label
						class="form-check-label"
						for="productTask"
						key="name"
						>{{object.name}}</label
					>
				</div>
			</li>
		</ul>
	</div>
</div>

<div class="w-100">
	<h6 class="card-title mb-3">Assigned To</h6>
	<input
		type="hidden"
		key="members"
		filter-query-key="_id.$nin"
		filter-query="$document #members-list" />
	<div src="components/avatar-group.html"></div>
</div>
<div
	class="card"
	style="margin-top: 1rem">
	<div class="card-header">
		<ul
			class="nav nav-tabs-custom rounded card-header-tabs border-bottom-0"
			role="tablist">
			<li class="nav-item">
				<a
					id="comments-tab"
					class="nav-link active"
					role="tab"
					aria-controls="comments"
					aria-selected="true">
					Comments (5)
				</a>
			</li>
			<li class="nav-item">
				<a
					id="attachments-tab"
					class="nav-link"
					role="tab"
					aria-controls="attachments"
					aria-selected="false">
					Attachments
				</a>
			</li>
			<li class="nav-item">
				<a
					id="sessions-tab"
					class="nav-link"
					role="tab"
					aria-controls="sessions"
					aria-selected="false">
					Sessions
				</a>
			</li>
		</ul>
	</div>
	<div class="mt-4">
		<div class="tab-content">
			<div
				class="tab-pane show"
				id="comments"
				role="tabpanel"
				aria-labelledby="comments-tab"
				aria-hidden="false"
				src="/components/comments.html"></div>
			<div
				class="tab-pane"
				id="attachments"
				role="tabpanel"
				aria-labelledby="attachments-tab"
				aria-hidden="true"
				src="/components/mini-file-manager.html"></div>
			<div
				class="tab-pane"
				id="sessions"
				role="tabpanel"
				aria-labelledby="sessions-tab"
				aria-hidden="true">
				<div class="table-responsive table-card">
					<table class="table align-middle mb-0">
						<thead class="table-light text-muted">
							<tr>
								<th scope="col">Member</th>
								<th scope="col">Date</th>
								<th scope="col">Duration</th>
								<th scope="col">Timer Idle</th>
								<th scope="col">Tasks Title</th>
							</tr>
						</thead>
						<tbody
							render-query=".time-entry-template"
							array="time_entries"
							object="">
							<tr
								class="time-entry-template"
								object=""
								style="display: none">
								<th scope="row">
									<div class="d-flex align-items-center">
										<img
											src="{{object.memberAvatar}}"
											alt="Member Avatar"
											class="rounded-circle avatar-xxs" />
										<div class="flex-grow-1 ms-2">
											<a
												href="{{object.profileLink}}"
												class="fw-medium">
												{{object.memberName}}
											</a>
										</div>
									</div>
								</th>
								<td>{{object.date}}</td>
								<td>{{object.duration}}</td>
								<td>{{object.timerIdle}}</td>
								<td>{{object.taskTitle}}</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</div>
<div
	class="w-100"
	src="components/activities.html"></div>
</div>

<style>
@keyframes timer {
	from {
		content: "00:00:00";
	}
	to {
		content: "99:59:59";
	}
}

.timer {
	display: inline-block;
	font-family: monospace;
	font-size: 1.2rem;
	animation: timer linear infinite;
	animation-duration: var(--timer-duration, 3600s);
}
</style>

<script>
const elapsedTimeElement = document.getElementById("elapsed-time");
const startTimeElement = document.querySelector(
	'[key="sessions.startTime"]'
);

function startTimer() {
	const startTime = new Date(startTimeElement.getAttribute("value"));
	const now = new Date();
	const elapsed = Math.floor((now - startTime) / 1000);
	const remainingTime = 86400 - elapsed;
	elapsedTimeElement.style.setProperty(
		"--timer-duration",
		`${remainingTime}s`
	);
	elapsedTimeElement.classList.add("timer");
}

function stopTimer() {
	elapsedTimeElement.classList.remove("timer");
}
</script>
