<style>
	.builder-dom-tree {
		min-width: 0;
		overflow-x: auto;
		padding: 8px;
		color: var(--coc-body-color);
		font-size: 13px;
	}

	.builder-dom-tree-children {
		margin-left: 12px;
		padding-left: 8px;
		border-left: 1px solid var(--coc-border-color);
	}

	.builder-dom-tree-row {
		display: flex;
		min-height: 30px;
		align-items: center;
		gap: 7px;
		padding: 3px 5px;
		border-radius: var(--coc-border-radius-sm, 4px);
		white-space: nowrap;
	}

	.builder-dom-tree-branch > summary {
		list-style: none;
		cursor: pointer;
	}

	.builder-dom-tree-branch > summary::-webkit-details-marker {
		display: none;
	}

	.builder-dom-tree-branch > summary::before,
	.builder-dom-tree-leaf::before {
		width: 10px;
		flex: 0 0 10px;
		color: var(--coc-secondary-color);
	}

	.builder-dom-tree-branch > summary::before {
		content: "▸";
	}

	.builder-dom-tree-branch[open] > summary::before {
		content: "▾";
	}

	.builder-dom-tree-leaf::before {
		content: "";
	}

	.builder-dom-tree-row:hover,
	.builder-dom-tree-row-selected {
		background: var(--coc-tertiary-bg);
	}

	.builder-dom-tree-row-selected {
		color: var(--coc-primary);
		background: var(--coc-primary-bg-subtle);
	}

	.builder-dom-tree-drag {
		width: 14px;
		height: 14px;
		flex: 0 0 14px;
		color: var(--coc-secondary-color);
		cursor: grab;
	}

	.builder-dom-tree-name {
		flex: 1 1 auto;
		color: var(--coc-primary);
		font-weight: var(--coc-font-weight-medium, 500);
	}

	.builder-dom-tree-actions {
		display: inline-flex;
		flex: 0 0 auto;
		align-items: center;
		gap: 2px;
		margin-left: auto;
	}

	.builder-dom-tree-action {
		display: inline-flex;
		width: 26px;
		height: 26px;
		align-items: center;
		justify-content: center;
		border-radius: var(--coc-border-radius-sm, 4px);
		color: var(--coc-secondary-color);
	}

	.builder-dom-tree-row:hover .builder-dom-tree-action {
		color: var(--coc-body-color);
	}

	.builder-dom-tree-action > i {
		width: 15px;
		height: 15px;
	}
</style>
