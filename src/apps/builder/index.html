<link
	rel="stylesheet"
	href="/apps/builder/index.css" />
<link
	rel="stylesheet"
	href="/components/list/header.css" />

<div class="builder-app">
	<header class="app-panel-header builder-header">
		<div
			class="list-header d-flex flex-wrap justify-content-between align-items-center gap-2">
			<div class="list-header-primary d-flex align-items-center gap-2">
				<button
					type="button"
					class="list-toolbar-control list-toolbar-icon btn btn-light"
					aria-controls="menuL"
					aria-label="Toggle components menu"
					title="Components"
					click-query="#menuL"
					click.class="show,hide">
					<i src="/assets/svg/remix/menu-2-line.svg"></i>
				</button>
				<div class="builder-title d-flex align-items-center gap-2">
					<i src="/assets/svg/remix/layout-masonry-line.svg"></i>
					<h5 class="mb-0">Builder</h5>
				</div>
			</div>

			<ul class="list-header-actions hstack gap-2 ms-auto">
				<li>
					<button
						type="button"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						fullscreen
						fullscreen-query="$closest .builder-app"
						aria-label="Toggle fullscreen"
						title="Toggle fullscreen">
						<i class="fullscreen-icon" src="/assets/svg/remix/fullscreen-line.svg"></i>
						<i class="fullscreen-exit-icon" src="/assets/svg/remix/fullscreen-exit-line.svg"></i>
					</button>
				</li>

				<!-- Save and Make live -->
				<li>
					<button
						type="button"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						actions="saveDomText"
						state-id="builder"
						array=""
						object=""
						key="src"
						aria-label="Save"
						title="Save">
						<i src="/assets/svg/remix/save-line.svg"></i>
					</button>
				</li>

				<!-- Builder Controls -->
				<li>
					<button
						type="button"
						id="redo-canvas"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						aria-label="Redo"
						title="Redo">
						<i
							src="/assets/svg/remix/arrow-go-forward-line.svg"></i>
					</button>
				</li>
				<li>
					<button
						type="button"
						id="undo-canvas"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						aria-label="Undo"
						title="Undo">
						<i src="/assets/svg/remix/arrow-go-back-line.svg"></i>
					</button>
				</li>

				<li
					class="builder-device-button"
					selected-value="max-width:100%"
					selected-query=".canvas-container"
					selected-group="screen-size"
					selected>
					<button
						type="button"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						id="desktop-view"
						aria-label="Desktop preview"
						title="Desktop preview">
						<i src="/assets/svg/remix/computer-line.svg"></i>
					</button>
				</li>
				<li
					class="builder-device-button"
					selected-value="max-width:768px"
					selected-query=".canvas-container"
					selected-group="screen-size">
					<button
						type="button"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						id="tablet-view"
						aria-label="Tablet preview"
						title="Tablet preview">
						<i src="/assets/svg/remix/tablet-line.svg"></i>
					</button>
				</li>
				<li
					class="builder-device-button"
					selected-value="max-width:375px"
					selected-query=".canvas-container"
					selected-group="screen-size">
					<button
						type="button"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						id="mobile-view"
						aria-label="Mobile preview"
						title="Mobile preview">
						<i src="/assets/svg/remix/smartphone-line.svg"></i>
					</button>
				</li>

				<li>
					<button
						type="button"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						actions="disableHref"
						link-query="#canvas;"
						click-query="[actions='enableHref'], [actions='disableHref']"
						click.class="show,hide"
						aria-label="Disable links in preview"
						title="Disable links in preview">
						<i src="/assets/svg/remix/link.svg"></i>
					</button>
				</li>
				<li>
					<button
						type="button"
						class="list-toolbar-control list-toolbar-icon btn btn-light hide"
						actions="enableHref"
						link-query="#canvas;"
						click-query="[actions='enableHref'], [actions='disableHref']"
						click.class="show,hide"
						aria-label="Enable links in preview"
						title="Enable links in preview">
						<i src="/assets/svg/remix/links-line.svg"></i>
					</button>
				</li>

				<!-- Render Code Editor -->
				<li>
					<button
						type="button"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						actions="state, openModal"
						modal-src="../code-editor/index.html"
						modal-width="900px"
						modal-color="#229954"
						aria-label="Edit page code"
						title="Edit page code">
						<i src="/assets/svg/remix/code-s-slash-line.svg"></i>
					</button>
					<div
						state_id="builder"
						state-array=""
						state-object=""
						key=""
						state_to="code-editor"></div>
				</li>
				<li>
					<button
						type="button"
						id="element-borders"
						class="list-toolbar-control list-toolbar-icon btn btn-light"
						aria-label="Toggle element borders"
						title="Toggle element borders">
						<i src="/assets/svg/square.svg"></i>
					</button>
				</li>
				<li>
					<button
						type="button"
						id="clean-canvas"
						class="list-toolbar-control list-toolbar-icon btn btn-soft-danger"
						aria-label="Clear canvas"
						title="Clear canvas">
						<i src="/assets/svg/remix/delete-bin-line.svg"></i>
					</button>
				</li>
			</ul>

			<button
				type="button"
				class="list-toolbar-control list-toolbar-icon btn btn-light builder-properties-toggle"
				aria-controls="menuR"
				aria-label="Toggle properties panel"
				title="Properties"
				click-query="#menuR"
				click.class="show,hide">
				<i src="/assets/svg/remix/equalizer-line.svg"></i>
			</button>
		</div>
	</header>

	<div
		id="modal-viewport"
		class="position:fixed z-index:12!important"></div>

	<div class="builder-workspace">
		<aside
			id="menuL"
			class="builder-sidebar builder-sidebar-left show"
			aria-label="Builder components">
			<div class="builder-sidebar-header">
				<h6 class="mb-0">Components</h6>
				<button
					type="button"
					class="list-toolbar-control list-toolbar-icon btn btn-light builder-sidebar-close"
					aria-label="Close components menu"
					title="Close components menu"
					click-query="#menuL"
					click.class="show,hide">
					<i src="/assets/svg/remix/close-line.svg"></i>
				</button>
			</div>
			<div
				class="builder-sidebar-content"
				src="/apps/builder/components/left-panel/index.html"></div>
		</aside>

		<section
			content_id="canvas"
			class="app-panel builder-canvas"
			aria-label="Builder preview">
			<div class="canvas-container">
				<div
					class="builder-position-trigger"
					position-events="click"
					position-query="iframe $clickedElement $matches *"
					position-element="$top .builder-selection-toolbar"
					position-box="element">
					<div
						class="builder-position-trigger"
						position-events="mouseover, mousemove, mouseout"
						position-query="iframe $hoveredElement $matches *"
						position-element="$top .builder-hover-toolbar"
						position-box="element">
						<div
							class="builder-position-trigger"
							position-events="selectionchange"
							position-query="iframe $selection"
							position-element="$top .builder-richtext-toolbar"
							position-box="text">
							<iframe
								editor="dom"
								title="Builder page preview"
								sortable
								id="canvas"
								state-id="builder"
								array="files"
								object="6a99ae37c87961219462f30a"
								key="src"
								crdt="true"
								update="false"></iframe>
						</div>
					</div>
				</div>
			</div>
		</section>

		<aside
			id="menuR"
			class="builder-sidebar builder-sidebar-right show"
			aria-label="Builder properties">
			<div class="builder-sidebar-header">
				<h6 class="mb-0">Properties</h6>
				<button
					type="button"
					class="list-toolbar-control list-toolbar-icon btn btn-light builder-sidebar-close"
					aria-label="Close properties panel"
					title="Close properties panel"
					click-query="#menuR"
					click.class="show,hide">
					<i src="/assets/svg/remix/close-line.svg"></i>
				</button>
			</div>
			<input
				type="hidden"
				attribute="eid" />
			<div
				class="builder-sidebar-content"
				src="/apps/builder/components/right-panel/index.html"></div>
		</aside>
	</div>

	<!-- Selected Toolbar -->
	<toolbar
		config-key="selectable"
		class="builder-overlay-toolbar builder-selection-toolbar position-absolute pe-none"
		hidden>
		<tools
			class="builder-overlay-tools d-flex justify-content-between w-100">
			<span
				class="builder-element-label"
				tagname></span>
			<div class="builder-element-actions d-flex align-items-center">
				<span
					actions="cloneElement"
					class="builder-element-action"
					title="Duplicate element"
					><i src="/assets/svg/clone.svg"></i
				></span>
				<span
					click-query="$closest .builder-selection-toolbar"
					click.$position.element.editor.remove=""
					class="builder-element-action"
					title="Delete element"
					aria-label="Delete element"
					><i src="/assets/svg/trash-alt.svg"></i
				></span>
				<span
					actions="previousElement"
					class="builder-element-action"
					title="Move element up"
					><i src="/assets/svg/arrow-up.svg"></i
				></span>
				<span
					actions="nextElement"
					class="builder-element-action"
					title="Move element down"
					><i src="/assets/svg/arrow-down.svg"></i
				></span>
			</div>
		</tools>
		<div class="builder-selection-outline"></div>
	</toolbar>

	<!-- Hover Toolbar -->
	<toolbar
		config-key="hoverable"
		class="builder-overlay-toolbar builder-hover-toolbar position-absolute pe-none"
		hidden>
		<tools class="builder-overlay-tools d-flex align-items-center">
			<span
				class="builder-element-label"
				tagname></span>
		</tools>
		<div class="builder-hover-outline"></div>
	</toolbar>
	<!-- End Hover Toolbar -->

	<!-- Collaboration Toolbar -->
	<div
		config-key="editable"
		class="toolbar builder-richtext-toolbar position-absolute pe-none"
		hidden>
		<tools class="builder-richtext-tools d-flex align-items-center">
			<label
				class="builder-richtext-action"
				id="bold-button"
				title="Bold">
				<input
					type="checkbox"
					value="fw-bold"
					editor-query="$document #canvas $contentDocument $clickedElement"
					editor-type="attribute"
					editor.class="$value"
					aria-label="Bold" />
				<i src="/assets/svg/bold.svg"></i>
			</label>
			<label
				class="builder-richtext-action"
				id="italic-button"
				title="Italic">
				<input
					type="checkbox"
					value="fst-italic"
					editor-query="$document #canvas $contentDocument $clickedElement"
					editor-type="attribute"
					editor.class="$value"
					aria-label="Italic" />
				<i src="/assets/svg/italic.svg"></i>
			</label>
			<div
				id="link-button"
				class="builder-richtext-action"
				click-query="#link"
				click.class="show,hide">
				<i src="/assets/svg/link.svg"></i>
			</div>
			<div
				id="link"
				class="builder-richtext-link-form position-absolute d-flex align-items-center hide">
				<input
					type="text"
					key=""
					editor-query="$document #canvas $contentDocument $clickedElement"
					editor-type="attribute"
					editor.href="$value"
					aria-label="Link URL"
					class="form-control" />
				<div
					class="builder-richtext-action"
					click-query="#link"
					click.class="show,hide">
					<i src="/assets/svg/times.svg"></i>
				</div>
			</div>
			<label
				class="builder-richtext-action"
				id="quote-button"
				title="Block quote">
				<input
					type="radio"
					name="builder-element-tag"
					key="builder-element-tag"
					value="q"
					editor-query="$document #canvas $contentDocument $clickedElement"
					editor-type="element"
					aria-label="Quote" />
				<i src="/assets/svg/quote-right.svg"></i>
			</label>
			<div
				id="heading-btn"
				class="builder-richtext-action"
				hover.style="width:fit-content"
				hover-query="#headings">
				<i src="/assets/svg/heading.svg"></i>
			</div>
			<div
				id="headings"
				class="builder-richtext-heading-options"
				hover-query="#headings"
				hover.style="width:fit-content">
				<label
					class="builder-richtext-action"
					id="header-1-button"
					title="Heading 1">
					<input
						type="radio"
						name="builder-element-tag"
						key="builder-element-tag"
						value="h1"
						editor-query="$document #canvas $contentDocument $clickedElement"
						editor-type="element"
						aria-label="Heading 1" />
					<i src="/assets/svg/heading.svg"></i><sub>1</sub>
				</label>
				<label
					class="builder-richtext-action"
					id="header-2-button"
					title="Heading 2">
					<input
						type="radio"
						name="builder-element-tag"
						key="builder-element-tag"
						value="h2"
						editor-query="$document #canvas $contentDocument $clickedElement"
						editor-type="element"
						aria-label="Heading 2" />
					<i src="/assets/svg/heading.svg"></i><sub>2</sub>
				</label>
				<label
					class="builder-richtext-action"
					id="header-3-button"
					title="Heading 3">
					<input
						type="radio"
						name="builder-element-tag"
						key="builder-element-tag"
						value="h3"
						editor-query="$document #canvas $contentDocument $clickedElement"
						editor-type="element"
						aria-label="Heading 3" />
					<i src="/assets/svg/heading.svg"></i><sub>3</sub>
				</label>
				<label
					class="builder-richtext-action"
					id="header-4-button"
					title="Heading 4">
					<input
						type="radio"
						name="builder-element-tag"
						key="builder-element-tag"
						value="h4"
						editor-query="$document #canvas $contentDocument $clickedElement"
						editor-type="element"
						aria-label="Heading 4" />
					<i src="/assets/svg/heading.svg"></i><sub>4</sub>
				</label>
				<label
					class="builder-richtext-action"
					id="header-5-button"
					title="Heading 5">
					<input
						type="radio"
						name="builder-element-tag"
						key="builder-element-tag"
						value="h5"
						editor-query="$document #canvas $contentDocument $clickedElement"
						editor-type="element"
						aria-label="Heading 5" />
					<i src="/assets/svg/heading.svg"></i><sub>5</sub>
				</label>
				<label
					class="builder-richtext-action"
					id="header-6-button"
					title="Heading 6">
					<input
						type="radio"
						name="builder-element-tag"
						key="builder-element-tag"
						value="h6"
						editor-query="$document #canvas $contentDocument $clickedElement"
						editor-type="element"
						aria-label="Heading 6" />
					<i src="/assets/svg/heading.svg"></i><sub>6</sub>
				</label>
			</div>
			<div
				id="show-controls"
				class="builder-richtext-action"
				click-query="#sidebar-controls"
				click.class="show,hide">
				<i src="/assets/svg/plus.svg"></i>
			</div>
			<div
				id="sidebar-controls"
				class="builder-richtext-control-group hide">
				<div
					id="image-button"
					class="builder-richtext-action">
					<i src="/assets/svg/camera.svg"></i>
				</div>
				<div
					id="video-button"
					class="builder-richtext-action">
					<i src="/assets/svg/play.svg"></i>
				</div>
				<div
					id="tweet-button"
					class="builder-richtext-action">
					<i src="/assets/svg/twitter.svg"></i>
				</div>
				<div
					id="divider-button"
					class="builder-richtext-action">
					<i src="/assets/svg/minus.svg"></i>
				</div>
			</div>
		</tools>
		<div class="height:100% width:100% pointer-events:none"></div>
	</div>
	<!-- End Collaboration Toolbar -->

	<!-- element-config -->
	<script
		config-query="iframe; html"
		array=""
		object=""
		key="">
		[
			{
				selector: "*",
				draggable: true,
				droppable: true,
				selectable: true,
				hoverable: true
			},
			{ selector: "html, head", droppable: true },
			{
				selector: "body",
				droppable: true,
				selectable: true,
				hoverable: true
			},
			{
				selector: "h1, h2, h3, h4, h5, h6, p, span, blockquote",
				editable: true,
				draggable: true,
				selectable: true,
				hoverable: true,
				mouseover: true
			},
			{
				selector: "input, textarea, select",
				draggable: true,
				selectable: true,
				hoverable: true
			},
			{
				selector: "div.nav",
				tagname: "navbar",
				draggable: true,
				droppable: true,
				selectable: true,
				hoverable: true
			},
			{ selector: "div.floating-label_field", draggable: true },
			{
				selector: "a.menu_icon",
				tagname: "icon",
				draggable: true,
				selectable: true,
				hoverable: true
			},
			{ selector: "a.menu_icon span", selectable: false }
		];
	</script>

	<!-- element-config Example using html elements and attributes to define config -->

	<!--    <config selector="h1, h2, h3, h4, h5, h6, p, span, blockquote" editable="true" draggable="true" selectable="true" hoverable="true" mouseover="true"></config>-->
	<!--</element-config>-->
</div>
