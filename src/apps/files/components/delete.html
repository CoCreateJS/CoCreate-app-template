<div
	id="delete-file-modal"
	class="dialog fade zoomIn"
	tabindex="-1"
	role="dialog"
	aria-modal="true"
	aria-hidden="true"
	aria-labelledby="delete-file-modal-label"
	aria-describedby="delete-file-modal-description">
	<form
		class="card"
		state-id="delete-file-record"
		array=""
		object=""
		autocomplete="off"
		aria-close-on="outside">
		<div class="card-body">
			<input
				type="hidden"
				state-id="delete-file-record"
				array="files"
				object=""
				key="deleted.by"
				value="$user_id"
				read="false" />
			<input
				type="date"
				hidden
				now
				state-id="delete-file-record"
				array="files"
				object=""
				key="deleted.on"
				read="false" />

			<button
				id="delete-file-close"
				type="button"
				class="btn-close float-end"
				aria-label="Close"
				aria-controls="delete-file-modal"
				aria-expanded="true"
				aria-close></button>

			<div class="mt-2 text-center">
				<lord-icon
					src="/assets/icons/gsqxdxog.json"
					trigger="loop"
					colors="primary:#f7b84b,secondary:#f06548"
					style="width: 100px; height: 100px"></lord-icon>
				<div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
					<h4 id="delete-file-modal-label">Move to Trash?</h4>
					<p
						id="delete-file-modal-description"
						class="text-muted mx-4 mb-0">
						This file or folder will be moved to Trash.
					</p>
				</div>
			</div>

			<div class="d-flex gap-2 justify-content-center mt-4 mb-2">
				<button
					type="button"
					class="btn w-sm btn-light"
					aria-controls="delete-file-modal"
					aria-expanded="true"
					aria-close>
					Cancel
				</button>
				<button
					type="button"
					class="btn w-sm btn-danger"
					save-query='$document #delete-file-modal form[object]:not([object=""]), $document body:has(#delete-file-modal form[object=""]) #list-view [role="row"]:is([aria-selected="true"], :has(input[type="checkbox"][name="selected[]"]:checked)):not([template],[hidden]):not(:is([template], [hidden]) *) form:has([key="deleted.on"])[]'
					actions="disabled, save, action($document #delete-file-close), disabled">
					Move to Trash
				</button>
			</div>
		</div>
	</form>
</div>
