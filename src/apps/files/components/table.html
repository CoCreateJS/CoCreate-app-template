<div class="app-panel component-list-table">
	<div
		class="h-100"
		scrollbar>
		<div class="table-card">
			<table
				id="table"
				role="grid"
				aria-label="Files"
				aria-multiselectable="true"
				class="table align-middle">
				<colgroup>
					<col class="table-selection-track" />
				</colgroup>
				<thead>
					<tr>
						<th class="table-selection-column" scope="col" aria-label="Select rows"></th>
						<th
							data-export-key="name"
							data-export-label="Name"
							scope="col">
							<div
								class="d-flex align-items-center justify-content-between gap-2">
								<span>Name</span>
								<a
									class="float-end"
									filter-query="$document #list-view [data-files-results][]"
									filter-sort-key="name"
									filter-sort-direction=""
									click
									click.filter-sort-direction="asc, desc">
									<i
										toggle.src="/assets/svg/sort-down.svg, /assets/svg/sort-up.svg"
										src="/assets/svg/sort.svg"></i>
								</a>
							</div>
						</th>
						<th
							data-export-key="content-type"
							data-export-label="Type"
							scope="col">
							<div
								class="d-flex align-items-center justify-content-between gap-2">
								<span>Type</span>
								<a
									class="float-end"
									filter-query="$document #list-view [data-files-results][]"
									filter-sort-key="content-type"
									filter-sort-direction=""
									click
									click.filter-sort-direction="asc, desc">
									<i
										toggle.src="/assets/svg/sort-down.svg, /assets/svg/sort-up.svg"
										src="/assets/svg/sort.svg"></i>
								</a>
							</div>
						</th>
						<th
							data-export-key="path"
							data-export-label="Folder"
							scope="col">
							<div
								class="d-flex align-items-center justify-content-between gap-2">
								<span>Folder</span>
								<a
									class="float-end"
									filter-query="$document #list-view [data-files-results][]"
									filter-sort-key="path"
									filter-sort-direction=""
									click
									click.filter-sort-direction="asc, desc">
									<i
										toggle.src="/assets/svg/sort-down.svg, /assets/svg/sort-up.svg"
										src="/assets/svg/sort.svg"></i>
								</a>
							</div>
						</th>
						<th
							data-export-key="pathname"
							data-export-label="Pathname"
							scope="col">
							<div
								class="d-flex align-items-center justify-content-between gap-2">
								<span>Pathname</span>
								<a
									class="float-end"
									filter-query="$document #list-view [data-files-results][]"
									filter-sort-key="pathname"
									filter-sort-direction=""
									click
									click.filter-sort-direction="asc, desc">
									<i
										toggle.src="/assets/svg/sort-down.svg, /assets/svg/sort-up.svg"
										src="/assets/svg/sort.svg"></i>
								</a>
							</div>
						</th>
						<th
							class="table-fill-column"
							aria-hidden="true"></th>
					</tr>
				</thead>
				<tbody
					class="form-check-all list-view"
					id="files-folders"
					state-id="files-folders"
					data-files-results
					data-files-kind="folders"
					hidden
					filter-query-key="content-type"
					filter-query-value="text/directory"
					filter-sort-key="name"
					filter-sort-direction="asc"
					array=""
					object
					filter-limit="20"
					render-query="tr[template]">
					<tr template role="row" array="{{object.$array[0]}}" object="{{object._id}}">
						<td class="table-selection-column">
							<form hidden>
								<input type="hidden" key="deleted.by" value="$user_id" array="{{object.$array[0]}}" object="{{object._id}}" read="false" />
								<input type="date" hidden now key="deleted.on" array="{{object.$array[0]}}" object="{{object._id}}" read="false" />
							</form>
							<div class="form-check mb-0">
								<input
									class="form-check-input"
									type="checkbox"
									name="selected[]"
									value="{{object._id}}"
									array="{{object.$array[0]}}"
									object="{{object._id}}"
									aria-label="Select row {{object._id}}" />
							</div>
						</td>
						<td>
							<span
								class="files-record-name"
								data-file-kind="{{object.content-type}}">
								<a
									class="files-folder-link text-reset text-decoration-none"
									role="button"
									tabindex="0"
									state='{"files-folders":{"hidden":false,"array":"files"},"files-list":{"filter-query-key":"content-type.$ne","filter-query-value":"text/directory","filter-sort-key":"name","filter-sort-direction":"asc"},"files-path":{"value":"{{object.pathname}}"}}'
									>{{object.name}}</a
								>
								<a
									class="files-file-link text-reset text-decoration-none"
									role="button"
									tabindex="0"
									state-to="offcanvas-app-view"
									state.src="/apps/files/app.html"
									aria-controls="offcanvas-app"
									aria-open
									><span
										hidden
										state-to="offcanvas-app-form"
										state.array="files"
										state.object="{{object._id}}"></span
									>{{object.name}}</a
								>
							</span>
						</td>
						<td>{{object.content-type}}</td>
						<td><code>{{object.path}}</code></td>
						<td><code>{{object.pathname}}</code></td>
						<td
							class="table-fill-column"
							aria-hidden="true"></td>
					</tr>
				</tbody>
				<tbody
					class="form-check-all list-view"
					id="files-list"
					state-id="files-list"
					data-files-results
					data-files-kind="files"
					filter-query-key="content-type.$ne"
					filter-query-value="text/directory"
					filter-sort-key="name"
					filter-sort-direction="asc"
					array="files"
					object
					filter-limit="20"
					render-query="tr[template]">
					<tr template role="row" array="{{object.$array[0]}}" object="{{object._id}}">
						<td class="table-selection-column">
							<form hidden>
								<input type="hidden" key="deleted.by" value="$user_id" array="{{object.$array[0]}}" object="{{object._id}}" read="false" />
								<input type="date" hidden now key="deleted.on" array="{{object.$array[0]}}" object="{{object._id}}" read="false" />
							</form>
							<div class="form-check mb-0">
								<input
									class="form-check-input"
									type="checkbox"
									name="selected[]"
									value="{{object._id}}"
									array="{{object.$array[0]}}"
									object="{{object._id}}"
									aria-label="Select row {{object._id}}" />
							</div>
						</td>
						<td>
							<span
								class="files-record-name"
								data-file-kind="{{object.content-type}}">
								<a
									class="files-folder-link text-reset text-decoration-none"
									role="button"
									tabindex="0"
									state='{"files-folders":{"hidden":false,"array":"files"},"files-list":{"filter-query-key":"content-type.$ne","filter-query-value":"text/directory","filter-sort-key":"name","filter-sort-direction":"asc"},"files-path":{"value":"{{object.pathname}}"}}'
									>{{object.name}}</a
								>
								<a
									class="files-file-link text-reset text-decoration-none"
									role="button"
									tabindex="0"
									state-to="offcanvas-app-view"
									state.src="/apps/files/app.html"
									aria-controls="offcanvas-app"
									aria-open
									><span
										hidden
										state-to="offcanvas-app-form"
										state.array="files"
										state.object="{{object._id}}"></span
									>{{object.name}}</a
								>
							</span>
						</td>
						<td>{{object.content-type}}</td>
						<td><code>{{object.path}}</code></td>
						<td><code>{{object.pathname}}</code></td>
						<td
							class="table-fill-column"
							aria-hidden="true"></td>
					</tr>
					<tr
						style="height: 20px"
						filter-limit="10"
						filter-on="scroll"
						filter-query="$parent"></tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
<!--end card-->
