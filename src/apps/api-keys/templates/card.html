<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/key-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.avatar[0].src}}"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/api-keys/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-label="Open API key {{object.name}}"
							aria-open><span hidden state-to="offcanvas-app-form" state.array="keys" state.object="{{object._id}}"></span> {{object.name}}</a>
					</h5>
				</div>
				<div class="app-badges">
					<span class="badge app-badge" aria-label="Type" key="type" data-value="{{object.type}}">{{object.type}}</span>
					<span
						class="badge app-badge"
						role="status"
						aria-label="API key status"
						key="status"
						data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
		</div>
	</article>
</template>
<div onload.array="keys" onload-query="$parent"></div>
