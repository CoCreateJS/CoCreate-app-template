<article class="card app-card">
	<div class="app-card-body">
		<div class="app-heading">
			<div class="app-identity">
				<span class="app-image">
					<span class="app-icon">
						<i src="/assets/svg/remix/file-list-3-line.svg" aria-hidden="true"></i>
					</span>
					<img
						class="app-custom-image"
						key="avatar[0].src"
						alt=""
						hidden
						onload="this.hidden = false"
						onerror="this.hidden = true" />
				</span>
				<h5 class="app-title" key="title"></h5>
			</div>
			<span class="text-muted fs-12" key="client_name"></span>
			<div class="app-badges">
				<span
					class="badge app-badge"
					key="payment_status"
					data-value
					input.data-value="$value"
					input.value="$value"></span>
			</div>
		</div>
		<p class="app-description" key="notes"></p>
		<div class="d-flex flex-wrap gap-3">
			<div>
				<span class="text-muted fs-12 d-block">Estimate</span>
				<strong key="estimate_no"></strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Total</span>
				<strong key="total_amount"></strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Paid</span>
				<strong key="amount_total_pay"></strong>
			</div>
		</div>
		<div
			class="d-flex justify-content-between gap-3 pt-2 border-top border-top-dashed text-muted fs-12">
			<span>
				<i src="/assets/svg/remix/calendar-line.svg" class="me-1"></i>
				<span key="dat"></span>
			</span>
			<span>
				<i src="/assets/svg/remix/bank-card-line.svg" class="me-1"></i>
				<span key="payment_method"></span>
			</span>
		</div>
	</div>
</article>
