<div
	id="estimates-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Estimates record">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="Estimates"
		value-type="outerHtml"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0">
		<div
			id="Estimates-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="Estimates-details-btn"
			tabindex="0"
			aria-hidden="false"
			state-id="estimates-details"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				class="app-details"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/apps/estimates/components/details.html"></div>
				</div>
			</form>
		</div>
		<div
			id="Estimates-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="Estimates-form-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="estimates-form"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				class="app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/apps/estimates/components/form.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
		<div
			id="Estimates-code-view"
			class="offcanvas-app-view"
			data-view="code"
			role="tabpanel"
			aria-labelledby="Estimates-code-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="estimates-code"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/components/offcanvas-app/code.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
	</div>
</div>
