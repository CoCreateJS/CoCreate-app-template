<div
	id="profile-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Profile record">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="Profile"
		value-type="outerHtml"></header>
	<div class="component-form-body flex-grow-1 min-height:0">
		<div
			id="Profile-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="Profile-details-btn"
			tabindex="0"
			aria-hidden="false"
			state-id="profile-details"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				class="app-details app-profile"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/apps/profile/components/details.html"></div>
				</div>
			</form>
		</div>
		<div
			id="Profile-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="Profile-form-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="profile-form"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				class="app-form app-profile"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/apps/profile/components/form.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
		<div
			id="Profile-code-view"
			class="offcanvas-app-view"
			data-view="code"
			role="tabpanel"
			aria-labelledby="Profile-code-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="profile-code"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/components/offcanvas-app/code.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
	</div>
</div>
