<div class="app-card-body">
	<div class="app-heading">
		<div class="app-identity">
			<span class="app-image">
				<span class="app-icon bg-secondary-subtle text-secondary">
					<span class="avatar-initial" key="first_name[0]"></span>
					<span class="avatar-initial" key="last_name[0]"></span>
					<img
						class="app-custom-image object-fit-cover"
						key="avatar[0].src"
						alt="Profile photo"
						hidden
						onload="this.hidden = false"
						onerror="this.hidden = true" />
				</span>
			</span>
			<h5 class="app-title">
				<span key="first_name"></span>
				<span key="last_name"></span>
			</h5>
		</div>
	</div>
	<p class="text-muted mb-0" key="title"></p>
	<div class="d-flex flex-wrap gap-2 text-muted">
		<span>
			<i src="/assets/svg/remix/building-line.svg" class="me-1" aria-hidden="true"></i>
			<span key="company"></span>
		</span>
		<span><i src="/assets/svg/remix/map-pin-user-line.svg" class="me-1" aria-hidden="true"></i><span key="city"></span>, <span key="country"></span></span>
	</div>
</div>
