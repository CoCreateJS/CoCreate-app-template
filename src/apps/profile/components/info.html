<h6 class="text-muted text-uppercase fw-semibold mb-3">Info</h6>
<dl class="app-fields d-flex flex-wrap gap-3 mb-0">
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Full name</dt>
		<dd class="mb-0 text-break">
			<span
				array="contacts"
				object="$user_id"
				key="first_name"></span>
			<span
				array="contacts"
				object="$user_id"
				key="last_name"></span>
		</dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Company</dt>
		<dd class="mb-0 text-break">
			<span
				array="contacts"
				object="$user_id"
				key="company"></span>
		</dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Title</dt>
		<dd class="mb-0 text-break">
			<span
				array="contacts"
				object="$user_id"
				key="title"></span>
		</dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Mobile</dt>
		<dd class="mb-0 text-break">
			<span
				array="contacts"
				object="$user_id"
				key="phone_number"></span>
		</dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Email</dt>
		<dd class="mb-0 text-break">
			<span
				array="contacts"
				object="$user_id"
				key="email"></span>
		</dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Location</dt>
		<dd class="mb-0 text-break">
			<span
				array="contacts"
				object="$user_id"
				key="city"></span
			>,
			<span
				array="contacts"
				object="$user_id"
				key="country"></span>
		</dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Joining date</dt>
		<dd class="mb-0 text-break">
			<span
				array="contacts"
				object="$user_id"
				key="created.on"></span>
		</dd>
	</div>
</dl>
