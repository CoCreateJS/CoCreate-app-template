<div class="card">
	<div class="card-body">
		<div class="d-flex align-items-center mb-4">
			<div class="flex-grow-1">
				<h5 class="card-title mb-0">Popular Posts</h5>
			</div>
			<div class="flex-shrink-0">
				<div class="dropdown">
					<a
						href="#"
						role="button"
						id="dropdownMenuLink1"
						aria-expanded="false" aria-haspopup="menu" aria-controls="dropdownMenuLink1-menu">
						<i src="/assets/svg/remix/more-2-fill.svg" class="fs-14"></i>
					</a>

					<ul
						class="dropdown-menu dropdown-menu-end"
						aria-close-on="anywhere"
						aria-labelledby="dropdownMenuLink1" id="dropdownMenuLink1-menu" aria-hidden="true">
						<li><a class="dropdown-item" href="#">View</a></li>
						<li><a class="dropdown-item" href="#">Edit</a></li>
						<li><a class="dropdown-item" href="#">Delete</a></li>
					</ul>
				</div>
			</div>
		</div>

		<!-- Container for dynamically rendered posts -->
		<div
			class="d-flex flex-column gap-4"
			array="posts"
			object
			filter-limit="3"
			render-query="#postTemplate"
			render-as="post">
			<template id="postTemplate">
				<div class="d-flex">
					<div class="flex-shrink-0">
						<img
							src="{{post.image_src}}"
							alt=""
							height="50"
							class="rounded" />
					</div>
					<div class="flex-grow-1 ms-3 overflow-hidden">
						<a href="{{post.href}}">
							<h6 class="text-truncate fs-14">{{post.title}}</h6>
						</a>
						<p class="text-muted mb-0">{{post.date_display}}</p>
					</div>
				</div>
			</template>
		</div>
	</div>
	<!--end card-body-->
</div>
<!--end card-->
