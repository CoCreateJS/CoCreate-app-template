<article class="card app-card">
	<div class="app-card-body">
		<div class="app-heading">
			<div class="app-identity">
				<span class="app-image">
					<span class="app-icon">
						<i src="/assets/svg/remix/shopping-bag-line.svg" aria-hidden="true"></i>
					</span>
					<img
						class="app-custom-image"
						key="images[0].src"
						alt=""
						hidden
						onload="this.hidden = false"
						onerror="this.hidden = true" />
				</span>
				<h5 class="app-title" key="name"></h5>
			</div>
			<span class="text-muted fs-12" key="category"></span>
			<div class="app-badges">
				<span
					class="badge app-badge"
					key="status"
					data-value
					input.data-value="$value"
					input.value="$value"></span>
			</div>
		</div>
		<p class="app-description" key="short_description"></p>
		<div class="d-flex flex-wrap gap-3">
			<div>
				<span class="text-muted fs-12 d-block">Price</span>
				<strong key="price"></strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Stock</span>
				<strong key="stock"></strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Orders</span>
				<strong key="orders"></strong>
			</div>
		</div>
		<div
			class="d-flex justify-content-between gap-3 pt-2 border-top border-top-dashed text-muted fs-12">
			<span>
				<i src="/assets/svg/remix/building-line.svg" class="me-1"></i>
				<span key="manufacturer.name"></span>
			</span>
			<span>
				<i src="/assets/svg/remix/price-tag-3-line.svg" class="me-1"></i>
				<span key="type"></span>
			</span>
		</div>
	</div>
</article>
