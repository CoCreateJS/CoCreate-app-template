<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/shopping-bag-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.images[0].src}}"
							alt=""
							onload="this.hidden = false"
							onerror="this.hidden = true"
							hidden />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/items/app.html"
							aria-controls="offcanvas-app"
							aria-open
							aria-haspopup="dialog"
							aria-expanded="false"><span state-to="offcanvas-app-form" state.array="items" state.object="{{object._id}}" hidden></span>{{object.name}}</a>
					</h5>
				</div>
				<span class="text-muted fs-12">{{object.category}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="status" data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<p class="app-description">{{object.short_description}}</p>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Price</span>
					<strong>{{object.price}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Stock</span>
					<strong>{{object.stock}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Orders</span>
					<strong>{{object.orders}}</strong>
				</div>
			</div>
			<div
				class="d-flex justify-content-between gap-3 pt-2 border-top border-top-dashed text-muted fs-12">
				<span><i src="/assets/svg/remix/building-line.svg" class="me-1"></i>{{object.manufacturer.name}}</span>
				<span><i src="/assets/svg/remix/price-tag-3-line.svg" class="me-1"></i>{{object.type}}</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="items" onload-query="$parent"></div>
