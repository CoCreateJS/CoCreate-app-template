<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="{{object.icon}}" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.avatar[0].src}}"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-form"
							state.array="apps"
							state.object="{{object._id}}"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-open><span hidden state-to="offcanvas-app-view" state.src="/apps/apps/app.html"></span> {{object.name}}</a>
					</h5>
				</div>
				<div class="app-badges">
					<span class="badge app-badge" key="category" data-value="{{object.category}}">{{object.category}}</span>
					<span
						class="badge app-badge"
						role="status"
						aria-label="Enabled status"
						key="enabled"
						data-value="{{object.enabled}}"
						onload.value="$(`{{object.enabled}}` === 'true' ? 'Enabled' : 'Disabled')"></span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
			<div
				class="d-flex flex-wrap align-items-center gap-2 text-muted fs-12 pt-2 border-top border-top-dashed"
				style="margin-top: auto">
				<span
					class="d-flex align-items-center gap-1 min-width:0"
					style="flex: 1 1 10rem"
					title="{{object.path}}">
					<i src="/assets/svg/remix/folder-line.svg" class="flex-shrink-0" aria-hidden="true"></i>
					<span class="text-truncate">{{object.path}}</span>
				</span>
				<span
					class="d-flex align-items-center gap-1 ms-auto min-width:0"
					style="max-width: 100%"
					title="Array: {{object.array}}">
					<i src="/assets/svg/remix/database-2-line.svg" class="flex-shrink-0" aria-hidden="true"></i>
					<span class="visually-hidden">Array:</span>
					<span class="text-truncate">{{object.array}}</span>
				</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="apps" onload-query="$parent"></div>
