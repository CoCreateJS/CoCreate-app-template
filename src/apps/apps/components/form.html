<div
	class="card-body flex-grow-1 min-height:0"
	scrollbar>
	<div class="w-100">
		<div
			class="app-image-editor"
			src="/components/profile-img.html"></div>
	</div>
	<div class="d-flex flex-column gap-3 pt-3">
		<label
			class="form-label"
			id="name-label">
			Name
			<input
				type="text"
				key="name"
				name="name"
				class="form-control"
				placeholder="Enter name"
				aria-labelledby="name-label" />
		</label>

		<label
			class="form-label"
			id="singular-name-label">
			Singular Name
			<input
				type="text"
				key="singularName"
				name="singularName"
				class="form-control"
				placeholder="Enter singular name"
				aria-labelledby="singular-name-label" />
		</label>

		<label
			class="form-label"
			id="path-label">
			Path
			<input
				type="text"
				key="path"
				name="path"
				class="form-control"
				placeholder="Enter path"
				aria-labelledby="path-label" />
		</label>

		<label
			class="form-label"
			id="array-label">
			Array
			<input
				type="text"
				key="array"
				name="array"
				class="form-control"
				placeholder="Enter array name"
				aria-labelledby="array-label" />
		</label>

		<label
			class="form-label"
			id="main-views-label">
			Main Views
			<select
				class="form-control"
				key="mainViews"
				name="mainViews"
				multiple
				aria-labelledby="main-views-label">
				<option value="table">Table</option>
				<option value="grid">Grid</option>
				<option value="kanban">Kanban</option>
			</select>
		</label>

		<label
			class="form-label"
			id="secondary-views-label">
			Secondary Views
			<select
				class="form-control"
				key="secondaryViews"
				name="secondaryViews"
				multiple
				aria-labelledby="secondary-views-label">
				<option value="details">Details</option>
				<option value="form">Form</option>
			</select>
		</label>
		<div src="/apps/apps/components/fieldBuilder.html"></div>
	</div>
</div>
