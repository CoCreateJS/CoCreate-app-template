<style>
	/* Hide delete buttons by default */
	.attribute-item:hover .children-item:hover {
		background: rgba(0, 0, 0, 0.05);
	}

	/* Hide delete buttons by default */
	.attribute-item .delete-btn,
	.children-item .delete-btn {
		display: none;
		opacity: 0;
		transition: opacity 0.2s ease-in-out;
	}

	/* Show delete buttons on hover */
	.attribute-item:hover .delete-btn,
	.children-item:hover .delete-btn {
		display: inline-block;
		opacity: 1;
	}

	/* Ensure containers take full width */
	.attributes-container,
	.children-container,
	.attributes-container .attribute-item,
	.children-container .children-item {
		width: 100%;
	}
</style>

<div
	id="field-editor"
	class="accordion"
	array="apps"
	object
	key="fields"
	render-query="[template]"
	sortable
	aria-label="Field Editor"
	title="Manage fields, including their attributes and nested elements. Drag and drop to reorder fields.">
	<!-- Template for accordion items -->
	<div
		class="accordion-item template draggable sortable"
		template
		aria-label="Field Item"
		title="Drag to reorder this field."
		dnd-group-name="fields">
		<div class="accordion-header d-flex align-items:center p-3">
			<span
				class="cursor:move px-1 bg-light rounded"
				aria-label="Drag Handle"
				title="Drag handle for reordering."
				drag-handle
				>: :</span
			>
			<span
				contenteditable="true"
				placeholder="Label"
				key="fields[].label"
				class="border-0 bg-transparent p-1 ms-2"
				aria-label="Field Label"
				title="Click to edit the field label.">
				{{fields.label}}
			</span>
			<button
				class="accordion-toggle btn btn-sm"
				aria-controls="field-{{fields.label}}"
				aria-expanded="false"
				aria-haspopup="true"
				title="Expand or collapse this field.">
				<i src="/assets/svg/remix/arrow-down-s-line.svg"></i>
			</button>
		</div>

		<div
			id="field-{{fields.label}}"
			class="accordion-collapse collapse"
			aria-labelledby="field-{{fields.label}}"
			aria-hidden="true"
			title="Field details.">
			<div class="accordion-body">
				<div class="field-body d-flex flex-wrap gap:20px">
					<!-- Tag Name Input -->
					<floating-label class="w-100">
						<input
							type="text"
							placeholder="Tag Name (e.g., input, select, textarea)"
							key="fields[].tagName"
							value="{{fields.tagName}}"
							class="w-100"
							aria-label="Tag Name"
							title="Enter the tag name for this field (e.g., input, select, textarea)." />
					</floating-label>

					<datalist id="tagName-options">
						<option value="input"></option>
						<option value="select"></option>
						<option value="textarea"></option>
						<option value="div"></option>
					</datalist>

					<!-- Attributes Section Start -->
					<div
						class="attributes-container accordion-item w-100 d-flex flex-column"
						aria-label="Attributes Container"
						title="Manage attributes for this field. Drag and drop to reorder attributes.">
						<div
							class="accordion-header d-flex align-items:center p-2 bg-light rounded">
							<span
								class="flex-grow:1"
								aria-label="Attributes Section"
								title="Click to expand or collapse attributes.">
								Attributes
							</span>
							<button
								class="btn btn-sm accordion-toggle"
								aria-controls="attributes-section-{{fields.label}}"
								aria-expanded="false"
								aria-haspopup="true"
								title="Expand or collapse the attributes section.">
								<i src="/assets/svg/remix/arrow-down-s-line.svg"></i>
							</button>
						</div>

						<div
							id="attributes-section-{{fields.label}}"
							class="accordion-collapse collapse p-3"
							aria-hidden="true"
							title="Attributes Section"
							sortable
							dnd-group-name="attributes">
							<div
								class="attribute-item d-flex gap:10px align-items:center height:30px"
								render="fields.attributes"
								render-as="fieldAttr"
								template
								draggable
								aria-label="Attribute Item"
								title="Drag to reorder this attribute.">
								<span
									class="cursor:move px-1 bg-light rounded"
									aria-label="Drag Handle"
									title="Drag handle for reordering."
									drag-handle
									>: :</span
								>
								<span>
									<span
										contenteditable="true"
										placeholder="Attribute Name (e.g., id)"
										key="fields[].attributes[].name"
										class="p-1"
										aria-label="Attribute Name"
										title="Click to edit the attribute name.">
										{{fieldAttr.name}}
									</span>
									=
									<span
										contenteditable="true"
										placeholder="Attribute Value"
										key="fields[].attributes[].value"
										class="p-1"
										aria-label="Attribute Value"
										title="Click to edit the attribute value.">
										{{fieldAttr.value}}
									</span>
								</span>
								<button
									type="button"
									class="btn btn-sm ms-auto delete-btn"
									click-query="$parent"
									click.$remove=""
									aria-label="Remove Attribute"
									title="Click to remove this attribute.">
									<i src="/assets/svg/remix/delete-bin-line.svg"></i>
								</button>
							</div>
							<div
								class="attribute-item d-flex gap:10px align-items:center new-attribute-row"
								aria-label="New Attribute Row"
								title="Add a new attribute."
								draggable="false">
								<span
									class="px-1 bg-light rounded"
									role="button"
									tabindex="0"
									aria-label="Add new attribute"
									title="Add a new attribute to this field. Click or press Enter to add.">
									<i src="/assets/svg/remix/add-line.svg"></i>
								</span>
								<span
									contenteditable="true"
									placeholder="Attribute Name (e.g., id)"
									class="p-1 min-width:50px"
									aria-label="New Attribute Name"
									title="Enter the name for the new attribute.">
								</span>
								=
								<span
									contenteditable="true"
									placeholder="Attribute Value"
									class="p-1 min-width:50px"
									aria-label="New Attribute Value"
									title="Enter the value for the new attribute.">
								</span>
							</div>
						</div>
					</div>
					<!-- Attributes Section End -->

					<!-- Nested Elements Section -->
					<div
						class="children-container accordion-item w-100 d-flex flex-column"
						sortable
						aria-label="Nested Elements Container"
						title="Manage nested elements for this field. Drag and drop to reorder nested elements.">
						<div
							class="accordion-header d-flex align-items:center p-2 bg-light rounded">
							<span
								class="flex-grow:1"
								aria-label="Children Section"
								title="Click to expand or collapse children.">
								Children
							</span>
							<button
								class="btn btn-sm accordion-toggle"
								aria-controls="children-section-{{fields.label}}"
								aria-expanded="false"
								aria-haspopup="true"
								title="Expand or collapse the children section.">
								<i src="/assets/svg/remix/arrow-down-s-line.svg"></i>
							</button>
						</div>
						<div
							id="children-section-{{fields.label}}"
							class="accordion-collapse collapse p-3 w-100"
							aria-hidden="true"
							title="Children Section">
							<div
								class="children-list w-100 d-flex flex-column gap:10px"
								sortable
								dnd-group-name="children"
								aria-label="List of Nested Elements"
								title="List of nested elements.">
								<div
									class="children-item d-flex flex-column gap:10px align-items:center"
									render="fields.children"
									render-as="child"
									draggable
									template
									aria-label="Nested Element Item"
									title="Drag to reorder this nested element.">
									<div
										class="d-flex align-items:center gap:10px height:30px width:100%">
										<span
											class="cursor:move px-1 bg-light rounded"
											aria-label="Drag Handle"
											title="Drag handle for reordering."
											drag-handle
											>: :</span
										>
										<span
											contenteditable
											placeholder="Tag Name (e.g., option)"
											class="px-1"
											key="fields[].children[].tagName"
											aria-label="Tag Name"
											title="Enter the tag name for this nested element (e.g., input, select, textarea)."
											>{{child.tagName}}</span
										>
										<button
											type="button"
											class="btn btn-sm ms-auto delete-btn"
											click-query="$parent"
											click.$remove=""
											aria-label="Remove Nested Element"
											title="Click to remove this nested element.">
											<i src="/assets/svg/remix/delete-bin-line.svg"></i>
										</button>
									</div>
									<div
										class="attributes-container accordion-item w-100 d-flex flex-column"
										aria-label="Child Attributes Container"
										title="Manage attributes for this field. Drag and drop to reorder attributes.">
										<div
											class="accordion-header d-flex align-items:center p-2 bg-light rounded">
											<span
												class="flex-grow:1"
												aria-label="Attributes Section"
												title="Click to expand or collapse attributes.">
												Attributes
											</span>
											<button
												class="btn btn-sm accordion-toggle"
												aria-controls="child-attributes-{{index}}"
												aria-expanded="false"
												aria-haspopup="true"
												title="Expand or collapse the attributes section.">
												<i src="/assets/svg/remix/arrow-down-s-line.svg"></i>
											</button>
										</div>

										<div
											id="child-attributes-{{index}}"
											class="accordion-collapse collapse p-3"
											aria-hidden="true"
											title="Attributes Section"
											sortable
											dnd-group-name="attributes">
											<div
												class="attribute-item d-flex gap:10px align-items:center height:30px"
												render="field.children.attributes"
												render-as="childAttr"
												template
												draggable
												aria-label="Attribute Item"
												title="Drag to reorder this attribute.">
												<span
													class="cursor:move px-1 bg-light rounded"
													aria-label="Drag Handle"
													title="Drag handle for reordering."
													drag-handle
													>: :</span
												>
												<span
													class="d-flex align-items:center">
													<span
														contenteditable="true"
														placeholder="Attribute Name (e.g., id)"
														key="fields[].children[].attributes[].name"
														class="p-1"
														aria-label="Attribute Name"
														title="Click to edit the attribute name.">
														{{childAttr.name}}
													</span>
													=
													<span
														contenteditable="true"
														placeholder="Attribute Value"
														key="fields[].children[].attributes[].value"
														class="p-1"
														aria-label="Attribute Value"
														title="Click to edit the attribute value.">
														{{childAttr.value}}
													</span>
												</span>
												<button
													type="button"
													class="btn btn-sm ms-auto delete-btn"
													click-query="$parent"
													click.$remove=""
													aria-label="Remove Attribute"
													title="Click to remove this attribute.">
													<i src="/assets/svg/remix/delete-bin-line.svg"></i>
												</button>
											</div>
											<div
												class="attribute-item d-flex gap:10px align-items:center new-attribute-row"
												aria-label="New Attribute Row"
												title="Add a new attribute."
												draggable="false">
												<span
													class="px-1 bg-light rounded"
													role="button"
													tabindex="0"
													aria-label="Add new attribute"
													title="Add a new attribute to this field. Click or press Enter to add.">
													<i src="/assets/svg/remix/add-line.svg"></i>
												</span>
												<span
													contenteditable="true"
													placeholder="Attribute Name (e.g., id)"
													class="p-1 min-width:50px"
													aria-label="New Attribute Name"
													title="Enter the name for the new attribute.">
												</span>
												=
												<span
													contenteditable="true"
													placeholder="Attribute Value"
													class="p-1 min-width:50px"
													aria-label="New Attribute Value"
													title="Enter the value for the new attribute.">
												</span>
											</div>
										</div>
									</div>
								</div>
								<div
									class="children-item d-flex gap:10px align-items:center new-children-row"
									aria-label="New Nested Element Row"
									title="Add a new nested element."
									draggable="false">
									<span
										class="px-1 bg-light rounded add-new-btn"
										role="button"
										tabindex="0"
										aria-label="Add new child element"
										title="Add a new child element to this field. Click or press Enter to add.">
										<i src="/assets/svg/remix/add-line.svg" aria-hidden="true"></i>
									</span>
									<span
										type="text"
										placeholder="Tag Name (e.g., option)"
										class="flex-grow:1 min-width:50px"
										aria-label="New Nested Element Tag Name"
										title="Enter the tag name for the new nested element."></span>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
