<link
	rel="stylesheet"
	href="/apps/apis/index.css" />
<link
	rel="stylesheet"
	href="/apps/apis/providers/index.css" />
<section
	class="card-body d-flex flex-column gap-4 min-height:100%"
	data-storage-providers-create>
	<header>
		<div>
			<h5 class="mb-1">Storage Providers</h5>
			<p class="text-muted mb-0">
				Configure your provider credentials. Enable the connections you
				want available to your organization.
			</p>
		</div>
	</header>
	<span
		id="cluster-storage-providers-error"
		class="text-danger small"
		hidden></span>
	<div
		id="cluster-storage-providers-list"
		state-id="apis-providers-list"
		class="d-flex flex-column gap-3"
		array="apis"
		object
		filter-query-key="type"
		filter-query-value="storage"
		filter-sort-key="name"
		filter-sort-direction="asc"
		filter-limit="0"
		render-query="template">
		<template>
			<article
				class="apis-provider-option border rounded position-relative">
				<div
					value-type="outerHTML"
					src="/apps/apis/providers/templates/card.html"></div>
			</article>
		</template>
	</div>
</section>
