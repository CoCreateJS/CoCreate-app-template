<label class="d-flex align-items-center gap-3 p-3 mb-0">
	<input
		type="radio"
		class="cluster-provision-data"
		name="{{object.type}}-provider"
		array="clusters"
		object
		key="{{object.type}}"
		value="{{object._id}}"
		get-value-type="string"
		input-query="$closest #provision-workflow #cluster-{{object.type}}-providers"
		input.value="$value" />
	<div class="flex-grow-1 min-width:0">
		<div
			value-type="outerHTML"
			src="/apps/apis/templates/list.html"></div>
	</div>
	<span
		data-storage-configured-badge
		class="badge bg-success-subtle text-success flex-shrink-0 pe-none">
		Configured
	</span>
</label>

<form
	class="apis-provider-fields border-top p-3"
	array="apis"
	object="{{object._id}}"
	autocomplete="off">
	<div
		value-type="outerHTML"
		src="/apps/apis/components/fields.html"></div>
	<div class="clearfix mt-3">
		<button
			class="btn btn-success btn-spinner float-end"
			aria-label="Save form"
			actions="validate, disabled, save, timeout(2000), disabled">
			<span
				class="spinner-border spinner-border-sm" hidden
				role="status"
				aria-hidden="true">
			</span>
			<span class="button-text">Save</span>
		</button>
	</div>
</form>
