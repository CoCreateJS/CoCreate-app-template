<div class="app-card-body">
	<div class="app-heading">
		<div class="app-identity">
			<span
				class="app-image"
				aria-hidden="true">
				<img
					key="icon"
					alt=""
					onload="this.hidden = false"
					onerror="this.hidden = true" />
				<img
					class="app-custom-image"
					key="avatar[0].src"
					alt=""
					hidden
					onload="this.hidden = false"
					onerror="this.hidden = true" />
			</span>
			<h5
				class="app-title"
				key="name"></h5>
		</div>
		<div class="app-badges">
			<span
				class="badge app-badge"
				key="type"
				data-value
				input.data-value="$value"
				input.value="$value"></span>
			<span
				class="badge app-badge"
				key="enabled"
				data-value
				input.data-value="$value"
				input.value="$(`$value` === 'true' ? 'Enabled' : 'Disabled')"></span>
		</div>
	</div>
	<p
		class="app-description"
		key="description"></p>
</div>
