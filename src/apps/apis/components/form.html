	<link
		rel="stylesheet"
		href="/components/code/index.css" />
	<div class="card-body d-flex flex-column gap-4 h-100">
		<section class="pb-3">
			<div
				class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-3">
				<div class="d-flex align-items-center gap-3">
					<div
						class="apis-image-editor position-relative flex-shrink-0"
						media-path="/media/logos/">
						<div src="/components/icon-img.html"></div>
					</div>
				</div>
				<label class="form-check form-switch mb-0">
					<input
						class="form-check-input"
						type="checkbox"
						role="switch"
						id="api-enabled"
						key="enabled" />
					<span class="form-check-label">Enabled</span>
				</label>
			</div>
			<div class="d-flex flex-wrap gap-3">
				<div class="w-100 min-width:0">
					<label
						class="form-label"
						for="api-name"
						>Name</label
					>
					<input
						type="text"
						id="api-name"
						key="name"
						class="form-control"
						placeholder="Production Stripe"
						required />
				</div>
				<div class="apis-form-field">
					<label
						class="form-label"
						for="api-provider"
						>Provider</label
					>
					<input
						type="text"
						id="api-provider"
						key="provider"
						class="form-control"
						placeholder="stripe"
						required
						input-query="$next"
						input-value="$value" />
					<input
						type="hidden"
						key="icon"
						data-provider-icon
						value-prefix="/assets/svg/providers/"
						value-suffix=".svg"
						input.src="$value"
						input-query="$next" />
					<div
						hidden
						src="">
						<input
							type="hidden"
							key="icon"
							data-provider-icon
							value="api"
							value-prefix="/assets/svg/providers/"
							value-suffix=".svg" />
					</div>
				</div>
				<div class="apis-form-field">
					<label
						class="form-label"
						for="api-type"
						>Type</label
					>
					<input
						type="text"
						id="api-type"
						name="api-integration-type"
						key="type"
						autocomplete="off"
						data-lpignore="true"
						data-1p-ignore
						class="form-control"
						placeholder="storage" />
				</div>
				<div class="w-100 min-width:0">
					<label
						class="form-label"
						for="api-description"
						>Description</label
					>
					<textarea
						height="auto"
						id="api-description"
						key="description"
						class="form-control"
						rows="3"
						placeholder="Describe this integration"
						required></textarea>
				</div>
			</div>
		</section>

		<section class="border-top border-top-dashed pt-3 pb-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">Base URL</h6>
			<pre class="border rounded p-3 mb-0 text-wrap text-break">
                <code type="code" lang="json" key="url" value-type="text" value-evaluate="false" aria-label="API base URL configuration" height="auto"></code>
            </pre>
		</section>

		<section class="border-top border-top-dashed pt-3 pb-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">
				<label
					for="api-headers"
					class="mb-0"
					>Credentials</label
				>
			</h6>
			<div src="/apps/apis/components/fields.html"></div>
		</section>

		<section class="border-top border-top-dashed pt-3 pb-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">
				<label
					for="api-headers"
					class="mb-0"
					>Request headers</label
				>
			</h6>
			<div class="component-code border rounded p-3">
				<pre
					aria-hidden="true"><code class="language-json"></code></pre>
				<textarea
					height="auto"
					type="code"
					lang="json"
					id="api-headers"
					key="headers"
					value-type="json"
					class="form-control font-monospace"
					height="auto"
					rows="1"
					spellcheck="false"
					value-evaluate="false"></textarea>
			</div>
		</section>
	</div>
