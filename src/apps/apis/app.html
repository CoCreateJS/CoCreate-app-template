<div
	id="apis-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Apis record">
	<span
		hidden
		observe
		observe-selector="#APIs-details-view, #APIs-form-view, #APIs-code-view, #offcanvas-app, #create-panel, #apis-aside form[state-id='offcanvas-app-form']"
		observe-attribute-filter="aria-hidden, hidden, object"
		observe-query="$parent [data-api-secret][]"
		observe.type="password"
		observe.get-value-decode="atob"></span>
	<link
		rel="stylesheet"
		href="/apps/apis/index.css" />
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="APIs"
		value-type="outerHtml"></header>
	<div class="component-form-body flex-grow-1 min-height:0">
		<div
			id="APIs-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="APIs-details-btn"
			tabindex="0"
			aria-hidden="false"
			state-id="apis-details"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off"
				class="app-details">
				<div scrollbar>
					<div src="/apps/apis/components/details.html"></div>
				</div>
			</form>
		</div>
		<div
			id="APIs-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="APIs-form-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="apis-form"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/apps/apis/components/form.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
		<div
			id="APIs-code-view"
			class="offcanvas-app-view"
			data-view="code"
			role="tabpanel"
			aria-labelledby="APIs-code-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="apis-code"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/components/offcanvas-app/code.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
	</div>
</div>
