
	<div class="card-body align-items:flex-start d-flex flex-column gap-4 h-100">
		<div
			class="flex-grow-1 app-image-editor"
			src="/components/profile-img.html"
			aria-label="Profile Image Upload"></div>

		<label
			class="form-label flex-grow-1 flex-basis:220px min-width:180px"
			id="first-name-label">
			First Name
			<input
				type="text"
				id="contact-first_name"
				key="first_name"
				name="first_name"
				class="form-control"
				placeholder="Enter first name"
				aria-labelledby="first-name-label" />
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:220px min-width:180px"
			id="last-name-label">
			Last Name
			<input
				type="text"
				id="contact-last_name"
				key="last_name"
				name="last_name"
				class="form-control"
				placeholder="Enter last name"
				aria-labelledby="last-name-label" />
		</label>

		<input
			type="hidden"
			key="name"
			name="name"
			value="$query(#contact-first_name) $query(#contact-last_name)" />

		<label
			class="form-label flex-grow-1 width:100%"
			id="company-label">
			Company
			<div
				src="/components/company-select.html"
				class="form-control p-0"></div>
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:180px min-width:160px"
			id="title-label">
			Title
			<input
				type="text"
				key="title"
				name="title"
				class="form-control"
				placeholder="Enter title"
				aria-labelledby="title-label" />
		</label>

		<label
			class="form-label flex-grow:2 flex-basis:260px min-width:220px"
			id="email-label">
			Email
			<input
				type="text"
				key="email"
				name="email"
				class="form-control"
				placeholder="Enter email"
				aria-labelledby="email-label" />
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:180px min-width:160px"
			id="phone-label">
			Phone
			<input
				type="text"
				key="phone"
				name="phone"
				class="form-control"
				placeholder="Enter phone no"
				aria-labelledby="phone-label" />
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:160px min-width:140px"
			id="city-label">
			City
			<input
				type="text"
				key="city"
				name="city"
				class="form-control"
				placeholder="Enter city"
				aria-labelledby="city-label" />
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:160px min-width:140px"
			id="country-label">
			Country
			<input
				type="text"
				key="country"
				name="country"
				class="form-control"
				placeholder="Enter country"
				aria-labelledby="country-label" />
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:100px min-width:100px"
			id="zip-label">
			Zip
			<input
				type="text"
				key="zip"
				name="zip"
				class="form-control"
				placeholder="Enter zip code"
				aria-labelledby="zip-label" />
		</label>

		<label
			class="form-label flex-grow:2 flex-basis:260px min-width:220px"
			id="website-label">
			Website
			<input
				type="text"
				key="website"
				name="website"
				class="form-control"
				placeholder="Enter website"
				aria-labelledby="website-label" />
		</label>

		<label
			class="form-label flex-grow-1 width:100%"
			id="description-label">
			Description
			<textarea
				key="description"
				name="description"
				class="form-control"
				rows="3"
				placeholder="Enter description"
				aria-labelledby="description-label">
				</textarea>
		</label>

		<label
			class="form-label flex-grow:2 flex-basis:280px min-width:220px"
			id="availability-label">
			Availability
			<input
				type="text"
				key="availability"
				name="availability"
				class="form-control"
				placeholder="Enter availability"
				aria-labelledby="availability-label" />
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:220px min-width:180px font-size-13 text-muted"
			id="type-label">
			Type
			<select
				class="form-control"
				key="type"
				name="type"
				multiple
				aria-labelledby="type-label">
				<option value="lead">Lead</option>
				<option value="partner">Partner</option>
				<option value="customer">Customer</option>
				<option value="vendor">Vendor</option>
				<option value="candidate">Candidate</option>
				<option value="advisor">Advisor</option>
				<option value="consultant">Consultant</option>
				<option value="employee">Employee</option>
			</select>
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:160px min-width:140px font-size-13 text-muted"
			id="status-label">
			Status
			<select
				class="form-control"
				key="status"
				name="status"
				aria-labelledby="status-label">
				<option value="active">Active</option>
				<option value="inactive">Inactive</option>
				<option value="lead">Lead</option>
			</select>
		</label>

		<label
			class="form-label flex-grow:2 flex-basis:280px min-width:220px font-size-13 text-muted"
			id="tags-label">
			Tags
			<select
				class="form-control"
				key="tags"
				name="tags"
				multiple
				aria-labelledby="tags-label">
				<option value="vip">Vip</option>
				<option value="trial">Trial</option>
				<option value="newsletter">Newsletter</option>
				<option value="inactive">Inactive</option>
				<option value="exiting">Exiting</option>
				<option value="long-term">Long-term</option>
				<option value="new">New</option>
				<option value="prospect">Prospect</option>
				<option value="referral">Referral</option>
				<option value="candidate">Candidate</option>
				<option value="priority">Priority</option>
				<option value="blocked">Blocked</option>
			</select>
		</label>
	</div>
