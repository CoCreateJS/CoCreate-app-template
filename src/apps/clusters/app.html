<div
	id="clusters-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Clusters record">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="Clusters"
		value-type="outerHtml"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0">
		<div
			id="Clusters-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="Clusters-details-btn"
			tabindex="0"
			aria-hidden="false"
			state-id="clusters-details"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				class="app-details"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/apps/clusters/components/details.html"></div>
				</div>
			</form>
		</div>
		<div
			id="Clusters-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="Clusters-form-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="clusters-form"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				class="app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div
						class="card-body d-flex flex-column gap-4 h-100"
						data-cluster-configuration
						src="/apps/clusters/components/form.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
		<div
			id="Clusters-code-view"
			class="offcanvas-app-view"
			data-view="code"
			role="tabpanel"
			aria-labelledby="Clusters-code-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="clusters-code"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/components/offcanvas-app/code.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
	</div>
</div>
