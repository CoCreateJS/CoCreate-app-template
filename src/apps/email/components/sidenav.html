<div
	class="email-menu-sidebar minimal-border"
	id="email-sidenav">
	<div class="p-4 d-flex flex-column h-100">
		<div class="pb-4 border-bottom border-bottom-dashed">
			<button
				type="button"
				class="btn btn-danger w-100"
				aria-controls="composemodal"
				aria-haspopup="dialog"
				aria-expanded="false">
				<i
					src="/assets/svg/remix/add-circle-line.svg"
					class="fs-16 me-1 text-light"></i>
				Compose
			</button>
		</div>

		<div
			class="mx-n4 px-4 email-menu-sidebar-scroll"
			scrollbar>
			<div class="mail-list mt-3">
				<a
					href="#"
					class="active"
					><i
						src="/assets/svg/remix/mail-fill.svg"
						class="me-3 align-middle fw-medium"></i>
					<span class="mail-list-link">All</span>
					<span class="badge bg-success-subtle text-success ms-auto"
						>5</span
					></a
				>
				<a href="#"
					><i
						src="/assets/svg/remix/inbox-archive-fill.svg"
						class="me-3 align-middle fw-medium"></i>
					<span class="mail-list-link">Inbox</span>
					<span class="badge bg-success-subtle text-success ms-auto"
						>5</span
					></a
				>
				<a href="#"
					><i
						src="/assets/svg/remix/send-plane-2-fill.svg"
						class="me-3 align-middle fw-medium"></i
					><span class="mail-list-link">Sent</span></a
				>
				<a href="#"
					><i
						src="/assets/svg/remix/edit-2-fill.svg"
						class="me-3 align-middle fw-medium"></i
					><span class="mail-list-link">Draft</span></a
				>
				<a href="#"
					><i
						src="/assets/svg/remix/error-warning-fill.svg"
						class="me-3 align-middle fw-medium"></i
					><span class="mail-list-link">Spam</span></a
				>
				<a href="#"
					><i
						src="/assets/svg/remix/delete-bin-5-fill.svg"
						class="me-3 align-middle fw-medium"></i
					><span class="mail-list-link">Trash</span></a
				>
				<a href="#"
					><i
						src="/assets/svg/remix/star-fill.svg"
						class="me-3 align-middle fw-medium"></i
					><span class="mail-list-link">Starred</span></a
				>
				<a href="#"
					><i
						src="/assets/svg/remix/price-tag-3-fill.svg"
						class="me-3 align-middle fw-medium"></i
					><span class="mail-list-link">Important</span></a
				>
			</div>

			<div>
				<h5 class="fs-12 text-uppercase text-muted mt-4">Labels</h5>

				<div class="mail-list mt-1">
					<a href="#"
						><i
							src="/assets/svg/remix/checkbox-blank-circle-line.svg"
							class="me-2 text-info"></i
						><span
							class="mail-list-link"
							data-type="label"
							>Support</span
						>
						<span
							class="badge bg-success-subtle text-success ms-auto"
							>3</span
						></a
					>
					<a href="#"
						><i
							src="/assets/svg/remix/checkbox-blank-circle-line.svg"
							class="me-2 text-warning"></i
						><span
							class="mail-list-link"
							data-type="label"
							>Freelance</span
						></a
					>
					<a href="#"
						><i
							src="/assets/svg/remix/checkbox-blank-circle-line.svg"
							class="me-2 text-primary"></i
						><span
							class="mail-list-link"
							data-type="label"
							>Social</span
						></a
					>
					<a href="#"
						><i
							src="/assets/svg/remix/checkbox-blank-circle-line.svg"
							class="me-2 text-danger"></i
						><span
							class="mail-list-link"
							data-type="label"
							>Friends</span
						><span
							class="badge bg-success-subtle text-success ms-auto"
							>2</span
						></a
					>
					<a href="#"
						><i
							src="/assets/svg/remix/checkbox-blank-circle-line.svg"
							class="me-2 text-success"></i
						><span
							class="mail-list-link"
							data-type="label"
							>Family</span
						></a
					>
				</div>
			</div>

			<div class="border-top border-top-dashed pt-3 mt-3">
				<a
					href="#"
					class="btn btn-icon btn-sm btn-soft-info rounded-pill float-end material-shadow-none"
					><i class="bx bx-plus fs-16"></i
				></a>
				<h5 class="fs-12 text-uppercase text-muted mb-3">Chat</h5>

				<div class="mt-2 vstack email-chat-list mx-n4">
					<a
						role="button"
						tabindex="0"
						aria-controls="email-chat-detail"
						aria-haspopup="dialog"
						aria-expanded="false"
						class="d-flex align-items-center active">
						<div
							class="flex-shrink-0 me-2 avatar-xxs chatlist-user-image">
							<img
								class="img-fluid rounded-circle"
								src="/assets/images/users/avatar-2.jpg"
								alt="" />
						</div>

						<div class="flex-grow-1 chat-user-box overflow-hidden">
							<h5
								class="fs-13 text-truncate mb-0 chatlist-user-name">
								Scott Median
							</h5>
							<small class="text-muted text-truncate mb-0"
								>Hello ! are you there?</small
							>
						</div>
					</a>

					<a
						role="button"
						tabindex="0"
						aria-controls="email-chat-detail"
						aria-haspopup="dialog"
						aria-expanded="false"
						class="d-flex align-items-center">
						<div
							class="flex-shrink-0 me-2 avatar-xxs chatlist-user-image">
							<img
								class="img-fluid rounded-circle"
								src="/assets/images/users/avatar-4.jpg"
								alt="" />
						</div>

						<div class="flex-grow-1 chat-user-box overflow-hidden">
							<h5
								class="fs-13 text-truncate mb-0 chatlist-user-name">
								Julian Rosa
							</h5>
							<small class="text-muted text-truncate mb-0"
								>What about our next..</small
							>
						</div>
					</a>

					<a
						role="button"
						tabindex="0"
						aria-controls="email-chat-detail"
						aria-haspopup="dialog"
						aria-expanded="false"
						class="d-flex align-items-center">
						<div
							class="flex-shrink-0 me-2 avatar-xxs chatlist-user-image">
							<img
								class="img-fluid rounded-circle"
								src="/assets/images/users/avatar-3.jpg"
								alt="" />
						</div>

						<div class="flex-grow-1 chat-user-box overflow-hidden">
							<h5
								class="fs-13 text-truncate mb-0 chatlist-user-name">
								David Medina
							</h5>
							<small class="text-muted text-truncate mb-0"
								>Yeah everything is fine</small
							>
						</div>
					</a>

					<a
						role="button"
						tabindex="0"
						aria-controls="email-chat-detail"
						aria-haspopup="dialog"
						aria-expanded="false"
						class="d-flex align-items-center">
						<div
							class="flex-shrink-0 me-2 avatar-xxs chatlist-user-image">
							<img
								class="img-fluid rounded-circle"
								src="/assets/images/users/avatar-5.jpg"
								alt="" />
						</div>

						<div class="flex-grow-1 chat-user-box overflow-hidden">
							<h5
								class="fs-13 text-truncate mb-0 chatlist-user-name">
								Jay Baker
							</h5>
							<small class="text-muted text-truncate mb-0"
								>Wow that's great</small
							>
						</div>
					</a>
				</div>
			</div>
		</div>

		<div class="mt-auto">
			<h5 class="fs-13">1.75 GB of 10 GB used</h5>
			<div class="progress progress-sm">
				<div
					class="progress-bar bg-success"
					role="progressbar"
					style="width: 25%"
					aria-valuenow="25"
					aria-valuemin="0"
					aria-valuemax="100"></div>
			</div>
		</div>
	</div>
</div>
