<div class="flex-shrink-0 order-1 d-block d-lg-none">
	<button
		type="button"
		class="btn btn-soft-success btn-icon btn-sm fs-16 email-menu-btn material-shadow-none"
		aria-haspopup="menu"
		aria-controls="email-sidenav"
		aria-expanded="false"
		id="email-sidenav-toggle">
		<i src="/assets/svg/remix/menu-2-fill.svg" class="align-bottom"></i>
	</button>
</div>
<div class="flex-grow-1 min-width:200px order-3 order-sm-2">
	<div class="hstack gap-sm-1 align-items-center flex-wrap email-topbar-link">
		<div class="form-check fs-14 m-0">
			<input
				class="form-check-input"
				type="checkbox"
				value=""
				id="checkall" />
			<label class="form-check-label" for="checkall"></label>
		</div>
		<div id="email-topbar-actions">
			<div class="hstack gap-sm-1 align-items-center flex-wrap">
				<button
					type="button"
					class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
					data-bs-trigger="hover"
					data-bs-placement="top"
					title="Archive">
					<i src="/assets/svg/remix/inbox-archive-fill.svg" class="align-bottom"></i>
				</button>
				<button
					type="button"
					class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
					data-bs-trigger="hover"
					data-bs-placement="top"
					title="Report Spam">
					<i src="/assets/svg/remix/error-warning-fill.svg" class="align-bottom"></i>
				</button>
				<div
					data-bs-trigger="hover"
					data-bs-placement="top"
					title="Trash">
					<button
						type="button"
						class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
						aria-haspopup="dialog"
						aria-label="Remove selected items"
						aria-controls="removeItemModal">
						<i src="/assets/svg/remix/delete-bin-5-fill.svg" class="align-bottom"></i>
					</button>
				</div>
			</div>
		</div>
		<div class="vr align-self-center mx-2"></div>
		<div class="dropdown">
			<button
				class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
				type="button"
				aria-haspopup="menu"
				aria-expanded="false" aria-controls="dropdown-apps-email-components-topbar-1">
				<i src="/assets/svg/remix/price-tag-3-fill.svg" class="align-bottom"></i>
			</button>
			<div class="dropdown-menu" aria-close-on="anywhere" id="dropdown-apps-email-components-topbar-1" aria-hidden="true">
				<a class="dropdown-item" href="#">Support</a>
				<a class="dropdown-item" href="#">Freelance</a>
				<a class="dropdown-item" href="#">Social</a>
				<a class="dropdown-item" href="#">Friends</a>
				<a class="dropdown-item" href="#">Family</a>
			</div>
		</div>
		<div class="dropdown">
			<button
				class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
				type="button"
				aria-haspopup="menu"
				aria-expanded="false" aria-controls="dropdown-apps-email-components-topbar-2">
				<i src="/assets/svg/remix/more-2-fill.svg" class="align-bottom"></i>
			</button>
			<div class="dropdown-menu dropdown-menu-end" aria-close-on="anywhere" id="dropdown-apps-email-components-topbar-2" aria-hidden="true">
				<a class="dropdown-item" href="#" id="mark-all-read"
					>Mark all as Read</a
				>
			</div>
		</div>
		<div
			class="alert alert-warning alert-dismissible unreadConversations-alert px-4 fade show"
			id="unreadConversations"
			role="alert">
			No Unread Conversations
		</div>
	</div>
</div>
<div class="flex-shrink-0 order-2 order-sm-3">
	<div class="d-flex gap-sm-1 email-topbar-link">
		<button
			type="button"
			class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none">
			<i src="/assets/svg/remix/refresh-line.svg" class="align-bottom"></i>
		</button>
		<div class="dropdown">
			<button
				class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
				type="button"
				aria-haspopup="menu"
				aria-expanded="false" aria-controls="dropdown-apps-email-components-topbar-3">
				<i src="/assets/svg/remix/more-2-fill.svg" class="align-bottom"></i>
			</button>
			<div class="dropdown-menu dropdown-menu-end" aria-close-on="anywhere" id="dropdown-apps-email-components-topbar-3" aria-hidden="true">
				<a class="dropdown-item" href="#">Mark as Unread</a>
				<a class="dropdown-item" href="#">Mark as Important</a>
				<a class="dropdown-item" href="#">Add to Tasks</a>
				<a class="dropdown-item" href="#">Add Star</a>
				<a class="dropdown-item" href="#">Mute</a>
			</div>
		</div>
	</div>
</div>
