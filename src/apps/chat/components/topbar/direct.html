<div
	class="flex-shrink-0 chat-user-img online user-own-img align-self-center me-3 ms-0">
	<div class="avatar-xs rounded-circle position-relative overflow-hidden">
		<div
			class="avatar-title bg-secondary-subtle text-secondary material-shadow">
			<span
				state-id="selected-chat-name"
				array="contacts"
				object=""
				key="first_name"
				class="overflow-hidden max-width:1.3ch letter-spacing:1em height:1rem">
			</span>
			<span
				state-id="selected-chat-name"
				array="contacts"
				object=""
				key="last_name"
				class="overflow-hidden max-width:1.3ch letter-spacing:1em height:1rem">
			</span>
			<img
				src="/assets/images/transparent.png"
				alt=""
				class="position-absolute object-fit-cover"
				state-id="selected-chat-name"
				array="contacts"
				object=""
				key="avatar[0].src"
				width="100%"
				height="100%"
				onerror="
					this.onerror = null;
					this.src = '../assets/images/transparent.png';
				" />
		</div>
	</div>
	<span class="user-status"></span>
</div>
<div class="flex-grow-1 overflow-hidden">
	<h5 class="text-truncate mb-0 fs-16">
		<a
			class="text-reset username"
			aria-controls="userProfileCanvasExample"
			state-id="selected-chat-name"
			array="contacts"
			object=""
			key="name"></a>
	</h5>
	<p class="text-truncate text-muted fs-14 mb-0 userStatus">
		<small>Online</small>
	</p>
</div>
