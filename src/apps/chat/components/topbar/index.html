<div
	class="p-3 user-chat-topbar"
	state-id="selected-chat"
	array="chats"
	object>
	<div class="d-flex align-items-center w-100">
		<div class="d-flex align-items-center flex-grow-1">
			<div class="flex-shrink-0 d-block me-3">
				<button
					type="button"
					class="btn user-chat-remove fs-18 p-1"
					aria-label="Toggle Chat Sidenav"
					aria-controls="chat-sidenav"
					aria-expanded="true">
					<i src="/assets/svg/remix/arrow-left-s-line.svg" class="align-bottom"></i>
				</button>
			</div>
			<div class="flex-grow-1 overflow-hidden">
				<div
					class="d-flex align-items-center"
					state-id="selected-chat-topbar"
					src></div>
			</div>
		</div>
		<ul class="list-inline user-chat-nav text-end mb-0">
			<li class="list-inline-item m-0">
				<div class="dropdown">
					<button
						class="btn btn-ghost-secondary btn-icon material-shadow-none"
						type="button"
						aria-haspopup="menu"
						aria-expanded="false"
						aria-controls="chat-search-dropdown-menu">
						<i src="/assets/svg/remix/search-2-line.svg" class="fs-18"></i>
					</button>
					<div
						class="dropdown-menu p-0 dropdown-menu-end dropdown-menu-lg"
						id="chat-search-dropdown-menu"
						aria-close-on="outside"
						role="menu">
						<div class="p-2">
							<div class="search-box">
								<input
									type="text"
									class="form-control bg-light border-light"
									placeholder="Search messages..."
									id="searchMessage"
									filter-query="$document #chat-conversation"
									filter-query-key="content.$regex"
									filter-query-options="i" />
								<i src="/assets/svg/remix/search-2-line.svg" class="search-icon"></i>
							</div>
						</div>
					</div>
				</div>
			</li>

			<li class="list-inline-item d-none d-lg-inline-block m-0">
				<button
					type="button"
					class="btn btn-ghost-secondary btn-icon material-shadow-none"
					aria-controls="userProfileCanvasExample"
					aria-haspopup="dialog"
					aria-expanded="false">
					<i src="/assets/svg/remix/information-line.svg" class="fs-18"></i>
				</button>
			</li>

			<li class="list-inline-item m-0">
				<div class="dropdown">
					<button
						class="btn btn-ghost-secondary btn-icon material-shadow-none"
						type="button"
						aria-haspopup="menu"
						aria-expanded="false"
						aria-controls="chat-more-dropdown-menu">
						<i src="/assets/svg/remix/more-2-fill.svg" class="fs-18"></i>
					</button>
					<div
						class="dropdown-menu dropdown-menu-end"
						id="chat-more-dropdown-menu"
						aria-close-on="anywhere"
						role="menu">
						<a
							class="dropdown-item d-block d-lg-none user-profile-show"
							href="#"
							><i src="/assets/svg/remix/user-2-fill.svg" class="align-bottom text-muted me-2"></i>
							View Profile</a
						>
						<a
							class="dropdown-item"
							href="#"
							><i src="/assets/svg/remix/inbox-archive-line.svg" class="align-bottom text-muted me-2"></i>
							Archive</a
						>
						<a
							class="dropdown-item"
							href="#"
							><i src="/assets/svg/remix/mic-off-line.svg" class="align-bottom text-muted me-2"></i>
							Muted</a
						>
						<a
							class="dropdown-item"
							href="#"
							><i src="/assets/svg/remix/delete-bin-5-line.svg" class="align-bottom text-muted me-2"></i>
							Delete</a
						>
					</div>
				</div>
			</li>
		</ul>
	</div>
</div>
