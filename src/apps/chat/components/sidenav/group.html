<div class="d-flex align-items-center">
	<div class="flex-shrink-0 chat-user-img align-self-center me-2 ms-0">
		<div class="avatar-xs rounded-circle position-relative overflow-hidden">
			<div
				class="avatar-title bg-secondary-subtle text-secondary material-shadow">
				<img
					src="/assets/images/users.jpg"
					alt=""
					class="position-absolute object-fit-cover"
					array="chats"
					object
					key="avatar[0].src"
					width="100%"
					height="100%"
					onerror="
						this.onerror = null;
						this.src = '../assets/images/users.jpg';
					" />
			</div>
		</div>
	</div>
	<div class="flex-grow-1 overflow-hidden"  render-element>
		<p class="text-truncate mb-0">{{object.name}}</p>
		<p
			class="text-truncate text-muted mb-0 fs-12"
			array="messages"
			object="{{object.last_message_id}}"
			key="content"></p>
	</div>
</div>
