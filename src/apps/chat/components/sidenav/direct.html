<input
	type="hidden"
	array="contacts"
	object
	key="_id"
	input.object="$value"
	input-query="$next [array='contacts'][]"
	filter-query-key="_id.$ne"
	filter-query-value="$user_id"
	filter-limit="1"
	state.object="$value"
	state-to="selected-chat-name" />

<div class="d-flex align-items-center">
	<div class="flex-shrink-0 chat-user-img align-self-center me-2 ms-0">
		<div class="avatar-xs rounded-circle position-relative overflow-hidden">
			<div
				class="avatar-title bg-secondary-subtle text-secondary material-shadow">
				<span
					array="contacts"
					object
					key="first_name"
					class="overflow-hidden max-width:1.3ch letter-spacing:1em height:1rem"></span>
				<span
					array="contacts"
					object
					key="last_name"
					class="overflow-hidden max-width:1.3ch letter-spacing:1em height:1rem"></span>
				<img
					src="/assets/images/transparent.png"
					alt=""
					class="position-absolute object-fit-cover"
					array="contacts"
					object
					key="avatar[0].src"
					width="100%"
					height="100%"
					onerror="
						this.onerror = null;
						this.src = '../assets/images/transparent.png';
					" />
			</div>
		</div>
	</div>
	<div class="flex-grow-1 overflow-hidden">
		<p class="text-truncate mb-0" array="contacts" object key="name"></p>
		<p
			class="text-truncate text-muted mb-0 fs-12"
			array="messages"
			object="{{object.last_message_id}}"
			key="content"
			render-element></p>
	</div>
</div>
