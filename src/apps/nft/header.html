<ul
	class="list-inline hstack justify-content-between align-items-center gap-2 mb-0"
	style="min-height: unset"
	role="toolbar"
	aria-label="Offcanvas header controls">
	<input
		type="hidden"
		class="offcanvas-src"
		input-query="$parent .offcanvas-path[]"
		input.value="$value"
		value-replace="/\/(?:form|details|index)\.html$/" />
	<input
		type="hidden"
		class="offcanvas-path"
		input.state.src="$value"
		input-query="$parent .details-view-btn[]"
		value-suffix="/details.html" />
	<input
		type="hidden"
		class="offcanvas-path"
		input.state.src="$value"
		input-query="$parent .form-view-btn[]"
		value-suffix="/form.html" />
	<style>
		#form-btn {
			display: none;
		}
		#details-btn {
			display: none;
		}
		/* Prefer the view owned by this form; retain the host src as a fallback. */
		form:has(> header[aria-label="Details controls"]) #form-btn,
		.offcanvas-app-content:has(#offcanvas-app-view[src*="/details.html"])
			#form-btn,
		.offcanvas-app-content:has(
				#offcanvas-app-view[src*="/profile/index.html"]
			)
			#form-btn {
			display: inline-flex;
		}
		form:has(> header[aria-label="Form controls"]) #details-btn,
		.offcanvas-app-content:has(#offcanvas-app-view[src*="/form.html"])
			#details-btn {
			display: inline-flex;
		}
		/* NFT currently has no form view. */
		.form-view-btn {
			display: none !important;
		}
		#offcanvas-app:has(
				#offcanvas-app-view[src*="/apps/activities/index.html"]
			)
			.form-view-btn,
		#offcanvas-app:has(
				#offcanvas-app-view[src*="/apps/activities/index.html"]
			)
			.details-view-btn {
			display: none;
		}
	</style>

	<li class="list-inline-item">
		<div
			class="dropdown d-inline-block"
			role="region"
			aria-label="More actions">
			<a
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle dropdown text-muted"
				role="button"
				aria-haspopup="menu"
				aria-controls="offcanvas-header-dropdown"
				aria-expanded="false"
				aria-label="More actions">
				<i src="/assets/svg/remix/more-2-fill.svg" class="align-middle fs-22"></i>
			</a>
			<ul
				id="offcanvas-header-dropdown"
				class="dropdown-menu dropdown-menu-start"
				aria-close-on="anywhere"
				role="menu"
				aria-label="Header actions menu">
				<li>
					<a
						class="dropdown-item details-view-btn offcanvas-app"
						state-to="offcanvas-app-view"
						state.src=""
						role="menuitem"
						><i src="/assets/svg/remix/eye-fill.svg" class="align-bottom me-2 text-muted"></i>View</a
					>
				</li>
				<li>
					<a
						class="dropdown-item form-view-btn offcanvas-app"
						state-to="offcanvas-app-view"
						state.src=""
						role="menuitem"
						><i src="/assets/svg/remix/eye-fill.svg" class="align-bottom me-2 text-muted"></i>Edit</a
					>
				</li>
				<li>
					<a
						class="dropdown-item remove-item-btn offcanvas-app"
						aria-haspopup="dialog"
						aria-label="Remove selected items"
						aria-controls="removeItemModal"
						role="menuitem"
						state-to="delete-record"
						state.delete-query="$document #delete-record"
						state.actions="delete, action($document [aria-controls='offcanvas-app'][aria-label='Close'])"
						state.array="nft"
						state.object="">
						<input
							key="_id"
							input.state.object="$value"
							input-query="$parent"
							hidden />
						<i src="/assets/svg/remix/delete-bin-fill.svg" class="align-bottom me-2 text-muted"></i>
						Delete</a
					>
				</li>
			</ul>
		</div>

		<!-- Details button outside dropdown, next to three-dot icon -->
		<div
			role="group"
			aria-label="Primary header actions"
			class="d-inline-block align-middle">
			<button
				id="details-btn"
				type="button"
				state-to="offcanvas-app-view"
				state.src=""
				class="btn btn-sm btn-outline-primary ms-2 details-view-btn offcanvas-app"
				title="Details"
				aria-label="Details">
				<i src="/assets/svg/remix/eye-fill.svg" class="align-bottom"></i>
				<span>Details</span>
			</button>

			<button
				id="form-btn"
				type="button"
				state-to="offcanvas-app-view"
				state.src=""
				class="btn btn-sm btn-outline-primary ms-2 form-view-btn offcanvas-app"
				title="Edit"
				aria-label="Edit">
				<i src="/assets/svg/remix/pencil-fill.svg" class="align-bottom"></i>
				<span>Edit</span>
			</button>
		</div>
	</li>

	<div
		role="group"
		aria-label="Window controls"
		class="hstack gap-1">
		<li class="d-none d-md-inline">
			<!-- Dock icon button -->
			<a
				role="button"
				id="dock-lead-side-view"
				title="Dock Right"
				aria-label="Dock Right"
				toggle.docked="true, false"
				toggle-query="$document #offcanvas-app"
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
				<i
					src="/assets/svg/remix/layout-right-line.svg"
					toggle.src="/assets/svg/remix/layout-right-2-line.svg, /assets/svg/remix/layout-right-line.svg"
					class="align-middle fs-22"></i>
			</a>
		</li>
		<li class="d-none">
			<!-- Pin icon button -->
			<a
				role="button"
				id="pin-lead-bottom-tab"
				title="Pin Bottom"
				aria-label="Pin Bottom"
				toggle.pin="bottom, none"
				toggle-query="$document #offcanvas-app"
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
				<i
					src="/assets/svg/remix/pushpin-2-line.svg"
					toggle.src="/assets/svg/remix/pushpin-2-fill.svg, /assets/svg/remix/pushpin-2-line.svg"
					class="align-middle fs-22"></i>
			</a>
		</li>
		<li title="Close">
			<a
				id="close-offcanvas-btn"
				role="button"
				aria-label="Close"
				aria-close
				aria-controls="offcanvas-app"
				aria-expanded="true"
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
				<i src="/assets/svg/remix/close-line.svg" class="align-middle fs-22"></i>
			</a>
		</li>
	</div>
</ul>
