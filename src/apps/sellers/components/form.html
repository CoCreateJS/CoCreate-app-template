
	<div class="card-body d-flex flex-column gap-4 h-100">
		<div class="d-flex flex-column align-items-center">
			<div class="position-relative d-inline-block">
				<div class="position-absolute bottom-0 end-0">
					<label
						for="company-logo-input"
						class="mb-0"
						title="Select Image">
						<div
							src="/components/profile-img.html"
							input.src="/assets/images/multi-user.jpg"
							input-query="img" class="app-image-editor" media-path="/media/logos/"></div>
					</label>
				</div>
			</div>
			<h5 class="fs-13 mt-3">Company Logo</h5>
		</div>

		<div class="d-flex flex-column gap-3">
			<label
				class="form-label"
				for="companyname-field">
				Name
				<input
					type="text"
					id="companyname-field"
					class="form-control"
					placeholder="Enter company name"
					key="name"
					aria-label="Company Name" />
			</label>

			<label
				class="form-label"
				for="owner-field">
				Owner Name
				<input
					type="text"
					id="owner-field"
					class="form-control"
					placeholder="Enter owner name"
					key="owner"
					aria-label="Owner Name" />
			</label>

			<label
				class="form-label"
				for="industry_type-field">
				Industry Type
				<select
					class="form-select"
					id="industry_type-field"
					key="industry_type"
					aria-label="Industry Type">
					<option value="">Select industry type</option>
					<option value="Computer Industry">
						Computer Industry
					</option>
					<option value="Chemical Industries">
						Chemical Industries
					</option>
					<option value="Health Services">Health Services</option>
					<option value="Telecommunications Services">
						Telecommunications Services
					</option>
					<option value="Textiles: Clothing, Footwear">
						Textiles: Clothing, Footwear
					</option>
				</select>
			</label>

			<label
				class="form-label"
				for="rating-field">
				Rating
				<input
					type="text"
					id="rating-field"
					class="form-control"
					placeholder="Enter rating"
					key="rating"
					aria-label="Rating" />
			</label>

			<label
				class="form-label"
				for="location-field">
				Location
				<input
					type="text"
					id="location-field"
					class="form-control"
					placeholder="Enter location"
					key="location"
					aria-label="Location" />
			</label>

			<label
				class="form-label"
				for="employee-field">
				Employees
				<input
					type="text"
					id="employee-field"
					class="form-control"
					placeholder="Enter number of employees"
					key="employee"
					aria-label="Number of Employees" />
			</label>

			<label
				class="form-label"
				for="website-field">
				Website
				<input
					type="text"
					id="website-field"
					class="form-control"
					placeholder="Enter website"
					key="website"
					aria-label="Website" />
			</label>

			<label
				class="form-label"
				for="contact_email-field">
				Contact Email
				<input
					type="text"
					id="contact_email-field"
					class="form-control"
					placeholder="Enter contact email"
					key="contact_email"
					aria-label="Contact Email" />
			</label>

			<label
				class="form-label"
				for="since-field">
				Since
				<input
					type="text"
					id="since-field"
					class="form-control"
					placeholder="Enter since"
					key="since"
					aria-label="Established Since" />
			</label>
		</div>
	</div>
