<div
	id="sellers-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Sellers record">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="Sellers"
		value-type="outerHtml"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0">
		<div
			id="Sellers-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="Sellers-details-btn"
			tabindex="0"
			aria-hidden="false"
			state-id="sellers-details"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				class="app-details"
				array="companies"
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/apps/sellers/components/details.html"></div>
				</div>
			</form>
		</div>
		<div
			id="Sellers-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="Sellers-form-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="sellers-form"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				class="app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/apps/sellers/components/form.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
		<div
			id="Sellers-code-view"
			class="offcanvas-app-view"
			data-view="code"
			role="tabpanel"
			aria-labelledby="Sellers-code-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="sellers-code"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/components/offcanvas-app/code.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
	</div>
</div>
