
	<div class="card-body d-flex flex-column gap-4 h-100">
		<div class="d-flex flex-wrap align-items-start justify-content-between gap-3">
			<div class="flex-grow-1">
				<p class="text-muted text-uppercase fw-semibold mb-1">
					Support Ticket
				</p>
				<h5 class="card-title app-title mb-1" key="title"></h5>
			</div>
			<span
				class="badge border border-primary text-primary"
				key="status"></span>
		</div>

		<div class="table-responsive">
			<table class="table table-borderless align-middle mb-0">
				<tbody>
					<tr>
						<th class="text-muted" scope="row">Ticket ID</th>
						<td key="ticketId"></td>
					</tr>
					<tr>
						<th class="text-muted" scope="row">Client</th>
						<td key="client_name"></td>
					</tr>
					<tr>
						<th class="text-muted" scope="row">Assigned To</th>
						<td key="assigned_to"></td>
					</tr>
					<tr>
						<th class="text-muted" scope="row">Created</th>
						<td key="create_date"></td>
					</tr>
					<tr>
						<th class="text-muted" scope="row">Due Date</th>
						<td key="due_date"></td>
					</tr>
					<tr>
						<th class="text-muted" scope="row">Priority</th>
						<td>
							<span
								class="badge border border-warning text-warning"
								key="priority"></span>
						</td>
					</tr>
					<tr>
						<th class="text-muted" scope="row">Stage</th>
						<td key="stage"></td>
					</tr>
				</tbody>
			</table>
		</div>

		<div>
			<h6 class="text-muted text-uppercase fw-semibold mb-2">
				Description
			</h6>
			<p class="mb-0" key="description"></p>
		</div>

		<div>
			<h6 class="text-muted text-uppercase fw-semibold mb-2">Tags</h6>
			<div class="d-flex flex-wrap gap-2" key="tags"></div>
		</div>
	</div>
