<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/ticket-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.avatar[0].src}}"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/support-tickets/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-open><span state-to="offcanvas-app-form" state.array="support_tickets" state.object="{{object._id}}" hidden></span>{{object.title}}</a>
					</h5>
				</div>
				<span class="text-muted fs-12">{{object.ticketId}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="status" data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Client</span>
					<strong>{{object.client_name}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Assigned to</span>
					<strong>{{object.assigned_to}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Stage</span>
					<strong class="text-capitalize">{{object.stage}}</strong>
				</div>
			</div>
			<div
				class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed">
				<div class="text-muted fs-12">
					<span><i src="/assets/svg/remix/calendar-check-line.svg" class="me-1"></i>Created: {{object.create_date}}</span>
					<span class="ms-3"><i src="/assets/svg/remix/calendar-event-line.svg" class="me-1"></i>Due: {{object.due_date}}</span>
				</div>
				<span class="badge app-badge" key="priority" data-value="{{object.priority}}">{{object.priority}}</span>
			</div>
			<div
				class="d-flex flex-wrap gap-1"
				key="tags"
				render-query="[template='support-ticket-card-tag']">
				<span template="support-ticket-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="support_tickets" onload-query="$parent"></div>
