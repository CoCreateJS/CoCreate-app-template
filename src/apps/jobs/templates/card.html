<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/briefcase-2-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.companyLogo}}"
							alt=""
							onload="this.hidden = false"
							onerror="this.hidden = true"
							hidden />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/jobs/app.html"
							aria-controls="offcanvas-app"
							aria-open
							aria-haspopup="dialog"
							aria-expanded="false"><span state-to="offcanvas-app-form" state.array="jobPosts" state.object="{{object._id}}" hidden></span>{{object.jobTitle}}</a>
					</h5>
				</div>
				<span class="text-muted fs-12">{{object.companyName}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="status" data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Type</span>
					<strong>{{object.type}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Experience</span>
					<strong>{{object.experience}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Position</span>
					<strong>{{object.position}}</strong>
				</div>
			</div>
			<div class="d-flex flex-column gap-2 text-muted fs-12">
				<span><i src="/assets/svg/remix/map-pin-line.svg" class="me-2"></i>{{object.location}}</span>
				<span><i src="/assets/svg/remix/money-dollar-circle-line.svg" class="me-2"></i>{{object.start_salary}}–{{object.last_salary}}</span>
			</div>
			<div class="d-flex justify-content-between pt-2 border-top border-top-dashed text-muted fs-12">
				<span>Closes: {{object.close_date}}</span>
				<strong>{{object.applied}}</strong>
			</div>
		</div>
	</article>
</template>
<div onload.array="jobPosts" onload-query="$parent"></div>
