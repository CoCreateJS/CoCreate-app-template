<div
	class="offcanvas-app-create app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Database record">
	<header
		class="card-header d-flex align-items-center justify-content-between flex-shrink-0">
		<h5 class="mb-0">Database record</h5>
		<button
			type="button"
			class="btn btn-icon btn-ghost-secondary rounded-circle"
			aria-label="Close record editor"
			aria-controls="offcanvas-app"
			data-panel-close="offcanvas-app"
			aria-expanded="true"
			aria-close>
			<i
				src="/assets/svg/remix/close-line.svg"
				aria-hidden="true"></i>
		</button>
	</header>
	<div class="component-form-body flex-grow-1 min-height:0">
		<form
			state-id="offcanvas-app-form"
			class="app-form"
			storage=""
			database=""
			array
			object
			autocomplete="off">
			<div scrollbar>
				<div src="/apps/databases/components/form.html"></div>
			</div>
			<footer
				src="/components/offcanvas-app/footer.html"
				value-type="outerHtml"></footer>
		</form>
	</div>
</div>
