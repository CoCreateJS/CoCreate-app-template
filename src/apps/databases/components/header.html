<div
	class="database-header-inner d-flex flex-wrap justify-content-between align-items-center gap-3">
	<div class="database-header-primary d-flex align-items-center gap-2">
		<button
			type="button"
			class="database-menu-btn"
			aria-controls="databases-sidebar"
			aria-expanded="false"
			aria-label="Toggle databases menu"
			title="Databases menu">
			<i
				src="/assets/svg/remix/menu-2-line.svg"
				aria-hidden="true"></i>
		</button>
		<div class="min-width:0">
			<div class="text-muted fs-12">Database browser</div>
			<div class="d-flex align-items-center gap-2">
				<h1 class="database-page-title mb-0">Arrays</h1>
				<span class="text-muted">/</span>
				<input
					type="text"
					class="database-selected-array"
					state-id="database-selected-array"
					value="Choose an array"
					aria-label="Selected array"
					readonly />
			</div>
		</div>
	</div>

	<div class="database-header-actions d-flex flex-wrap align-items-center gap-2">
		<button
			type="button"
			class="database-sort-btn btn btn-light"
			filter-query="$document #database-records"
			filter-sort-key="_id"
			filter-sort-direction=""
			click
			click.filter-sort-direction="asc, desc"
			aria-label="Sort records by ID">
			<i
				toggle.src="/assets/svg/sort-down.svg, /assets/svg/sort-up.svg"
				src="/assets/svg/sort.svg"
				aria-hidden="true"></i>
			<span>Sort by ID</span>
		</button>
	</div>
</div>
