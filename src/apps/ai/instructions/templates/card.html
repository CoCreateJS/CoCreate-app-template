<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/file-list-3-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.avatar[0].src}}"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/ai/instructions/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-open><span state-to="offcanvas-app-form" state.array="ai-instructions" state.object="{{object._id}}" hidden></span>{{object.name}}</a>
					</h5>
				</div>
				<div class="app-badges">
					<span
						class="badge app-badge"
						role="status"
						aria-label="Enabled status"
						key="enabled"
						data-value="{{object.enabled}}"
						onload.value="$(`{{object.enabled}}` === 'true' ? 'Enabled' : 'Disabled')"></span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
			<div
				class="d-flex align-items-center gap-2 pt-2 border-top border-top-dashed"
				style="margin-top: auto">
				<i src="/assets/svg/remix/flashlight-line.svg" class="text-warning" aria-hidden="true"></i>
				<span class="text-muted fs-12">Loaded by default</span>
				<span
					class="badge app-badge ms-auto"
					key="default"
					data-value="{{object.default}}"
					onload.value="$(`{{object.default}}` === 'true' ? 'Default' : 'Optional')"></span>
			</div>
		</div>
	</article>
</template>
<div onload.array="ai-instructions" onload-query="$parent"></div>
