<div class="app-card-body">
	<div class="app-heading">
		<div class="app-identity">
			<span class="app-image">
				<span class="app-icon">
					<i src="/assets/svg/remix/file-list-3-line.svg" aria-hidden="true"></i>
				</span>
				<img
					class="app-custom-image"
					key="avatar[0].src"
					alt=""
					hidden
					onload="this.hidden = false"
					onerror="this.hidden = true" />
			</span>
			<h5 class="app-title" key="name"></h5>
		</div>
		<div class="app-badges">
			<span
				class="badge app-badge"
				role="status"
				aria-label="Enabled status"
				key="enabled"
				data-value
				input.data-value="$value"
				input.value="$(`$value` === 'true' ? 'Enabled' : 'Disabled')"></span>
		</div>
	</div>
	<p class="app-description" key="description"></p>
	<div
		class="d-flex align-items-center gap-2 pt-2 border-top border-top-dashed"
		style="margin-top: auto">
		<i src="/assets/svg/remix/flashlight-line.svg" class="text-warning" aria-hidden="true"></i>
		<span class="text-muted fs-12">Loaded by default</span>
		<span
			class="badge app-badge ms-auto"
			key="default"
			data-value
			input.data-value="$value"
			input.value="$(`$value` === 'true' ? 'Default' : 'Optional')"></span>
	</div>
</div>
