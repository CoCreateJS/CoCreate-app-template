<link rel="stylesheet" href="/components/code/index.css" />

	<div class="card-body d-flex flex-column gap-4 h-100">
<section
	class="app-card d-flex flex-column gap-3 pb-3 w-100"
	src="/apps/ai/instructions/components/card.html"></section>
<section class="border-top border-top-dashed pt-3"><h5 class="text-uppercase fw-semibold mb-3">Instructions</h5><div class="component-code border rounded p-3">
    <pre aria-hidden="true"><code class="language-markdown"></code></pre>
    <textarea id="ai-instruction-instructions-details" key="instructions" type="code" lang="markdown"
        value-type="text" value-evaluate="false" height="auto" rows="1"
        class="form-control font-monospace" spellcheck="false"
        aria-label="Instructions" readonly save="false"></textarea>
    <button type="button" class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
    clipboard
    clipboard-query="$parent textarea"
    aria-label="Copy instructions" title="Copy instructions">
    <i src="/assets/svg/remix/file-copy-line.svg" aria-hidden="true"></i>
    <i src="/assets/svg/remix/check-line.svg" aria-hidden="true"></i>
</button>
</div></section>
<section class="border-top border-top-dashed pt-3"><h5 class="text-uppercase fw-semibold mb-3">Examples</h5><div class="component-code border rounded p-3">
    <pre aria-hidden="true"><code class="language-json"></code></pre>
    <textarea id="ai-instruction-examples-details" key="examples" type="code" lang="json"
        value-type="json" value-evaluate="false" height="auto" rows="1"
        class="form-control font-monospace" spellcheck="false"
        aria-label="Examples" readonly save="false"></textarea>
    <button type="button" class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
    clipboard
    clipboard-query="$parent textarea"
    aria-label="Copy examples" title="Copy examples">
    <i src="/assets/svg/remix/file-copy-line.svg" aria-hidden="true"></i>
    <i src="/assets/svg/remix/check-line.svg" aria-hidden="true"></i>
</button>
</div></section>
<section class="border-top border-top-dashed pt-3"><h5 class="text-uppercase fw-semibold mb-3">Sources</h5><div class="component-code border rounded p-3">
    <pre aria-hidden="true"><code class="language-json"></code></pre>
    <textarea id="ai-instruction-sources-details" key="sources" type="code" lang="json"
        value-type="json" value-evaluate="false" height="auto" rows="1"
        class="form-control font-monospace" spellcheck="false"
        aria-label="Sources" readonly save="false"></textarea>
    <button type="button" class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
    clipboard
    clipboard-query="$parent textarea"
    aria-label="Copy sources" title="Copy sources">
    <i src="/assets/svg/remix/file-copy-line.svg" aria-hidden="true"></i>
    <i src="/assets/svg/remix/check-line.svg" aria-hidden="true"></i>
</button>
</div></section>
</div>
