<link rel="stylesheet" href="/components/code/index.css" />

	<div class="card-body d-flex flex-column gap-4 h-100"><div class="d-flex justify-content-end w-100"><label class="form-check form-switch"
					><input
						class="form-check-input"
						type="checkbox"
						role="switch"
						id="ai-instruction-enabled"
						key="enabled" /><span class="form-check-label"
						>Enabled</span
					></label
				></div>
		<input
			type="hidden"
			key="_id" />
		<section>
			<h5 class="text-uppercase fw-semibold mb-3">
				Instruction identity
			</h5>
			<div class="d-flex flex-wrap gap-3">
				<label
					class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:190px"
					>Name<input
						type="text"
						id="ai-instruction-name"
						key="name"
						class="form-control text-lowercase"
						placeholder="crud"
						required
				/></label>
				<label
					class="form-label d-flex flex-column gap-1 flex-grow:2 flex-basis:360px min-width:260px"
					>Description<input
						type="text"
						id="ai-instruction-description"
						key="description"
						class="form-control"
						placeholder="CoCreate CRUD guidance"
						required
				/></label>
			</div>
		</section>
		<section class="border-top border-top-dashed pt-3">
			<h5 class="text-uppercase fw-semibold mb-2">
				Loading behavior
			</h5>
			<p class="text-muted mb-3">
				Default instructions are loaded into the shared instruction
				map when the AI server starts.
			</p>
			<div class="d-flex flex-wrap gap-4">
				<label class="form-check form-switch"
					><input
						class="form-check-input"
						type="checkbox"
						role="switch"
						id="ai-instruction-default"
						key="default" /><span class="form-check-label"
						>Load by default</span
					></label
				>
				
			</div>
		</section>
		<section class="border-top border-top-dashed pt-3">
			<div class="d-flex flex-column gap-1">
<label class="form-label" for="ai-instruction-instructions">Instructions</label>
<div class="component-code border rounded p-3">
    <pre aria-hidden="true"><code class="language-markdown"></code></pre>
    <textarea id="ai-instruction-instructions" key="instructions" type="code" lang="markdown"
        value-type="text" value-evaluate="false" height="auto" rows="1"
        class="form-control font-monospace" spellcheck="false"
        aria-label="Instructions" required></textarea>
    <button type="button" class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
    clipboard
    clipboard-query="$parent textarea"
    aria-label="Copy instructions" title="Copy instructions">
    <i src="/assets/svg/remix/file-copy-line.svg" aria-hidden="true"></i>
    <i src="/assets/svg/remix/check-line.svg" aria-hidden="true"></i>
</button>
</div>
</div>
		</section>
		<section class="border-top border-top-dashed pt-3">
			<div class="d-flex flex-wrap gap-3">
				<div class="d-flex flex-column gap-1 flex-grow-1 flex-basis:360px min-width:260px">
<label class="form-label" for="ai-instruction-examples">Examples</label>
<div class="component-code border rounded p-3">
    <pre aria-hidden="true"><code class="language-json"></code></pre>
    <textarea id="ai-instruction-examples" key="examples" type="code" lang="json"
        value-type="json" value-evaluate="false" height="auto" rows="1"
        class="form-control font-monospace" spellcheck="false"
        aria-label="Examples"></textarea>
    <button type="button" class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
    clipboard
    clipboard-query="$parent textarea"
    aria-label="Copy examples" title="Copy examples">
    <i src="/assets/svg/remix/file-copy-line.svg" aria-hidden="true"></i>
    <i src="/assets/svg/remix/check-line.svg" aria-hidden="true"></i>
</button>
</div>
</div>
				<div class="d-flex flex-column gap-1 flex-grow-1 flex-basis:360px min-width:260px">
<label class="form-label" for="ai-instruction-sources">Sources</label>
<div class="component-code border rounded p-3">
    <pre aria-hidden="true"><code class="language-json"></code></pre>
    <textarea id="ai-instruction-sources" key="sources" type="code" lang="json"
        value-type="json" value-evaluate="false" height="auto" rows="1"
        class="form-control font-monospace" spellcheck="false"
        aria-label="Sources"></textarea>
    <button type="button" class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
    clipboard
    clipboard-query="$parent textarea"
    aria-label="Copy sources" title="Copy sources">
    <i src="/assets/svg/remix/file-copy-line.svg" aria-hidden="true"></i>
    <i src="/assets/svg/remix/check-line.svg" aria-hidden="true"></i>
</button>
</div>
</div>
			</div>
		</section>
		<p class="text-muted fs-12 mb-0">
			Restart the AI server after changing an enabled default
			instruction so its in-memory copy is refreshed.
		</p>
	</div>
