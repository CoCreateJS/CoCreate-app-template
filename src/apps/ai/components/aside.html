<aside
	id="ai-conversations-aside"
	class="ai-aside"
	aria-hidden="true">
	<div class="ai-aside-heading">
		<div class="ai-aside-label">Conversations</div>
		<button
			class="ai-new-chat"
			type="button"
			selected-query="$closest .ai-shell #ai-conversations-aside"
			selected.class="show,"
			selected.aria-hidden="true"
			toggle-query="$closest .ai-shell #ai-aside-toggle"
			toggle.aria-expanded="false"
			click-group="ai-conversation"
			state='{"ai-conversation-messages":{"filter-query-value":"","array":"","$renderValue":{"object":[]}},"ai-queue-conversation-filter":{"filter-query-value":""},"aiChat":{"conversation-id":""},"ai-chat-conversation-id":{"value":""},"ai-chat-model":{"value":"openai:gpt-5.4-nano","array":"ai-conversations","object":"","realtime":"false"}}'
			aria-label="New conversation"
			title="New conversation">
			<i
				src="/assets/svg/remix/add-line.svg"
				aria-hidden="true"></i>
		</button>
	</div>
	<div class="search-box flex-shrink-0">
		<div class="input-group">
			<input
				id="search-ai-conversations"
				type="search"
				class="form-control search search-sm"
				placeholder="Search for..."
				aria-label="Search conversations"
				filter-search
				filter-query="$document #ai-conversations-aside .ai-thread-list" />
		</div>
		<i
			src="/assets/svg/remix/search-line.svg"
			class="search-icon"
			style="pointer-events: none"></i>
	</div>
	<div
		class="ai-thread-scroll-container"
		scrollbar>
		<div class="ai-thread-scroll">
			<div
				class="ai-thread-list"
				array="ai-conversations"
				object
				filter-limit="20"
				render-query="[template='ai-conversation-template']"
				filter-query-key="user_id"
				filter-query-value="$user_id"
				filter-sort-key="_id"
				filter-sort-direction="desc">
				<button
					template="ai-conversation-template"
					type="button"
					class="ai-thread"
					data-conversation-id="{{object._id}}"
					selected-query="$closest .ai-shell #ai-conversations-aside"
					selected.class="show,"
					selected.aria-hidden="true"
					toggle-query="$closest .ai-shell #ai-aside-toggle"
					toggle.aria-expanded="false"
					click-group="ai-conversation"
					click.class="active"
					state-to="ai-conversation-messages"
					state.filter-query-value="{{object._id}}"
					state.array="ai-messages"
					state='{"aiChat":{"conversation-id":"{{object._id}}"},"ai-chat-conversation-id":{"value":"{{object._id}}"},"ai-queue-conversation-filter":{"filter-query-value":"{{object._id}}"},"ai-chat-model":{"value":"{{object.provider}}:{{object.model}}","array":"ai-conversations","object":"{{object._id}}","realtime":"true"}}'>
					<div class="ai-thread-title">
						<span>{{object.title}}</span>
					</div>
				</button>
			</div>
			<div
				class="ai-thread-load-more"
				filter-on="scroll"
				filter-query="$previous"></div>
		</div>
	</div>
</aside>

<button
	type="button"
	tabindex="-1"
	class="ai-aside-backdrop"
	aria-label="Close conversations"
	aria-controls="ai-conversations-aside"
	aria-close
	state-to="ai-chat-btn"
	state.$unset="$click"></button>
