<section class="ai-code-block">
	<header>
		<span data-code-language></span>
		<div class="ai-code-actions">
			<button type="button" data-code-copy>Copy raw</button>
			<details class="ai-code-menu">
				<summary aria-label="Code options" aria-haspopup="menu">
					<i
						src="/assets/svg/remix/more-2-fill.svg"
						aria-hidden="true"></i>
				</summary>
				<div role="menu" aria-label="Code block actions">
					<button
						type="button"
						role="menuitem"
						actions="export"
						export-format="raw"
						export-query="$closest .ai-code-block code"
						export-filename="cocreate-ai.js"
						export-mime="text/javascript;charset=utf-8"
						data-code-download>
						Download raw
					</button>
				</div>
			</details>
		</div>
	</header>
	<pre><code data-code-content></code></pre>
</section>
