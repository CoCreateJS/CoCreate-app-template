<article class="card app-card">
	<div class="app-card-body">
		<div class="app-heading">
			<div class="app-identity">
				<span class="app-image">
					<span class="app-icon">
						<i src="/assets/svg/remix/share-line.svg" aria-hidden="true"></i>
					</span>
					<img
						class="app-custom-image"
						key="avatar[0].src"
						alt=""
						hidden
						onload="this.hidden = false"
						onerror="this.hidden = true" />
				</span>
				<h5 class="app-title" key="title"></h5>
			</div>
			<span class="text-muted fs-12">By <span key="author"></span></span>
			<div class="app-badges">
				<span
					class="badge app-badge"
					key="status"
					data-value
					input.data-value="$value"
					input.value="$value"></span>
			</div>
		</div>
		<p class="app-description" key="caption"></p>
		<div class="d-flex flex-wrap gap-3">
			<span>
				<i src="/assets/svg/remix/heart-line.svg" class="me-1"></i>
				<span key="engagement.likes"></span>
			</span>
			<span>
				<i src="/assets/svg/remix/chat-3-line.svg" class="me-1"></i>
				<span key="engagement.comments"></span>
			</span>
			<span>
				<i src="/assets/svg/remix/share-forward-line.svg" class="me-1"></i>
				<span key="engagement.shares"></span>
			</span>
		</div>
		<div class="text-muted fs-12 pt-2 border-top border-top-dashed">
			Scheduled:
			<span key="scheduled_time"></span>
		</div>
	</div>
</article>
