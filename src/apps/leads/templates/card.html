<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon bg-secondary-subtle text-secondary">
							<span class="avatar-initial">{{object.first_name[0]}}</span>
							<span class="avatar-initial">{{object.last_name[0]}}</span>
							<img
								class="app-custom-image object-fit-cover"
								src="{{object.avatar[0].src}}"
								alt="{{object.name}}"
								onerror="this.hidden = true"
								hidden
								onload="this.hidden = false" />
						</span>
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/leads/app.html"
							aria-controls="offcanvas-app"
							aria-open
							aria-haspopup="dialog"
							aria-expanded="false"><span state-to="offcanvas-app-form" state.array="contacts" state.object="{{object._id}}" hidden></span>{{object.name}}</a>
					</h5>
				</div>
				<span class="text-muted text-truncate d-block">{{object.company}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="status" data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
			<div class="d-flex flex-column gap-2 text-muted fs-12">
				<span><i src="/assets/svg/remix/mail-line.svg" class="me-2"></i>{{object.email}}</span>
				<span><i src="/assets/svg/remix/phone-line.svg" class="me-2"></i>{{object.phone}}</span>
				<span><i src="/assets/svg/remix/map-pin-line.svg" class="me-2"></i>{{object.city}}, {{object.country}}</span>
			</div>
			<div
				class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed"
				array="contacts"
				object="{{object._id}}"
				key="type"
				render-query="[template='lead-card-type']">
				<span template="lead-card-type" class="badge border border-info text-info">{{type}}</span>
			</div>
			<div
				class="d-flex flex-wrap gap-1"
				array="contacts"
				object="{{object._id}}"
				key="tags"
				render-query="[template='lead-card-tag']">
				<span template="lead-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="contacts" onload-query="$parent"></div>
