<div class="card-body d-flex flex-column gap-4 h-100">
	<div
		class="app-image-editor"
		src="/components/profile-img.html"></div>

	<div class="d-flex flex-wrap gap-3">
		<label class="form-label d-flex flex-column gap-1 w-100">
			First Name
			<input
				type="text"
				key="first_name"
				id="leadname-field"
				class="form-control"
				placeholder="Enter First Name"
				aria-label="Lead First Name" />
		</label>

		<label class="form-label d-flex flex-column gap-1 w-100">
			Last Name
			<input
				type="text"
				key="last_name"
				id="leadname-field"
				class="form-control"
				placeholder="Enter Last Name"
				aria-label="Lead Last Name" />
		</label>

		<label class="form-label d-flex flex-column gap-1 w-100">
			Description
			<textarea
				key="description"
				id="description-field"
				class="form-control"
				placeholder="Enter Description"
				aria-label="Description"></textarea>
		</label>

		<label class="form-label d-flex flex-column gap-1 w-100">
			Company Name
			<input
				type="text"
				key="company"
				id="company-field"
				class="form-control"
				placeholder="Enter Company Name"
				aria-label="Company Name" />
		</label>

		<label class="form-label d-flex flex-column gap-1 w-100">
			Lead Score
			<input
				type="text"
				key="lead_score"
				id="lead_score-field"
				class="form-control"
				placeholder="Enter Lead Score"
				aria-label="Lead Score" />
		</label>

		<label class="form-label d-flex flex-column gap-1 w-100">
			Phone
			<input
				type="text"
				key="phone"
				id="phone-field"
				class="form-control"
				placeholder="Enter Phone Number"
				aria-label="Phone Number" />
		</label>

		<label class="form-label d-flex flex-column gap-1 w-100">
			Location
			<input
				type="text"
				key="location"
				id="location-field"
				class="form-control"
				placeholder="Enter Location"
				aria-label="Location" />
		</label>

		<label class="form-label d-flex flex-column gap-1 w-100">
			Tags
			<select
				key="tags"
				id="taginput-choices"
				class="form-control"
				multiple
				aria-label="Tags">
				<option value="Lead">Lead</option>
				<option value="Partner">Partner</option>
				<option value="Exiting">Exiting</option>
				<option value="Long-term">Long-term</option>
			</select>
		</label>
	</div>
</div>
