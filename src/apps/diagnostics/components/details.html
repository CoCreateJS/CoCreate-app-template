
	<div class="card-body d-flex flex-column gap-4 h-100">
		<div class="flex-grow-1">
			<div
				class="d-flex flex-wrap gap-3 justify-content-between mb-3">
				<h4 class="app-title mb-1">
					<span key="first_name" aria-label="First Name"></span>
				</h4>
				<div class="d-flex gap-3 flex-wrap">
					<div>
						<a
							href="#"
							class="text-primary d-block"
							key="healthScore"
							aria-label="Health Score"></a>
					</div>
					<div class="vr"></div>
					<div class="text-muted">
						Updated :
						<span
							class="text-body fw-medium"
							key="lastUpdated"
							aria-label="Last Updated Date"></span>
					</div>
				</div>
			</div>

			<div class="d-flex flex-wrap gap-3">
				<div class="d-flex flex-wrap gap-3 flex-grow-1">
					<div
						class="p-2 border border-dashed rounded flex-grow-1 width:150px">
						<div class="d-flex align-items-center">

							<div class="flex-grow-1">
								<p class="text-muted mb-1">
									Biological Age :
								</p>
								<h5
									class="mb-0"
									key="biologicalAge"
									aria-label="Biological Age"></h5>
							</div>
						</div>
					</div>
					<div
						class="p-2 border border-dashed rounded flex-grow-1 width:150px">
						<div class="d-flex align-items-center">

							<div class="flex-grow-1">
								<p class="text-muted mb-1">Cardio Stat :</p>
								<h5
									class="mb-0"
									key="cardioStat"
									aria-label="Cardiovascular Stat"></h5>
							</div>
						</div>
					</div>
					<div
						class="p-2 border border-dashed rounded flex-grow-1 width:150px">
						<div class="d-flex align-items-center">

							<div class="flex-grow-1">
								<p class="text-muted mb-1">Metabolism :</p>
								<h5
									class="mb-0"
									key="metabolismStat"
									aria-label="Metabolism Stat"></h5>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="mt-4">
				<h5 class="mt-4">Diagnostics Overview</h5>
				<div class="d-flex flex-wrap">
					<div class="flex-grow-1 flex-basis:50.000% min-width:260px">
						<ul class="list-unstyled mb-0">
							<li class="mb-2">
								<strong>DunedinPACE:</strong>
								<span key="paceOfAging"></span>
							</li>
							<li class="mb-2">
								<strong>Nutrition:</strong>
								<span key="nutritionStat"></span>
							</li>
							<li class="mb-2">
								<strong>Gut Health:</strong>
								<span key="gutHealthStat"></span>
							</li>
							<li class="mb-2">
								<strong>Discover Status:</strong>
								<span key="discoverStatus"></span>
							</li>
						</ul>
					</div>
					<div class="flex-grow-1 flex-basis:50.000% min-width:260px">
						<ul class="list-unstyled mb-0">
							<li class="mb-2">
								<strong>Genetics:</strong>
								<span key="geneticsStat"></span>
							</li>
							<li class="mb-2">
								<strong>Cellular Health:</strong>
								<span key="cellularStat"></span>
							</li>
							<li class="mb-2">
								<strong>Hormones:</strong>
								<span key="hormonesStat"></span>
							</li>
							<li class="mb-2">
								<strong>Optimize Status:</strong>
								<span key="optimizeStatus"></span>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</div>
