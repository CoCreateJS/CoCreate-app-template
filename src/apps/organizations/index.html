<div class="width:100% min-width:0 p-3">
	<section
		role="banner"
		class="position-relative">
		<div
			class="profile-wid-bg mx-n5 my-n3 height:480px@xxs&xs height:370px@sm height:300px@md&xxxl">
			<img
				src="/assets/images/profile-bg.jpg"
				alt=""
				class="profile-wid-img"
				key="cover_image" />
		</div>

		<div class="mb-4 mb-lg-3 pb-lg-4">
			<div class="d-flex flex-wrap gap-4">
				<div
					src="/components/profile-img.html"
					input.src="/assets/images/icons/512x512.png"
					input-query="[src]"></div>

				<div
					class="position-relative flex-grow-1 mb-3 width:100%@xxs&xs">
					<div>
						<h3 class="text-white mb-1">
							<span key="name"></span>
						</h3>
						<p
							class="text-white text-opacity-75"
							key="tagline"></p>
					</div>
					<div
						class="d-flex flex-wrap flex-column@xxs@xs gap-2 text-white-50">
						<div class="flex-grow:1@xxs">
							<i src="/assets/svg/remix/building-line.svg" class="me-1 text-white text-opacity-75 fs-16 align-middle"></i>
							<span key="website"></span>
						</div>
						<div>
							<i src="/assets/svg/remix/map-pin-user-line.svg" class="me-1 text-white text-opacity-75 fs-16 align-middle"></i>
							<span key="city"></span>,
							<span key="country"></span>
						</div>
					</div>
				</div>

				<div
					class="position-relative d-flex justify-content-between text text-white-50 text-center width:250px mb-2 width:100%@xxs&xs">
					<div class="p-2">
						<h4
							class="text-white mb-1"
							key="followers">
							0
						</h4>
						<p class="fs-14 mb-0">Followers</p>
					</div>

					<div class="p-2">
						<h4
							class="text-white mb-1"
							key="following">
							0
						</h4>
						<p class="fs-14 mb-0">Following</p>
					</div>
				</div>
				<!--end col-->
			</div>
			<!--end row-->
		</div>

		<div class="d-none">
			<!-- Nav tabs -->
			<ul
				class="nav nav-pills animation-nav profile-nav gap-2 gap-lg-3 flex-grow-1"
				role="tablist">
				<li class="nav-item">
					<a
						class="nav-link fs-14 active"
						role="tab"
						id="overview-tab-btn"
						aria-selected="true"
						aria-controls="overview-tab"
						tabindex="0"
						click.class="active"
						click-group="profile-tabs">
						<i src="/assets/svg/remix/airplay-fill.svg" class="d-inline-block d-md-none"></i>
						<span class="d-none d-md-inline-block">Overview</span>
					</a>
				</li>
				<li class="nav-item">
					<a
						class="nav-link fs-14"
						role="tab"
						id="members-tab-btn"
						aria-selected="false"
						aria-controls="members"
						tabindex="0"
						click.class="active"
						click-group="profile-tabs">
						<i src="/assets/svg/remix/price-tag-line.svg" class="d-inline-block d-md-none"></i>
						<span class="d-none d-md-inline-block">Members</span>
					</a>
				</li>
				<li>
					<a
						class="nav-link fs-14"
						role="tab"
						id="documents-tab-btn"
						aria-selected="false"
						aria-controls="documents"
						tabindex="0"
						click.class="active"
						click-group="profile-tabs">
						<i src="/assets/svg/remix/folder-4-line.svg" class="d-inline-block d-md-none"></i>
						<span class="d-none d-md-inline-block">Documents</span>
					</a>
				</li>
			</ul>

			<a
				role="button"
				state-to="adminView"
				state.src="/apps/organizations/create.html"
				class="btn btn-success z-index:1"
				href="javascript:void(0);">
				<i src="/assets/svg/remix/edit-box-line.svg" class="align-bottom"></i>
				<span class="d-none d-sm-inline-block">Edit</span>
			</a>
		</div>
	</section>

	<!-- Tab panes -->
	<section class="tab-content pt-4 text-muted">
		<div
			class="tab-pane show"
			id="overview-tab"
			role="tabpanel">
			<div class="d-flex flex-wrap gap-4 min-width:0">
				<div
					class="flex-grow-1 flex-basis:300px min-width:min(280px,100%)">
					<div src="/apps/organizations/components/info.html"></div>
					<div src="/apps/organizations/components/about.html"></div>
				</div>
			</div>
		</div>

		<div
			class="tab-pane fade"
			id="projects"
			role="tabpanel"
			src="/apps/organizations/members.html"></div>
		<!--end tab-pane-->
	</section>
	<!--end tab-content-->
</div>
