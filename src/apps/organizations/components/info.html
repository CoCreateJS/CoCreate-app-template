<h6 class="text-muted text-uppercase fw-semibold mb-3">Organization info</h6>
<dl class="app-fields d-flex flex-wrap gap-3 mb-0">
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Name</dt>
		<dd class="mb-0 text-break" key="name"></dd>
	</div>

	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Email</dt>
		<dd class="mb-0 text-break" key="email"></dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Phone</dt>
		<dd class="mb-0 text-break" key="phone"></dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Website</dt>
		<dd class="mb-0 text-break" key="website"></dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Address</dt>
		<dd class="mb-0 text-break" key="address"></dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">City</dt>
		<dd class="mb-0 text-break" key="city"></dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Country</dt>
		<dd class="mb-0 text-break" key="country"></dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Zip code</dt>
		<dd class="mb-0 text-break" key="zip_code"></dd>
	</div>
	<div class="app-field app-field-half">
		<dt class="text-muted fw-normal mb-1">Status</dt>
		<dd class="mb-0 text-break" key="status"></dd>
	</div>
</dl>
