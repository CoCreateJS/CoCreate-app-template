<div class="app-identity app-list">
	<span class="app-image">
		<img
			src="/assets/images/icons/512x512.png"
			alt="Organization image"
			onload="this.hidden = false"
			onerror="this.hidden = true" />
		<img
			class="app-custom-image"
			key="avatar[0].src"
			alt="Organization image"
			hidden
			onload="this.hidden = false"
			onerror="this.hidden = true" />
	</span>
	<span class="app-title" key="name"></span>
</div>
