	<div class="card-body d-flex flex-column gap-4 h-100">
<section class="d-flex flex-wrap align-items-center gap-3 pb-3">
			<div class="app-image-editor flex-shrink-0" src="/components/profile-img.html"></div>
			<div class="flex-grow-1 min-width:0">
				<h5 class="app-title mb-1"><span key="name"></span></h5>
				<p class="text-muted mb-2" key="tagline"></p>
				<div class="d-flex flex-wrap gap-2 text-muted">
					<span><i src="/assets/svg/remix/global-line.svg" class="me-1" aria-hidden="true"></i><span key="website"></span></span>
					<span><i src="/assets/svg/remix/map-pin-user-line.svg" class="me-1" aria-hidden="true"></i><span key="city"></span>, <span key="country"></span></span>
				</div>
			</div>
		</section>
<section class="w-100 min-width:0">
<div class="app-fields d-flex flex-wrap gap-3">
	<div class="app-field app-field-half">
		<div class="mb-0">
			<label
				for="orgNameInput"
				class="form-label"
				>Organization Name</label
			>
			<input
				type="text"
				class="form-control"
				id="orgNameInput"
				placeholder="Enter organization name"
				key="name"
				aria-label="Organization Name"
				autocomplete="organization" />
		</div>
	</div>

	<div class="app-field app-field-half">
		<div class="mb-0">
			<label
				for="phonenumberInput"
				class="form-label"
				>Phone Number</label
			>
			<input
				type="text"
				class="form-control"
				id="phonenumberInput"
				placeholder="Enter phone number"
				key="phone"
				aria-label="Phone Number"
				autocomplete="tel" />
		</div>
	</div>
	<div class="app-field app-field-half">
		<div class="mb-0">
			<label
				for="emailInput"
				class="form-label"
				>Email Address</label
			>
			<input
				type="email"
				class="form-control"
				id="emailInput"
				placeholder="Enter email"
				key="email"
				aria-label="Email Address"
				autocomplete="email" />
		</div>
	</div>


	<div class="app-field app-field-half">
		<div class="mb-0">
			<label
				for="websiteInput1"
				class="form-label"
				>Website</label
			>
			<input
				type="text"
				class="form-control"
				id="websiteInput1"
				placeholder="www.example.com"
				key="website"
				aria-label="Website"
				autocomplete="url" />
		</div>
	</div>
	<div class="app-field app-field-third">
		<div class="mb-0">
			<label
				for="cityInput"
				class="form-label"
				>City</label
			>
			<input
				type="text"
				class="form-control"
				id="cityInput"
				placeholder="City"
				key="city"
				aria-label="City"
				autocomplete="address-level2" />
		</div>
	</div>
	<div class="app-field app-field-third">
		<div class="mb-0">
			<label
				for="countryInput"
				class="form-label"
				>Country</label
			>
			<input
				type="text"
				class="form-control"
				id="countryInput"
				placeholder="Country"
				key="country"
				aria-label="Country"
				autocomplete="country" />
		</div>
	</div>
	<div class="app-field app-field-third">
		<div class="mb-0">
			<label
				for="zipcodeInput"
				class="form-label"
				>Zip Code</label
			>
			<input
				type="text"
				class="form-control"
				minlength="5"
				maxlength="6"
				id="zipcodeInput"
				placeholder="Enter zipcode"
				key="zip_code"
				aria-label="Zip Code"
				autocomplete="postal-code" />
		</div>
	</div>
	<div class="app-field app-field-full">
		<div class="mb-0">
			<label
				for="exampleFormControlTextarea"
				class="form-label"
				>Description</label
			>
			<textarea
				class="form-control"
				id="exampleFormControlTextarea"
				placeholder="Enter organization description"
				rows="3"
				key="description"
				aria-label="Description"></textarea>
		</div>
	</div>
</div>
</section>
	</div>
