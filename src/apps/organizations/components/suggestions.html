<div class="card">
	<div class="card-body">
		<div class="d-flex align-items-center mb-4">
			<div class="flex-grow-1">
				<h5 class="card-title mb-0">Suggestions</h5>
			</div>
			<div class="flex-shrink-0">
				<div class="dropdown">
					<a
						href="#"
						role="button"
						id="dropdownMenuLink2"
						aria-expanded="false"
						aria-controls="dropdownMenuLink2">
						<i src="/assets/svg/remix/more-2-fill.svg" class="fs-14"></i>
					</a>

					<ul 
						id="dropdownMenuLink2"
						class="dropdown-menu dropdown-menu-end"
						aria-close-on="anywhere"
						aria-labelledby="dropdownMenuLink2">
						<li>
							<a class="dropdown-item" href="#">View</a>
						</li>
						<li>
							<a class="dropdown-item" href="#">Edit</a>
						</li>
						<li>
							<a class="dropdown-item" href="#">Delete</a>
						</li>
					</ul>
				</div>
			</div>
		</div>
		<div
			array="contacts"
			object
			filter-key="_id"
			filter-value="$user_id"
			filter-operator="$nin"
			render-limit="3"
			render-as="suggestion"
			render-query="template">
			<template>
				<div class="d-flex align-items-center py-3">
					<div class="avatar-xs flex-shrink-0 me-3">
						<img
							src="{{suggestion.profile_image}}"
							alt=""
							class="img-fluid rounded-circle material-shadow" />
					</div>
					<div class="flex-grow-1">
						<div>
							<h5 class="fs-14 mb-1">
								{{suggestion.first_name}}
								{{suggestion.last_name}}
							</h5>
							<p class="fs-13 text-muted mb-0">
								{{suggestion.job_title}}
							</p>
						</div>
					</div>
					<div class="flex-shrink-0 ms-2">
						<button
							type="button"
							class="btn btn-sm btn-outline-success material-shadow-none"
							array="contacts"
							object="{{suggestion._id}}"
							actions="followUser">
							<!-- 'followUser' is a placeholder for the actual action -->
							<i src="/assets/svg/remix/user-add-line.svg" class="align-middle"></i>
						</button>
					</div>
				</div>
			</template>
		</div>
	</div>
	<!-- end card body -->
</div>
<!--end card-->
