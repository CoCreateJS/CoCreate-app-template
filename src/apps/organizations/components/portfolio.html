<div class="card">
	<div class="card-body">
		<h5 class="card-title mb-4">Portfolio</h5>
		<div
			class="d-flex flex-wrap gap-2"
			array="contacts"
			object="$user_id"
			key="social"
			fiter-limit
			render-query="[template]">	
			<div template>
				<a
					href="{{social.url}}"
					class="avatar-xs d-block"
					target="_blank"
					rel="noopener noreferrer">
					<span
						class="avatar-title rounded-circle fs-16 material-shadow background-color:{{social.background_color}} color:{{social.color}}"
						key="bg_class">
						<i src="{{social.icon}}"></i>

					</span>
				</a>
			</div>
		</div>
	</div>
	<!-- end card body -->
</div>
<!-- end card -->
