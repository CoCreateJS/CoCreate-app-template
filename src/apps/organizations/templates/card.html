<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<img
							src="/assets/images/icons/512x512.png"
							alt=""
							onload="this.hidden = false"
							onerror="this.hidden = true" />
						<img
							class="app-custom-image"
							src="{{object.avatar[0].src}}"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/organizations/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-open><span hidden state-to="offcanvas-app-form" state.array="{{object.$array[0]}}" state.object="{{object._id}}"></span>{{object.name}}</a>
					</h5>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
			<p class="text-muted mb-0">{{object.tagline}}</p>
		</div>
	</article>
</template>
