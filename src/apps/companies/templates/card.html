<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<span class="avatar-initial">{{object.name[0]}}</span>
							<img
								class="app-custom-image object-fit-cover"
								src="{{object.logo}}"
								alt="{{object.name}}"
								onerror="this.hidden = true"
								hidden
								onload="this.hidden = false" />
						</span>
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/companies/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-open><span state-to="offcanvas-app-form" state.array="companies" state.object="{{object._id}}" hidden></span>{{object.name}}</a>
					</h5>
				</div>
				<span class="text-muted text-truncate d-block">{{object.industry}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="status" data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Rating</span>
					<strong><i src="/assets/svg/remix/star-fill.svg" class="text-warning me-1"></i>{{object.rating}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Employees</span>
					<strong>{{object.employees}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Since</span>
					<strong>{{object.since}}</strong>
				</div>
			</div>
			<div class="d-flex flex-column gap-2 text-muted fs-12">
				<span><i src="/assets/svg/remix/mail-line.svg" class="me-2"></i>{{object.email}}</span>
				<span><i src="/assets/svg/remix/global-line.svg" class="me-2"></i>{{object.website}}</span>
				<span><i src="/assets/svg/remix/map-pin-line.svg" class="me-2"></i>{{object.location}}</span>
			</div>
			<div
				class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed"
				array="companies"
				object="{{object._id}}"
				key="type"
				render-query="[template='company-card-type']">
				<span template="company-card-type" class="badge border border-info text-info">{{type}}</span>
			</div>
			<div
				class="d-flex flex-wrap gap-1"
				array="companies"
				object="{{object._id}}"
				key="tags"
				render-query="[template='company-card-tag']">
				<span template="company-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="companies" onload-query="$parent"></div>
