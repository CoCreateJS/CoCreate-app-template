
	<div class="card-body d-flex flex-column gap-4 h-100">
		<div
			class="app-image-editor" media-path="/media/logos/"
			input.src="/assets/images/multi-user.jpg"
			input-query="img"
			src="/components/profile-img.html"></div>
		<label
			class="form-label"
			id="company-name-label"
			>Company Name
			<input
				type="text"
				key="name"
				name="name"
				class="form-control"
				placeholder="Enter company name"
				aria-labelledby="company-name-label" />
		</label>
		<label
			class="form-label"
			id="website-label"
			>Website
			<input
				type="url"
				key="website"
				name="website"
				class="form-control"
				placeholder="Enter website URL"
				aria-labelledby="website-label" />
		</label>
		<label
			class="form-label"
			id="industry-label"
			>Industry
			<input
				type="text"
				key="industry"
				name="industry"
				class="form-control"
				placeholder="Enter industry"
				aria-labelledby="industry-label" />
		</label>
		<label
			class="form-label"
			id="employee-count-label"
			>Employee Count
			<input
				type="number"
				key="employee_count"
				name="employee_count"
				class="form-control"
				placeholder="Enter employee count"
				aria-labelledby="employee-count-label" />
		</label>
		<label
			class="form-label"
			id="description-label"
			>Description
			<textarea
				key="description"
				name="description"
				class="form-control"
				placeholder="Enter company description"
				aria-labelledby="description-label"></textarea>
		</label>
		<div class="d-flex flex-column flex-grow-1 gap-3 min-w-250px">
			<div
				class="card-header"
				id="contact-information-header">
				Contact Information
			</div>
			<label
				class="form-label"
				id="primary-contact-name-label"
				>Primary Contact Name
				<input
					type="text"
					key="primary_contact_name"
					name="primary_contact_name"
					class="form-control"
					placeholder="Enter primary contact name"
					aria-labelledby="primary-contact-name-label" />
			</label>
			<label
				class="form-label"
				id="primary-contact-email-label"
				>Primary Contact Email
				<input
					type="email"
					key="primary_contact_email"
					name="primary_contact_email"
					class="form-control"
					placeholder="Enter primary contact email"
					aria-labelledby="primary-contact-email-label" />
			</label>
			<label
				class="form-label"
				id="primary-contact-phone-label"
				>Primary Contact Phone
				<input
					type="tel"
					key="primary_contact_phone"
					name="primary_contact_phone"
					class="form-control"
					placeholder="Enter primary contact phone"
					aria-labelledby="primary-contact-phone-label" />
			</label>
			<div
				class="card-header"
				id="address-header">
				Address
			</div>
			<label
				class="form-label"
				id="street-label"
				>Street
				<input
					type="text"
					key="street"
					name="street"
					class="form-control"
					placeholder="Enter street"
					aria-labelledby="street-label" />
			</label>
			<label
				class="form-label"
				id="city-label"
				>City
				<input
					type="text"
					key="city"
					name="city"
					class="form-control"
					placeholder="Enter city"
					aria-labelledby="city-label" />
			</label>
			<label
				class="form-label"
				id="state.province-label"
				>State/Province
				<input
					type="text"
					key="state-province"
					name="state-province"
					class="form-control"
					placeholder="Enter state/province"
					aria-labelledby="state.province-label" />
			</label>
			<label
				class="form-label"
				id="zip-postal-code-label"
				>Zip/Postal Code
				<input
					type="text"
					key="zip_postal_code"
					name="zip_postal_code"
					class="form-control"
					placeholder="Enter zip/postal code"
					aria-labelledby="zip-postal-code-label" />
			</label>
			<label
				class="form-label"
				id="country-label"
				>Country
				<input
					type="text"
					key="country"
					name="country"
					class="form-control"
					placeholder="Enter country"
					aria-labelledby="country-label" />
			</label>
		</div>
	</div>
