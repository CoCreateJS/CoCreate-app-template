<article class="card app-card">
	<div class="app-card-body">
		<div class="app-heading">
			<div class="app-identity">
				<span class="app-image">
					<span class="app-icon">
						<span class="avatar-initial" key="name[0]"></span>
						<img
							class="app-custom-image object-fit-cover"
							key="logo"
							alt="Company logo"
							onerror="this.hidden = true"
							hidden
							onload="this.hidden = false" />
					</span>
				</span>
				<h5 class="app-title" key="name"></h5>
			</div>
			<span class="text-muted text-truncate d-block" key="industry"></span>
			<div class="app-badges">
				<span
					class="badge app-badge"
					key="status"
					data-value
					input.data-value="$value"
					input.value="$value"></span>
			</div>
		</div>
		<div class="d-flex flex-wrap gap-3">
			<div>
				<span class="text-muted fs-12 d-block">Rating</span>
				<strong>
					<i src="/assets/svg/remix/star-fill.svg" class="text-warning me-1"></i>
					<span key="rating"></span>
				</strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Employees</span>
				<strong key="employees"></strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Since</span>
				<strong key="since"></strong>
			</div>
		</div>
		<div class="d-flex flex-column gap-2 text-muted fs-12">
			<span>
				<i src="/assets/svg/remix/mail-line.svg" class="me-2"></i>
				<span key="email"></span>
			</span>
			<span>
				<i src="/assets/svg/remix/global-line.svg" class="me-2"></i>
				<span key="website"></span>
			</span>
			<span>
				<i src="/assets/svg/remix/map-pin-line.svg" class="me-2"></i>
				<span key="location"></span>
			</span>
		</div>
		<div
			class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed"
			key="type"
			render-query="[template='company-card-type']">
			<span template="company-card-type" class="badge border border-info text-info">{{type}}</span>
		</div>
		<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='company-card-tag']">
			<span template="company-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span>
		</div>
	</div>
</article>
