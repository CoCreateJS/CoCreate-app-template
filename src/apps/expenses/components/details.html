
	<div class="card-body d-flex flex-column gap-4 h-100">
		<div
			class="flex-shrink-0 app-identity"
			style="margin-bottom: 2rem; flex-basis: 250px">
			<h5 class="app-title mb-1" key="name" aria-label="Expense Name"></h5>
			<p
				class="text-muted"
				key="category"
				aria-label="Expense Category"></p>
		</div>
		<div class="flex-grow-1" style="flex-basis: 0; min-width: 300px">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">
				Expense Information
			</h6>
			<p
				class="text-muted mb-4"
				key="description"
				aria-label="Expense Description"></p>
			<div class="table-responsive table-card">
				<table
					class="table table-borderless mb-0"
					aria-label="Expense Details Table">
					<tbody>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Date Label">
								Date
							</td>
							<td key="date" aria-label="Expense Date"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Amount Label">
								Amount
							</td>
							<td
								key="amount"
								aria-label="Expense Amount"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Tax Label">
								Tax
							</td>
							<td key="tax" aria-label="Expense Tax"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Currency Label">
								Currency
							</td>
							<td
								key="currency"
								aria-label="Expense Currency"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Vendor Label">
								Vendor
							</td>
							<td
								key="vendor"
								aria-label="Expense Vendor"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Reference Label">
								Reference
							</td>
							<td
								key="reference"
								aria-label="Expense Reference"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Status Label">
								Status
							</td>
							<td
								key="status"
								aria-label="Expense Status"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Paid By Label">
								Paid By
							</td>
							<td
								key="paid_by"
								aria-label="Expense Paid By"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Project Label">
								Project
							</td>
							<td
								key="project"
								aria-label="Expense Project"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Due Date Label">
								Due Date
							</td>
							<td
								key="due_date"
								aria-label="Expense Due Date"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Approval By Label">
								Approval By
							</td>
							<td
								key="approved_by"
								aria-label="Expense Approval By"></td>
						</tr>
						<tr>
							<td
								class="fw-medium"
								scope="row"
								aria-label="Tags Label">
								Tags
							</td>
							<td>
								<span
									key="tags"
									render-query="[template]"
									aria-label="Expense Tags">
									<span
										template
										class="badge border border-primary text-primary me-1"
										>{{tags}}</span
									>
								</span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div class="w-100" src="components/activities.html"></div>
	</div>
