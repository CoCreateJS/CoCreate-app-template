<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/money-dollar-circle-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.avatar[0].src}}"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/expenses/app.html"
							aria-controls="offcanvas-app"
							aria-open
							aria-haspopup="dialog"
							aria-expanded="false"><span state-to="offcanvas-app-form" state.array="transactions" state.object="{{object._id}}" hidden></span>{{object.name}}</a>
					</h5>
				</div>
				<span class="text-muted fs-12">{{object.expenseId}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="status" data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Amount</span>
					<strong>{{object.currency}} {{object.amount}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Tax</span>
					<strong>{{object.currency}} {{object.tax}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Category</span>
					<strong>{{object.category}}</strong>
				</div>
			</div>
			<div class="d-flex flex-column gap-2 text-muted fs-12">
				<span><i src="/assets/svg/remix/store-2-line.svg" class="me-2"></i>{{object.vendor}}</span>
				<span><i src="/assets/svg/remix/user-line.svg" class="me-2"></i>Paid by: {{object.paid_by}}</span>
				<span><i src="/assets/svg/remix/briefcase-line.svg" class="me-2"></i>{{object.project}}</span>
			</div>
			<div class="d-flex justify-content-between pt-2 border-top border-top-dashed text-muted fs-12">
				<span>Expense: {{object.date}}</span>
				<span>Due: {{object.due_date}}</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="transactions" onload-query="$parent"></div>
