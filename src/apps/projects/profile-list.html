<div class="card">
	<div class="card-body">
		<div class="d-flex flex-wrap" array="projects" object filter-limit="20" render-query="[template]">
			<div class="flex-grow-1 flex-basis:25.000% min-width:220px" template>
				<div class="card profile-project-card shadow-none material-shadow">
					<div class="card-body p-4">
						<div class="d-flex">
							<div class="flex-grow-1 text-muted overflow-hidden">
								<h5 class="fs-14 text-truncate">
									<a href="#" class="text-body">{{object.name}}</a>
								</h5>
								<p class="text-muted text-truncate mb-0">
									Last Update :
									<span class="fw-semibold text-body">{{object.last_update}}</span>
								</p>
							</div>
							<div class="flex-shrink-0 ms-2">
								<div class="badge fs-10">{{object.status}}</div>
							</div>
						</div>
						<div class="d-flex mt-4">
							<div class="flex-grow-1">
								<div class="d-flex align-items-center gap-2">
									<div>
										<h5 class="fs-12 text-muted mb-0">Members :</h5>
									</div>
									<div class="avatar-group" array="members" render="team_members" render-query="[template]">
										<div class="avatar-group-item material-shadow" template>
											<div class="avatar-xs">
												<!-- If you have avatar images, use <img src="{{avatar}}" ... /> otherwise fallback to initials -->
												<span class="avatar-title rounded-circle bg-light text-primary">{{.}}</span>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- end card body -->
				</div>
				<!-- end card -->
			</div>
			<!--end col-->
		</div>
		<!--end row-->
	</div>
	<!--end card-body-->
</div>
<!--end card-->
