<article class="card app-card">
	<div class="app-card-body">
		<div class="app-heading">
			<div class="app-identity">
				<span class="app-image">
					<span class="app-icon">
						<i src="/assets/svg/remix/briefcase-line.svg" aria-hidden="true"></i>
					</span>
					<img
						class="app-custom-image"
						key="thumbnail"
						alt=""
						hidden
						onload="this.hidden = false"
						onerror="this.hidden = true" />
				</span>
				<h5 class="app-title" key="name"></h5>
			</div>
			<span class="text-muted fs-12">Owner: <span key="owner"></span></span>
			<div class="app-badges">
				<span
					class="badge app-badge"
					key="status"
					data-value
					input.data-value="$value"
					input.value="$value"></span>
			</div>
		</div>
		<p class="app-description" key="description"></p>
		<div class="d-flex flex-wrap gap-3">
			<div>
				<span class="text-muted fs-12 d-block">Stage</span>
				<strong key="stage"></strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Team lead</span>
				<strong key="team_lead"></strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Deadline</span>
				<strong key="deadline"></strong>
			</div>
		</div>
		<div class="d-flex justify-content-between pt-2 border-top border-top-dashed">
			<span
				class="badge app-badge"
				key="priority"
				data-value
				input.data-value="$value"
				input.value="$value"></span>
			<span class="text-muted fs-12 text-capitalize" key="privacy"></span>
		</div>
		<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='project-card-tag']">
			<span template="project-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span>
		</div>
	</div>
</article>
