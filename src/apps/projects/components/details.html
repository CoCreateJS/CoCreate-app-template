
	<div class="card-body d-flex flex-column gap-4 h-100">
		<section class="bg-warning-subtle rounded p-4">
			<div class="d-flex flex-wrap align-items-center gap-3">
				<div class="avatar-lg flex-shrink-0">
					<img
						src="/assets/images/projects/project-1.jpg"
						key="thumbnail"
						alt="Project thumbnail"
						class="avatar-lg rounded-circle bg-white object-fit-cover"
						onerror="
							this.onerror = null;
							this.src = '/assets/images/projects/project-1.jpg';
						" />
				</div>

				<div class="d-flex flex-column gap-2 flex-grow-1 min-width:240px">
					<h4 class="fw-bold app-title mb-1" key="name" aria-label="Project name"></h4>
					<div class="d-flex flex-wrap align-items-center gap-3">
						<div class="text-muted">
							<i src="/assets/svg/remix/user-line.svg" class="align-bottom me-1"></i>
							<span key="owner" aria-label="Project owner"></span>
						</div>
						<div class="vr"></div>
						<div class="text-muted">
							Deadline:
							<span class="fw-medium" key="deadline" aria-label="Project deadline"></span>
						</div>
						<div class="vr"></div>
						<span
							class="badge rounded-pill border border-info text-info"
							key="status"
							aria-label="Project status"></span>
						<span
							class="badge rounded-pill border border-danger text-danger"
							key="priority"
							aria-label="Project priority"></span>
					</div>
				</div>
			</div>
		</section>

		<div class="d-flex flex-wrap align-items-start gap-3">
			<section class="d-flex flex-column gap-4 flex-grow:2 flex-basis:520px min-width:300px">
				<div>
					<h5 class="text-uppercase fw-semibold mb-3">Summary</h5>
					<div class="text-muted" key="description" aria-label="Project description"></div>
				</div>

				<div class="border-top border-top-dashed pt-3">
					<h5 class="text-uppercase fw-semibold mb-3">Project details</h5>
					<div class="d-flex flex-wrap gap-3">
						<div class="flex-grow-1 flex-basis:150px min-width:140px">
							<div class="text-muted mb-1">Deadline</div>
							<div class="fw-medium" key="deadline"></div>
						</div>
						<div class="flex-grow-1 flex-basis:150px min-width:140px">
							<div class="text-muted mb-1">Priority</div>
							<div class="fw-medium" key="priority"></div>
						</div>
						<div class="flex-grow-1 flex-basis:150px min-width:140px">
							<div class="text-muted mb-1">Status</div>
							<div class="fw-medium" key="status"></div>
						</div>
						<div class="flex-grow-1 flex-basis:150px min-width:140px">
							<div class="text-muted mb-1">Privacy</div>
							<div class="fw-medium" key="privacy"></div>
						</div>
						<div class="flex-grow-1 flex-basis:150px min-width:140px">
							<div class="text-muted mb-1">Team Lead</div>
							<div class="fw-medium" key="team_lead"></div>
						</div>
					</div>
				</div>

				<div class="border-top border-top-dashed pt-3">
					<h5 class="text-uppercase fw-semibold mb-3">Attachments</h5>
					<div
						class="d-flex flex-wrap gap-3"
						key="attachments"
						render-query="[template]">
						<a
							template
							href="{{attachments}}"
							target="_blank"
							class="d-flex align-items-center gap-2 border border-dashed rounded p-2 text-body flex-grow-1 flex-basis:240px min-width:220px">
							<i src="/assets/svg/remix/attachment-2.svg" class="fs-20 text-primary"></i>
							<span class="text-truncate">{{attachments}}</span>
							<i src="/assets/svg/remix/download-2-line.svg" class="ms-auto text-muted"></i>
						</a>
					</div>
				</div>

				<div src="components/comments.html" aria-label="Project comments"></div>
			</section>

			<aside class="d-flex flex-column gap-4 flex-grow-1 flex-basis:280px min-width:260px">
				<section>
					<h5 class="text-uppercase fw-semibold mb-3">Skills</h5>
					<div class="text-muted" key="skills"></div>
				</section>

				<section>
					<h5 class="text-uppercase fw-semibold mb-3">Tags</h5>
					<div class="d-flex flex-wrap gap-2" key="tags" render-query="[template]">
						<span template class="badge border border-primary text-primary">{{tags}}</span>
					</div>
				</section>

				<section>
					<h5 class="text-uppercase fw-semibold mb-3">Categories</h5>
					<div class="d-flex flex-wrap gap-2" key="categories" render-query="[template]">
						<span template class="badge border border-secondary text-secondary">{{categories}}</span>
					</div>
				</section>

				<section>
					<h5 class="text-uppercase fw-semibold mb-3">Team Members</h5>
					<div class="d-flex flex-column gap-2" key="team_members" render-query="[template]">
						<div template class="d-flex align-items-center gap-2">
							<div class="avatar-xs flex-shrink-0">
								<div class="avatar-title rounded-circle bg-primary-subtle text-primary">
									<i src="/assets/svg/remix/user-line.svg"></i>
								</div>
							</div>
							<span>{{team_members}}</span>
						</div>
					</div>
				</section>
			</aside>
		</div>

		<div
			class="border-top border-top-dashed pt-3"
			src="components/activities.html"
			aria-label="Project activities"></div>
	</div>
