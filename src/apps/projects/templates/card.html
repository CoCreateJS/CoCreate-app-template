<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/briefcase-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.thumbnail}}"
							alt=""
							onload="this.hidden = false"
							onerror="this.hidden = true"
							hidden />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/projects/app.html"
							aria-controls="offcanvas-app"
							aria-open
							aria-haspopup="dialog"
							aria-expanded="false"><span state-to="offcanvas-app-form" state.array="projects" state.object="{{object._id}}" hidden></span>{{object.name}}</a>
					</h5>
				</div>
				<span class="text-muted fs-12">Owner: {{object.owner}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="status" data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Stage</span>
					<strong>{{object.stage}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Team lead</span>
					<strong>{{object.team_lead}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Deadline</span>
					<strong>{{object.deadline}}</strong>
				</div>
			</div>
			<div class="d-flex justify-content-between pt-2 border-top border-top-dashed">
				<span class="badge app-badge" key="priority" data-value="{{object.priority}}">{{object.priority}}</span>
				<span class="text-muted fs-12 text-capitalize">{{object.privacy}}</span>
			</div>
			<div
				class="d-flex flex-wrap gap-1"
				array="projects"
				object="{{object._id}}"
				key="tags"
				render-query="[template='project-card-tag']">
				<span template="project-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="projects" onload-query="$parent"></div>
