
	<div class="card-body d-flex flex-column gap-4 h-100">
		<div class="flex-grow-1 mb-4 w-100 app-identity">
			<h5
				class="app-title mb-1"
				key="name"
				aria-label="Opportunity Name"></h5>
			<p
				class="text-muted"
				key="company"
				aria-label="Company Name"></p>
			<ul class="list-inline mb-0" aria-label="Contact Information">
				<li class="list-inline-item avatar-xs">
					<a
						href=""
						key="phone"
						input.href="$value"
						value-prefix="tel:"
						value=""
						class="avatar-title bg-success-subtle text-success fs-15 rounded"
						aria-label="Call Company">
						<i src="/assets/svg/remix/phone-line.svg"></i>
					</a>
				</li>
				<li class="list-inline-item avatar-xs">
					<a
						href=""
						key="email"
						input.href="$value"
						value-prefix="mailto:"
						value=""
						class="avatar-title bg-danger-subtle text-danger fs-15 rounded"
						aria-label="Email Company">
						<i src="/assets/svg/remix/mail-line.svg"></i>
					</a>
				</li>
				<li class="list-inline-item avatar-xs">
					<a
						href=""
						key="phone"
						input.href="$value"
						value-prefix="sms:"
						value=""
						class="avatar-title bg-warning-subtle text-warning fs-15 rounded"
						aria-label="Text Company">
						<i src="/assets/svg/remix/question-answer-line.svg"></i>
					</a>
				</li>
			</ul>
		</div>
		<div class="flex-grow-1">
			<h6
				class="text-muted text-uppercase fw-semibold mb-3"
				aria-label="Lead Information">
				Lead Information
			</h6>
			<p
				class="text-muted mb-4"
				key="description"
				aria-label="Opportunity Description"></p>
			<div class="table-responsive table-card">
				<table
					class="table table-borderless mb-0"
					aria-label="Opportunity Details">
					<tbody>
						<tr>
							<td class="fw-medium" scope="row">Company</td>
							<td
								key="company"
								aria-label="Company Name"></td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">Phone</td>
							<td
								key="phone"
								aria-label="Company Phone Number"></td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">
								Leads Score
							</td>
							<td
								key="lead_score"
								aria-label="Leads Score"></td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">Tags</td>
							<td aria-label="Opportunity Tags">
								<span key="tags" render-query="[template]">
									<span
										template
										class="badge border border-primary text-primary me-1"
										>{{tags}}</span
									>
								</span>
							</td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">Location</td>
							<td
								key="location"
								aria-label="Company Location"></td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">
								Create Date
							</td>
							<td
								key="created.on"
								aria-label="Creation Date"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div
			class="w-100"
			src="components/activities.html"
			aria-label="Opportunity Activities"></div>
	</div>
