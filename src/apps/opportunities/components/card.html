<article class="card app-card">
	<div class="app-card-body">
		<div class="app-heading">
			<div class="app-identity">
				<span class="app-image">
					<span class="app-icon">
						<i src="/assets/svg/remix/hand-coin-line.svg" aria-hidden="true"></i>
					</span>
					<img
						class="app-custom-image"
						key="avatar[0].src"
						alt=""
						hidden
						onload="this.hidden = false"
						onerror="this.hidden = true" />
				</span>
				<h5 class="app-title" key="name"></h5>
			</div>
			<span class="text-muted fs-12">Owner: <span key="assigned_to"></span></span>
			<div class="app-badges">
				<span
					class="badge app-badge"
					key="stage"
					data-value
					input.data-value="$value"
					input.value="$value"></span>
			</div>
		</div>
		<p class="app-description" key="description"></p>
		<div class="d-flex flex-wrap gap-3">
			<div>
				<span class="text-muted fs-12 d-block">Value</span>
				<strong>
					<span key="currency"></span>
					<span key="value"></span>
				</strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Expected</span>
				<strong>
					<span key="currency"></span>
					<span key="expected_revenue"></span>
				</strong>
			</div>
			<div>
				<span class="text-muted fs-12 d-block">Probability</span>
				<strong><span key="probability"></span>%</strong>
			</div>
		</div>
		<div
			class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed">
			<span class="text-muted fs-12">
				<i src="/assets/svg/remix/calendar-line.svg" class="me-1"></i>
				<span key="due_date"></span>
			</span>
			<div class="d-flex gap-1">
				<span
					class="badge app-badge"
					key="priority"
					data-value
					input.data-value="$value"
					input.value="$value"></span>
				<span
					class="badge app-badge"
					key="status"
					data-value
					input.data-value="$value"
					input.value="$value"></span>
			</div>
		</div>
		<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='opportunity-card-tag']">
			<span template="opportunity-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span>
		</div>
	</div>
</article>
