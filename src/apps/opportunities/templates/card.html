<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body app-card-body">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-image">
						<span class="app-icon">
							<i src="/assets/svg/remix/hand-coin-line.svg" aria-hidden="true"></i>
						</span>
						<img
							class="app-custom-image"
							src="{{object.avatar[0].src}}"
							alt=""
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<h5 class="app-title">
						<a
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/opportunities/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-open><span state-to="offcanvas-app-form" state.array="opportunities" state.object="{{object._id}}" hidden></span>{{object.name}}</a>
					</h5>
				</div>
				<span class="text-muted fs-12">Owner: {{object.assigned_to}}</span>
				<div class="app-badges">
					<span class="badge app-badge" key="stage" data-value="{{object.stage}}">{{object.stage}}</span>
				</div>
			</div>
			<p class="app-description">{{object.description}}</p>
			<div class="d-flex flex-wrap gap-3">
				<div>
					<span class="text-muted fs-12 d-block">Value</span>
					<strong>{{object.currency}} {{object.value}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Expected</span>
					<strong>{{object.currency}} {{object.expected_revenue}}</strong>
				</div>
				<div>
					<span class="text-muted fs-12 d-block">Probability</span>
					<strong>{{object.probability}}%</strong>
				</div>
			</div>
			<div
				class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed">
				<span class="text-muted fs-12"><i src="/assets/svg/remix/calendar-line.svg" class="me-1"></i>{{object.due_date}}</span>
				<div class="d-flex gap-1">
					<span class="badge app-badge" key="priority" data-value="{{object.priority}}">{{object.priority}}</span>
					<span class="badge app-badge" key="status" data-value="{{object.status}}">{{object.status}}</span>
				</div>
			</div>
			<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='opportunity-card-tag']">
				<span template="opportunity-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span>
			</div>
		</div>
	</article>
</template>
<div onload.array="opportunities" onload-query="$parent"></div>
