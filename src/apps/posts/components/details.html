
	<div class="card-body d-flex flex-column gap-4 h-100">
		<div class="flex-shrink-0 app-identity" style="margin-bottom: 2rem">
			<div class="position-relative d-inline-block">
				<img src="/assets/images/users/avatar-10.jpg" key="avatar[0].src" alt="User Avatar" class="avatar-xl rounded-circle img-thumbnail material-shadow" />
				<span class="contact-active position-absolute rounded-circle bg-success"><span class="visually-hidden">Online</span></span>
			</div>
			<h5 class="app-title mb-1" key="name"></h5>
			<p class="text-muted" key="company"></p>
			<ul class="list-inline mb-0">
				<li class="list-inline-item avatar-xs">
					<a href="" key="phone" input.href="$value" value-prefix="tel:" value="" class="avatar-title bg-success-subtle text-success fs-15 rounded" aria-label="Call Phone">
						<i src="/assets/svg/remix/phone-line.svg"></i>
					</a>
				</li>
				<li class="list-inline-item avatar-xs">
					<a href="" key="email" input.href="$value" value-prefix="mailto:" value="" class="avatar-title bg-danger-subtle text-danger fs-15 rounded" aria-label="Email">
						<i src="/assets/svg/remix/mail-line.svg"></i>
					</a>
				</li>
				<li class="list-inline-item avatar-xs">
					<a href="" key="phone" input.href="$value" value-prefix="sms:" value="" class="avatar-title bg-warning-subtle text-warning fs-15 rounded" aria-label="Send SMS">
						<i src="/assets/svg/remix/question-answer-line.svg"></i>
					</a>
				</li>
			</ul>
		</div>
		<div class="flex-grow-1">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">
				Personal Information
			</h6>
			<p class="text-muted mb-4" key="description"></p>
			<div class="table-responsive table-card">
				<table class="table table-borderless mb-0">
					<tbody>
						<tr>
							<td class="fw-medium" scope="row">Designation</td>
							<td key="designation"></td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">Email ID</td>
							<td key="email"></td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">Phone No</td>
							<td key="phone"></td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">Lead Score</td>
							<td key="lead_score"></td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">Tags</td>
							<td>
								<span key="tags" render-query="[template]">
									<span template class="badge border border-primary text-primary me-1">{{tags}}</span>
								</span>
							</td>
						</tr>
						<tr>
							<td class="fw-medium" scope="row">Last Contacted</td>
							<td key="last_contacted">
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div class="w-100" src="components/activities.html"></div>
	</div>
