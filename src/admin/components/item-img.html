<div
	class="avatar-xl rounded-circle img-thumbnail p-0 position-relative d-inline-block">
	<img
		src="/assets/svg/boxes.svg"
		key="images[0].src"
		save="false"
		alt="image"
		width="100%"
		height="100%"
		class="avatar-xl rounded img-thumbnail object-fit-cover"
		onerror="this.onerror=null; this.src='/assets/svg/boxes.svg';" />
	<div
		id="item-img-file-input"
		class="avatar-xs rounded-circle position-absolute right:-15px left:auto bottom:-15px overflow-hidden cursor-pointer"
		type="file"
		array=""
		object=""
		key="images"
		realtime="true"
		read="false"
		accept="image/*"
		title="Upload new item image"
		aria-label="Upload new item image">
		<i src="/assets/svg/remix/image-fill.svg" class="avatar-title"></i>
	</div>
</div>
