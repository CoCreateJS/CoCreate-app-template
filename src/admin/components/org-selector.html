<div
	class="d-flex align-items:center width:100% height:70px"
	organization="false">
	<div
		class="org-create position:absolute d-flex align-items:center width:100% cursor:pointer font-weight:bold white-space:nowrap overflow-hidden"
		state-to="main"
		state.src="./organizations/create.html"
		click-query="$closest sidenav"
		click.style="width:0px"
		click.if="<575px"
		click.if-value="$innerWidth">
		<span class="icon">
			<button
				class="round width:30px height:30px"
				title="Create New Organization">
				<i src="/assets/svg/plus.svg"></i>
			</button>
		</span>
		<span class="name">Create Organization</span>
	</div>

	<form
		class="org-toggle position:relative d-flex align-items:center gap:5px width:100% background:whitesmoke background:#222@dark cursor:pointer"
		array="organizations"
		object=""
		state-id="accountOrg"
		toggle="dropdown"
		toggle-query="$closest .header .org-dropdown"
		toggle.is-hidden="true, false">
		<img
			class="height:50px position:relative"
			src="/assets/svg/building.svg"
			key="logo[0].src"
			alt="Logo"
			onerror="this.src = '../../assets/svg/building.svg'" />

		<span
			class="org-name font-size:22px font-weight:bold"
			key="name"
			input-query="$closest div[organization]"
			input.organization="true">
			<div
				observe.target=".org:not([template])"
				observe.query="$document .org:not([template])"
				observe.attribute="$click"
				observe-setTimeout="2000"
				hidden></div>
		</span>

		<i
			class="height:15px display:inline-block"
			src="/assets/svg/chevron-down.svg"></i>
	</form>
	<div
		class="org-dropdown position:absolute top:70px height:calc(100vh_-_110px) width:100% background:whitesmoke background:#222@dark"
		array="organizations"
		object
		filter-sort-key="name"
		filter-sort-direction="asc"
		filter-limit
		render-query="[template]"
		click.is-hidden="true"
		is-hidden="true">
		<div
			class="orgs max-height:calc(100vh_-_160px) overflow-x:hidden overflow-y:auto">
			<div
				template
				class="org d-flex align-items:center gap:11px height:50px cursor:pointer font-weight:bold padding:10px"
				state-to="accountOrg"
				state.object="{{object._id}}"
				state.organization_id="{{object._id}}"
				state.host
				click-query="$closest sidenav"
				click.style="width:0px"
				click-if="<575px"
				click-if-value="$innerWidth">
				<img
					class="org-logo height:30px"
					src="/assets/svg/building.svg"
					array="organizations"
					object="{{object._id}}"
					key="logo[0].src"
					alt="Logo" />

				<span class="name">{{object.name}}</span>
				<div
					filter-query-key="host.name.$regex"
					filter-query-value="^$subdomain\."
					filter-query-key="host.$"
					filter-query-value="1"
					filter-query="$next"></div>

				<input
					array="organizations"
					object="{{object._id}}"
					key="host[0].name"
					input.state.host="$value"
					input-query="$parent"
					input-query="$next"
					value-replace="/\[\]/g"
					hidden />
				<div
					state-to="adminOrg"
					state.host
					state.organization_id="{{object._id}}"></div>
			</div>
		</div>
		<div
			class="d-flex align-items:center width:100% height:50px cursor:pointer font-weight:bold white-space:nowrap overflow-hidden"
			state-to="main"
			state.src="./organizations/create.html"
			click-query="$closest sidenav"
			click.style="width:0px"
			click.if="<575px"
			click-if-value="$innerWidth">
			<span class="icon">
				<button
					class="round width:30px height:30px"
					title="Add New Item">
					<i src="/assets/svg/plus.svg"></i>
				</button>
			</span>
			<span class="name">Create Organization</span>
		</div>
	</div>
</div>
