<div class="dropdown">
	<style>
		.select-company-placeholder[object]:empty {
			display: block;
		}
		.selected-company[object]:empty {
			display: block;
		}
		.select-company-placeholder[object]:not(:empty) {
			display: none;
		}
	</style>
	<input key="company" input.object="$value" input-query="$next [object][]" />
	<button
		type="button"
		class="btn material-shadow-none"
		id="header-user-button"
		aria-haspopup="true"
		aria-expanded="false"
		aria-controls="company-selector-dropdown">
		<span class="select-company-placeholder" object>Select Company</span>
		<div class="selected-company d-flex align-items-center p-2" object>
			<div
				class="avatar-xs rounded-circle position-relative overflow-hidden">
				<div
					class="avatar-title bg-secondary-subtle text-secondary material-shadow">
					<span
						class="avatar-initial height:20px"
						array="companies"
						object=""
						key="name[0]">
					</span>
					<img
						class="position-absolute object-fit-cover"
						src="/assets/images/transparent.png"
						alt="Avatar"
						width="100%"
						height="100%"
						array="companies"
						object=""
						key="icon[0].src"
						form-attributes="false"
						onerror="this.onerror=null; this.src='/assets/images/transparent.png';" />
				</div>
			</div>
			<span class="flex-grow-1 text-start ms-2">
				<h6 class="m-0"
					array="companies"
					object=""
					key="name">
				</h6>
				<span class="fs-11 mb-0 text-muted"
					array="companies"
					object=""
					key="email">
				</span>
			</span>
		</div>

	</button>
	<div
		class="dropdown-menu dropdown-menu-start w-100 mt-2"
		id="company-selector-dropdown"
		aria-labelledby="header-user-button"
		aria-close-on="anywhere">
		<div
			array="companies"
			object
			form-attributes="false"
			filter-limit="10"
			render-query="[template]"
			class="max-height:300px overflow:auto">
			<div template class="d-flex align-items-center p-2" >
				<div
					class="avatar-xs rounded-circle position-relative overflow-hidden">
					<div
						class="avatar-title bg-secondary-subtle text-secondary material-shadow">
						<span
							class="avatar-initial height:20px">
							{{object.name[0]}}
						</span>
						<img
							class="position-absolute object-fit-cover"
							src="/assets/images/transparent.png"
							alt="Avatar"
							width="100%"
							height="100%"
							array="companies"
							object="{{object._id}}"
							key="icon[0].src"
							form-attributes="false"
							onerror="this.onerror=null; this.src='/assets/images/transparent.png';" />
					</div>
				</div>
				<span class="flex-grow-1 text-start ms-2">
					<h6 class="m-0">{{object.name}}</h6>
					<span class="fs-11 mb-0 text-muted">{{object.email}}</span>
				</span>
			</div>
		</div>
	</div>
</div>
