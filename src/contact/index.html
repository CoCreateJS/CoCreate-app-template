<!doctype html>
<html
	state-id="theme"
	lang="en"
	data-layout="vertical"
	data-topbar-color="default"
	data-theme="default"
	data-theme-colors="default"
	color-scheme=""
	session>
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#405189" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#292e32" media="(prefers-color-scheme: dark)" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Contact CoCreateJS — Runtime and Community Questions</title>
		<meta
			name="description"
			content="Contact the CoCreateJS community about runtime integration, architecture, storage adapters, self-hosting, documentation, or open-source contributions." />
		<meta
			name="keywords"
			content="contact CoCreateJS, CoCreateJS community, runtime integration, self-hosting, open-source contribution" />
		<meta
			name="author"
			content="CoCreate" />
		<meta
			name="robots"
			content="index, follow" />
		<link
			rel="canonical"
			href="https://cocreatejs.com/contact/" />
		<link
			rel="icon"
			type="image/png"
			href="/assets/images/icons/icon.png" />
		<link
			rel="apple-touch-icon"
			href="/assets/images/icons/180x180.png" />
		<meta
			property="og:type"
			content="website" />
		<meta
			property="og:title"
			content="Contact CoCreateJS" />
		<meta
			property="og:description"
			content="Ask about the runtime, client, architecture, storage, deployment, or contributing." />
		<meta
			property="og:url"
			content="https://cocreatejs.com/contact/" />
		<meta
			property="og:image"
			content="https://cocreatejs.com/assets/images/icons/1640x1640.png" />
		<meta
			name="twitter:card"
			content="summary_large_image" />

		<link plugins />
		<link
			href="/assets/css/index.css"
			rel="stylesheet"
			type="text/css" />

		<link
			rel="manifest"
			href="/manifest.webmanifest" />
	</head>
	<body data-bs-spy="scroll">
		<div class="layout-wrapper landing">
			<nav
				src="/components/nav.html"
				value-type="outerHTML"></nav>
			<section class="section hero-section bg-light">
				<div class="container position-relative pt-5">
					<div class="text-center mx-auto cocreate-section-intro">
						<p class="text-primary text-uppercase fw-semibold mb-2">
							Contact
						</p>
						<h1 class="display-4 fw-semibold mb-3">
							Tell us what you are building.
						</h1>
						<p class="lead text-muted mb-0">
							Questions about the runtime, architecture, client
							integration, storage, deployment, or contributing
							are welcome.
						</p>
					</div>
				</div>
			</section>
			<section
				class="section"
				id="contact"
				src="/components/contact.html"></section>
			<footer
				src="/components/footer.html"
				value-type="outerHTML"></footer>
			<div src="/components/scroll-to-top.html"></div>
		</div>
		<script src="../dist/CoCreate.js"></script>
	</body>
</html>
