<div class="card-body p-4">
	<div class="text-center mt-2">
		<h5 class="text-primary">Welcome Back!</h5>
		<p class="text-muted">Sign in to continue to CoCreate.</p>
	</div>
	<div class="p-2 mt-4">
		<!-- Single CoCreate sign-in form -->
		<form
			array="contacts"
			class="coform"
			autocomplete="on"
			role="form"
			aria-label="Sign in form"
			onkeydown="
				if (event.key === 'Enter')
					document.getElementById('signin-btn').click();
			">
			<div class="mb-3">
				<label
					for="email"
					class="form-label"
					>Email</label
				>
				<input
					type="email"
					class="form-control"
					id="email"
					name="email"
					key="email"
					placeholder="Enter email"
					required
					autocomplete="email"
					aria-required="true"
					aria-label="Email address" />
			</div>

			<div class="mb-3">
				<div class="float-end">
					<a
						state-to="authView"
						state.src="./pass-reset.html"
						class="text-muted"
						>Forgot password?</a
					>
				</div>
				<label
					class="form-label"
					for="password-input"
					>Password</label
				>
				<div class="position-relative auth-pass-inputgroup mb-3">
					<input
						type="password"
						class="form-control pe-5 password-input"
						placeholder="Enter password"
						id="password-input"
						name="password"
						key="password"
						required
						autocomplete="current-password"
						aria-required="true"
						aria-label="Password" />
					<button
						class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted password-addon material-shadow-none"
						type="button"
						id="password-addon"
						click-query="$previous"
						click.type="text, password"
						aria-label="Toggle password visibility">
						<i
							src="/assets/svg/remix/eye-fill.svg"
							click.src="/assets/svg/remix/eye-off-fill.svg, /assets/svg/remix/eye-fill.svg"
							class="align-middle"></i>
					</button>
					<div class="invalid-feedback">Please enter password</div>
				</div>
			</div>

			<div class="form-check">
				<input
					class="form-check-input"
					type="checkbox"
					value=""
					id="auth-remember-check" />
				<label
					class="form-check-label"
					for="auth-remember-check"
					>Remember me</label
				>
			</div>

			<div class="mt-4">
				<button
					id="signin-btn"
					href="/admin/"
					class="btn btn-success btn-spinner w-100"
					actions="validate, click, disabled, signIn, disabled, click"
					click.value="Sigining In..., Sign In"
					click-query=".button-text"
					type="button"
					aria-label="Sign in">
					<span
						class="spinner-border spinner-border-sm" hidden
						role="status"
						aria-hidden="true">
					</span>
					<span class="button-text">Sign In</span>
				</button>

				<p class="mb-0 mt-1">
					Don't have an account?
					<a
						state-to="authView"
						state.src="./signup.html"
						class="fw-semibold text-primary text-decoration-underline">
						Signup
					</a>
				</p>
			</div>
		</form>
	</div>
	<div class="mt-4 text-center">
		<div class="signin-other-title">
			<h5 class="fs-13 mb-4 title">Sign In with</h5>
		</div>
		<div>
			<button
				type="button"
				class="btn btn-primary btn-icon waves-effect waves-light">
				<i
					src="/assets/svg/remix/facebook-fill.svg"
					class="fs-16"></i>
			</button>
			<button
				type="button"
				class="btn btn-danger btn-icon waves-effect waves-light">
				<i
					src="/assets/svg/remix/google-fill.svg"
					class="fs-16"></i>
			</button>
			<button
				type="button"
				class="btn btn-dark btn-icon waves-effect waves-light">
				<i
					src="/assets/svg/remix/github-fill.svg"
					class="fs-16"></i>
			</button>
			<button
				type="button"
				class="btn btn-info btn-icon waves-effect waves-light">
				<i
					src="/assets/svg/remix/twitter-fill.svg"
					class="fs-16"></i>
			</button>
		</div>
	</div>
</div>
<!-- end card body -->
