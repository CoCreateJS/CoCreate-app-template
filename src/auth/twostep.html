<div class="card-body p-4">
	<div class="mb-4">
		<div class="avatar-lg mx-auto">
			<div class="avatar-title text-primary display-5 rounded-circle">
				<i src="/assets/svg/remix/mail-line.svg"></i>
			</div>
		</div>
	</div>

	<div class="p-2 mt-4">
		<div class="text-muted text-center mb-4 mx-lg-3">
			<h4>Verify Your Email</h4>
			<p>
				Please enter the 4 digit code sent to
				<span class="fw-semibold">example@abc.com</span>
			</p>
		</div>

		<form autocomplete="off">
			<div class="d-flex flex-wrap">
				<div class="flex-grow-1 flex-basis:25.000% min-width:220px">
					<div class="mb-3">
						<label for="digit1-input" class="visually-hidden"
							>Digit 1</label
						>
						<input
							type="text"
							class="form-control form-control-lg border-light text-center"
							onkeyup="moveToNext(1, event)"
							maxlength="1"
							id="digit1-input" />
					</div>
				</div>
				<!-- end col -->

				<div class="flex-grow-1 flex-basis:25.000% min-width:220px">
					<div class="mb-3">
						<label for="digit2-input" class="visually-hidden"
							>Digit 2</label
						>
						<input
							type="text"
							class="form-control form-control-lg border-light text-center"
							onkeyup="moveToNext(2, event)"
							maxlength="1"
							id="digit2-input" />
					</div>
				</div>
				<!-- end col -->

				<div class="flex-grow-1 flex-basis:25.000% min-width:220px">
					<div class="mb-3">
						<label for="digit3-input" class="visually-hidden"
							>Digit 3</label
						>
						<input
							type="text"
							class="form-control form-control-lg border-light text-center"
							onkeyup="moveToNext(3, event)"
							maxlength="1"
							id="digit3-input" />
					</div>
				</div>
				<!-- end col -->

				<div class="flex-grow-1 flex-basis:25.000% min-width:220px">
					<div class="mb-3">
						<label for="digit4-input" class="visually-hidden"
							>Digit 4</label
						>
						<input
							type="text"
							class="form-control form-control-lg border-light text-center"
							onkeyup="moveToNext(4, event)"
							maxlength="1"
							id="digit4-input" />
					</div>
				</div>
				<!-- end col -->
			</div>
		</form>
		<!-- end form -->

		<div class="mt-3">
			<button type="button" class="btn btn-success w-100">Confirm</button>
			<p class="mb-0 mt-1">
				Didn't receive a code ?
				<a
					state-to="authView"
					state.src="./pass-reset.html"
					class="fw-semibold text-primary text-decoration-underline"
					>Resend</a
				>
			</p>
		</div>
	</div>
</div>
<!-- end card body -->

<!-- two-step-verification js -->
<script src="/assets/js/pages/two-step-verification.init.js"></script>
