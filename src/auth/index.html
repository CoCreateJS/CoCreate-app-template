<!doctype html>
<html
	state-id="theme"
	lang="en"
	data-layout="vertical"
	data-topbar-color="defualt"
	data-sidebar-color="dark"
	data-sidebar-size="sm-hover"
	data-sidebar-image="none"
	data-preloader="disable"
	data-theme="default"
	data-theme-colors="default"
	color-scheme=""
	session
	parse="true">
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#405189" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#292e32" media="(prefers-color-scheme: dark)" />
		<title>Sign In · CoCreate</title>
		<meta
			name="description"
			content="Secure sign in / sign up for CoCreate — access your dashboard and projects." />
		<meta
			name="robots"
			content="noindex, nofollow" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<meta
			content="CoCreate"
			name="author" />

		<!-- Favicon -->
		<link
			rel="shortcut icon"
			href="/assets/images/icons/favicon.ico" />
		<link plugins />
		<link
			href="/assets/css/index.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Custom -->
		

		<!-- Custom -->
		<link
			rel="stylesheet"
			type="text/css"
			parse="true"
			save="false" />

		<!-- Manifest -->
		<link
			rel="manifest"
			href="/manifest.webmanifest" />
		<style>
			.auth-page-content .main-view {
				z-index: 1;
				padding-top: clamp(0.75rem, 2vh, 1.5rem);
			}
			.auth-page-content .card {
				max-width: 500px;
			}
		</style>
	</head>

	<body id="layout-wrapper">
		<!-- auth page bg -->
		<div
			class="auth-one-bg-position"
			id="auth-particles"
			plugin='{
			"$particlesJS": [
			"auth-particles",
			{
				"particles": {
				"number": { "value": 90, "density": { "enable": true, "value_area": 800 } },
				"color": { "value": "#ffffff" },
				"shape": {
					"type": "circle",
					"stroke": { "width": 0, "color": "#000000" },
					"polygon": { "nb_sides": 5 },
					"image": { "src": "img/github.svg", "width": 100, "height": 100 }
				},
				"opacity": {
					"value": 0.8,
					"random": true,
					"anim": { "enable": true, "speed": 1, "opacity_min": 0, "sync": false }
				},
				"size": {
					"value": 4,
					"random": true,
					"anim": { "enable": false, "speed": 4, "size_min": 0.2, "sync": false }
				},
				"line_linked": {
					"enable": false,
					"distance": 150,
					"color": "#ffffff",
					"opacity": 0.4,
					"width": 1
				},
				"move": {
					"enable": true,
					"speed": 2,
					"direction": "none",
					"random": false,
					"straight": false,
					"out_mode": "out",
					"attract": { "enable": false, "rotateX": 600, "rotateY": 1200 }
				}
				},
				"interactivity": {
				"detect_on": "canvas",
				"events": {
					"onhover": { "enable": true, "mode": "bubble" },
					"onclick": { "enable": true, "mode": "repulse" },
					"resize": true
				},
				"modes": {
					"grab": { "distance": 400, "line_linked": { "opacity": 1 } },
					"bubble": { "distance": 400, "size": 4, "duration": 2, "opacity": 0.8, "speed": 3 },
					"repulse": { "distance": 200 },
					"push": { "particles_nb": 4 },
					"remove": { "particles_nb": 2 }
				}
				},
				"retina_detect": true,
				"config_demo": {
				"hide_card": false,
				"background_color": "#b61924",
				"background_image": "",
				"background_position": "50% 50%",
				"background_repeat": "no-repeat",
				"background_size": "cover"
				}
			}
		]}'>
			<div class="bg-overlay"></div>

			<div class="shape">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					version="1.1"
					xmlns:xlink="http://www.w3.org/1999/xlink"
					viewBox="0 0 1440 120">
					<path
						d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
				</svg>
			</div>
		</div>

		<!-- auth page content -->
		<div class="auth-page-content container">
			<div class="text-center p-4 text-white-50 position-relative">
				<a
					href="../"
					class="d-inline-block auth-logo">
					<img
						src="/assets/images/logos/logo.png"
						alt="Logo"
						height="40" />
				</a>
				<p
					class="mt-3 fs-15 fw-medium d-none"
					key="auth.signin.subtitle"></p>
			</div>
			<main
				class="main-view d-flex flex-column align-items-center position-relative z-index:1">
				<div
					class="card flex-grow-1 w-100 max-width:500px mx-auto"
					state-id="authView">
					<div
						onload-query="$parent"
						onload.src="./signin.html"
						onload-delay="3000"></div>
				</div>
			</main>
		</div>

		<!-- end auth page content -->
		<p
			class="position-fixed w-100 mb-3 mt-3 text-muted mx-auto text-center bottom-0 z-index:1">
			<input
				type="date"
				value-type="getYear"
				onload.value="$value"
				onload-query="$next"
				now
				hidden />
			© <span>2026</span>
			CoCreate
		</p>

		<!-- Preloader Start -->
		<!-- <div id="preloader">
			<div id="status">
				<div
					class="spinner-border text-primary avatar-sm"
					role="status">
					<span class="visually-hidden">Loading...</span>
				</div>
			</div>
		</div> -->
		<!-- Preloader End -->

		<!-- Notification Start -->
		<div
			class="position:fixed!important bottom:15px right:15px"
			aria-live="polite"
			role="status"
			aria-atomic="true">
			<div
				template="notification"
				class="card position:relative margin-top:10px padding:20px {{status}}">
				<span class="{{type}} font-weight:400">{{message}}</span>
				<a
					click-query="$parent"
					click.$remove=""
					class="position:absolute top:4px right:4px"
					aria-label="Dismiss notification">
					<i
						src="/assets/svg/times.svg"
						aria-hidden="true"></i>
				</a>
			</div>
		</div>
		<!-- Notification End -->

		<!-- CoCreateJS -->
		<script
			src="../dist/CoCreate.js"
			organization></script>
	</body>
</html>
