<!doctype html>
<html
	state-id="theme"
	lang="en"
	data-layout="vertical"
	data-topbar-color="defualt"
	data-sidebar-color="dark"
	data-sidebar-size="sm-hover"
	data-sidebar-image="none"
	data-preloader="disable"
	data-theme="default"
	data-theme-colors="default"
	color-scheme=""
	session>
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#405189" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#292e32" media="(prefers-color-scheme: dark)" />
		<title>403 Forbidden - CoCreate</title>
		<meta
			name="keywords"
			content="CoCreateJS, cells, peptides, exosomes, regenerative medicine, health, medicines, growth factors, health supplies, biotech, wellness, ecommerce, store" />
		<meta
			name="description"
			content="CoCreate is an ecommerce store for regenerative health and medicine, offering peptides, exosomes, cell growth factors, and innovative health supplies." />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<meta
			content="CoCreate"
			name="author" />

		<!-- Favicon -->
		<link
			rel="shortcut icon"
			href="/assets/images/icons/favicon.ico" />
		<!-- Menu Icon -->

		<!-- Plugins -->
		<link plugins />
		<link
			href="/assets/css/index.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Custom -->

		<!-- Custom -->

		<!-- Manifest -->
		<link
			rel="manifest"
			href="/manifest.webmanifest" />
	</head>

	<body data-bs-spy="scroll">
		<!-- Begin page -->
		<div class="layout-wrapper landing">
			<div class="auth-page-wrapper pt-5">
				<!-- auth page bg -->
				<div
					class="auth-one-bg-position auth-one-bg"
					id="auth-particles"
					plugin='{
	                    "$particlesJS": [
	                        "auth-particles",
	                        {
	                            "particles": {
	                                "number": { "value": 90, "density": { "enable": true, "value_area": 800 } },
	                                "color": { "value": "#ffffff" },
	                                "shape": {
	                                    "type": "circle",
	                                    "stroke": { "width": 0, "color": "#000000" },
	                                    "polygon": { "nb_sides": 5 },
	                                    "image": { "src": "img/github.svg", "width": 100, "height": 100 }
	                                },
	                                "opacity": {
	                                    "value": 0.8,
	                                    "random": true,
	                                    "anim": { "enable": true, "speed": 1, "opacity_min": 0, "sync": false }
	                                },
	                                "size": {
	                                    "value": 4,
	                                    "random": true,
	                                    "anim": { "enable": false, "speed": 4, "size_min": 0.2, "sync": false }
	                                },
	                                "line_linked": {
	                                    "enable": false,
	                                    "distance": 150,
	                                    "color": "#ffffff",
	                                    "opacity": 0.4,
	                                    "width": 1
	                                },
	                                "move": {
	                                    "enable": true,
	                                    "speed": 2,
	                                    "direction": "none",
	                                    "random": false,
	                                    "straight": false,
	                                    "out_mode": "out",
	                                    "attract": { "enable": false, "rotateX": 600, "rotateY": 1200 }
	                                }
	                            },
	                            "interactivity": {
	                                "detect_on": "canvas",
	                                "events": {
	                                    "onhover": { "enable": true, "mode": "bubble" },
	                                    "onclick": { "enable": true, "mode": "repulse" },
	                                    "resize": true
	                                },
	                                "modes": {
	                                    "grab": { "distance": 400, "line_linked": { "opacity": 1 } },
	                                    "bubble": { "distance": 400, "size": 4, "duration": 2, "opacity": 0.8, "speed": 3 },
	                                    "repulse": { "distance": 200 },
	                                    "push": { "particles_nb": 4 },
	                                    "remove": { "particles_nb": 2 }
	                                }
	                            },
	                            "retina_detect": true,
	                            "config_demo": {
	                                "hide_card": false,
	                                "background_color": "#b61924",
	                                "background_image": "",
	                                "background_position": "50% 50%",
	                                "background_repeat": "no-repeat",
	                                "background_size": "cover"
	                            }
	                        }
	                    ]
	                }'>
					<div class="bg-overlay"></div>

					<div class="shape">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							version="1.1"
							xmlns:xlink="http://www.w3.org/1999/xlink"
							viewBox="0 0 1440 120">
							<path
								d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
						</svg>
					</div>
				</div>

				<!-- auth page content -->
				<div class="auth-page-content text-center pt-4">
					<img
						src="/assets/images/error.svg"
						alt=""
						class="error-basic-img move-animation" />
					<h1 class="display-1 fw-medium">403</h1>
					<h3 class="text-uppercase">Access Denied 🔐</h3>
					<p class="text-muted mb-4">
						Sorry, you do not have permission to view this page or
						resource!
					</p>
					<a
						href="/auth/"
						class="btn btn-success"
						><i class="mdi mdi-home me-1"></i>Back to home</a
					>
				</div>
				<!-- end auth page content -->
			</div>
			<!-- end auth-page-wrapper -->
		</div>
		<!-- end layout wrapper -->

		<!-- JAVASCRIPT -->
		<script src="/dist/CoCreate.js"></script>
	</body>
</html>
