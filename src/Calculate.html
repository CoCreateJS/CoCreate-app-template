<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#405189" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#292e32" media="(prefers-color-scheme: dark)" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<title>CoCreate Events + AST Calculation Demo</title>
		<link
			href="/assets/css/index.css"
			rel="stylesheet"
			type="text/css" />
	</head>
	<body class="bg-light">
		<main
			class="container py-4"
			style="max-width: 1080px">
			<header class="mb-4">
				<h1 class="h3 mb-2">Estimate calculation demo</h1>
				<p class="text-muted mb-0">
					Each item row calculates a line total. Bubbling input events
					update the subtotal, discount, shipping, tax, and grand
					total.
				</p>
			</header>

			<form
				id="estimate-calculation-demo"
				class="card"
				autocomplete="off">
				<div class="card-body">
					<section
						id="estimate-items"
						class="d-flex flex-column gap-3"
						input-query="$closest form .subtotal"
						input.value="$($add($queryAll(.line-total)))">
						<div
							class="d-flex align-items-center justify-content-between gap-3">
							<h2 class="h5 mb-0">Items</h2>
							<button
								type="button"
								class="btn btn-sm btn-primary"
								click-query="$document #estimate-items"
								click-element="$document #estimate-item-template"
								click.insertAdjacentHTML="beforeend"
								aria-label="Add estimate item">
								Add item
							</button>
						</div>

						<div class="d-flex flex-column gap-3">
							<div
								class="calculate-item card card-body"
								input-query=".line-total"
								input.value="$(Number($query(.line-rate).value) * Number($query(.line-quantity).value))">
								<div
									class="d-flex flex-wrap align-items-end gap-3">
									<div
										class="d-flex align-items-end gap-3 w-300 flex-grow-1">
										<label
											class="form-label mb-0 flex-grow-1">
											Item
											<input
												class="form-control line-description mt-1"
												value="Coffee table"
												aria-label="Item" />
										</label>
										<button
											type="button"
											class="btn btn-sm btn-light text-danger"
											click-query="$closest .calculate-item"
											click.remove=""
											aria-label="Remove estimate item">
											Remove
										</button>
									</div>
									<div
										class="d-flex flex-nowrap gap-3 flex-grow-1 flex-basis:420px min-width:300px">
										<label
											class="form-label mb-0 flex-grow-1 flex-basis:0 min-width:80px">
											Rate
											<input
												class="form-control line-rate mt-1"
												type="number"
												value="18.50"
												min="0"
												step="0.01"
												aria-label="Rate" />
										</label>
										<label
											class="form-label mb-0 flex-grow-1 flex-basis:0 min-width:80px">
											Quantity
											<input
												class="form-control line-quantity mt-1"
												type="number"
												value="2"
												min="0"
												step="1"
												aria-label="Quantity" />
										</label>
										<label
											class="form-label mb-0 flex-grow-1 flex-basis:0 min-width:80px">
											Line total
											<input
												class="form-control line-total mt-1"
												type="number"
												value="37"
												step="0.01"
												readonly
												aria-label="Line total"
												value-bubbles="true" />
										</label>
									</div>
								</div>
							</div>
						</div>
					</section>

					<section
						class="d-flex justify-content-end mt-4"
						aria-labelledby="totals-heading">
						<div
							class="card w-100"
							style="max-width: 420px"
							input-query=".grand-total"
							input='{"value":{"$round":[{"$add":[{"$add":["$query(.discounted-subtotal).value","$query(.shipping).value"]},"$query(.tax-amount).value"]},2]}}'>
							<div class="card-header py-2">
								<h2
									id="totals-heading"
									class="h6 mb-0">
									Estimate totals
								</h2>
							</div>
							<div
								class="card-body d-flex flex-column gap-3"
								input-query=".tax-amount"
								input='{"value":{"$round":[{"$multiply":[{"$add":["$query(.discounted-subtotal).value","$query(.shipping).value"]},"$query(.tax-rate).value",0.01]},2]}}'>
								<div
									class="d-flex flex-column gap-2"
									input-query=".discounted-subtotal"
									input='{"value":{"$add":["$query(.subtotal).value",{"$multiply":["$query(.discount).value",-1]}]}}'>
									<label
										class="d-flex align-items-center justify-content-between gap-3 mb-0">
										<span>Subtotal</span>
										<input
											class="form-control form-control-sm subtotal text-end"
											style="max-width: 140px"
											type="number"
											value="37"
											step="0.01"
											readonly
											aria-label="Subtotal"
											value-bubbles="true" />
									</label>
									<label
										class="d-flex align-items-center justify-content-between gap-3 mb-0">
										<span>Discount</span>
										<input
											class="form-control form-control-sm discount text-end"
											style="max-width: 140px"
											type="number"
											value="15"
											min="0"
											step="0.01"
											aria-label="Discount amount" />
									</label>
									<label
										class="d-flex align-items-center justify-content-between gap-3 mb-0 fw-semibold">
										<span>Subtotal after discount</span>
										<input
											class="form-control form-control-sm discounted-subtotal text-end"
											style="max-width: 140px"
											type="number"
											value="22"
											step="0.01"
											readonly
											aria-label="Subtotal after discount"
											value-bubbles="true" />
									</label>
								</div>

								<div
									class="d-flex flex-column gap-2 border-top pt-3">
									<label
										class="d-flex align-items-center justify-content-between gap-3 mb-0">
										<span>Shipping</span>
										<input
											class="form-control form-control-sm shipping text-end"
											style="max-width: 140px"
											type="number"
											value="8.50"
											min="0"
											step="0.01"
											aria-label="Shipping amount" />
									</label>
									<label
										class="d-flex align-items-center justify-content-between gap-3 mb-0">
										<span>Tax rate (%)</span>
										<input
											class="form-control form-control-sm tax-rate text-end"
											style="max-width: 140px"
											type="number"
											value="8.25"
											min="0"
											step="0.01"
											aria-label="Tax rate in percent" />
									</label>
									<label
										class="d-flex align-items-center justify-content-between gap-3 mb-0">
										<span>Tax</span>
										<input
											class="form-control form-control-sm tax-amount text-end"
											style="max-width: 140px"
											type="number"
											value="2.52"
											step="0.01"
											readonly
											aria-label="Tax amount"
											value-bubbles="true" />
									</label>
								</div>

								<label
									class="d-flex align-items-center justify-content-between gap-3 border-top pt-3 mb-0 fw-bold">
									<span>Grand total</span>
									<input
										class="form-control grand-total text-end fw-bold"
										style="max-width: 140px"
										type="number"
										value="33.02"
										step="0.01"
										readonly
										aria-label="Grand total"
										value-bubbles="false" />
								</label>
							</div>
						</div>
					</section>
				</div>
			</form>

			<template id="estimate-item-template">
				<div
					class="calculate-item card card-body"
					input-query=".line-total"
					input.value="$(Number($query(.line-rate).value) * Number($query(.line-quantity).value))">
					<div class="d-flex flex-wrap align-items-end gap-3">
						<div
							class="d-flex align-items-end gap-3 w-300 flex-grow-1">
							<label class="form-label mb-0 flex-grow-1">
								Item
								<input
									class="form-control line-description mt-1"
									aria-label="Item" />
							</label>
							<button
								type="button"
								class="btn btn-sm btn-light text-danger"
								click-query="$closest .calculate-item"
								click.remove=""
								aria-label="Remove estimate item">
								Remove
							</button>
						</div>
						<div
							class="d-flex flex-nowrap gap-3 flex-grow-1 flex-basis:420px min-width:300px">
							<label
								class="form-label mb-0 flex-grow-1 flex-basis:0 min-width:80px">
								Rate
								<input
									class="form-control line-rate mt-1"
									type="number"
									value="0"
									min="0"
									step="0.01"
									aria-label="Rate" />
							</label>
							<label
								class="form-label mb-0 flex-grow-1 flex-basis:0 min-width:80px">
								Quantity
								<input
									class="form-control line-quantity mt-1"
									type="number"
									value="1"
									min="0"
									step="1"
									aria-label="Quantity" />
							</label>
							<label
								class="form-label mb-0 flex-grow-1 flex-basis:0 min-width:80px">
								Line total
								<input
									class="form-control line-total mt-1"
									type="number"
									value="0"
									step="0.01"
									readonly
									aria-label="Line total"
									value-bubbles="true" />
							</label>
						</div>
					</div>
				</div>
			</template>

			<p class="small text-muted mt-3 mb-0">
				This page intentionally has no
				<code>calculate</code> attributes.
			</p>
		</main>
		<script src="/dist/CoCreate.js"></script>
	</body>
</html>
