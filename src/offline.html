<!doctype html>
<html
	state-id="theme"
	lang="en"
	data-layout="vertical"
	data-topbar-color="defualt"
	data-sidebar-color="dark"
	data-sidebar-size="sm-hover"
	data-sidebar-image="none"
	data-preloader="disable"
	data-theme="default"
	data-theme-colors="default"
	color-scheme=""
	session>
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#405189" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#292e32" media="(prefers-color-scheme: dark)" />
		<title>Offline - Connection Lost - CoCreate</title>

		<!-- Disable search engine indexing (SEO No-Index / No-Follow) -->
		<meta
			name="robots"
			content="noindex, nofollow" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<meta
			content="CoCreate"
			name="author" />

		<!-- Favicon -->
		<link
			rel="shortcut icon"
			href="/assets/images/icons/favicon.ico" />
		<!-- Menu Icon -->

		<!-- Plugins -->
		<link plugins />
		<link
			href="/assets/css/index.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Custom -->

		<!-- Custom index style -->

		<!-- Manifest -->
		<link
			rel="manifest"
			href="/manifest.webmanifest" />
	</head>

	<body data-bs-spy="scroll">
		<!-- Begin page -->
		<div class="layout-wrapper landing">
			<!-- auth page bg -->
			<div
				class="auth-one-bg-position"
				id="auth-particles"
				plugin='{
        "$particlesJS": [
            "auth-particles",
            {
                "particles": {
                    "number": { "value": 90, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": "#ffffff" },
                    "shape": {
                        "type": "circle",
                        "stroke": { "width": 0, "color": "#000000" },
                        "polygon": { "nb_sides": 5 },
                        "image": { "src": "img/github.svg", "width": 100, "height": 100 }
                    },
                    "opacity": {
                        "value": 0.8,
                        "random": true,
                        "anim": { "enable": true, "speed": 1, "opacity_min": 0, "sync": false }
                    },
                    "size": {
                        "value": 4,
                        "random": true,
                        "anim": { "enable": false, "speed": 4, "size_min": 0.2, "sync": false }
                    },
                    "line_linked": {
                        "enable": false,
                        "distance": 150,
                        "color": "#ffffff",
                        "opacity": 0.4,
                        "width": 1
                    },
                    "move": {
                        "enable": true,
                        "speed": 2,
                        "direction": "none",
                        "random": false,
                        "straight": false,
                        "out_mode": "out",
                        "attract": { "enable": false, "rotateX": 600, "rotateY": 1200 }
                    }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": { "enable": true, "mode": "bubble" },
                        "onclick": { "enable": true, "mode": "repulse" },
                        "resize": true
                    },
                    "modes": {
                        "grab": { "distance": 400, "line_linked": { "opacity": 1 } },
                        "bubble": { "distance": 400, "size": 4, "duration": 2, "opacity": 0.8, "speed": 3 },
                        "repulse": { "distance": 200 },
                        "push": { "particles_nb": 4 },
                        "remove": { "particles_nb": 2 }
                    }
                },
                "retina_detect": true,
                "config_demo": {
                    "hide_card": false,
                    "background_color": "#b61924",
                    "background_image": "",
                    "background_position": "50% 50%",
                    "background_repeat": "no-repeat",
                    "background_size": "cover"
                }
            }
        ]
    }'>
				<div class="bg-overlay"></div>

				<div class="shape">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						version="1.1"
						xmlns:xlink="http://www.w3.org/1999/xlink"
						viewBox="0 0 1440 120">
						<path
							d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
					</svg>
				</div>
			</div>

			<div class="auth-page-wrapper pt-5">
				<!-- auth page bg -->
				<div
					class="auth-one-bg-position auth-one-bg"
					id="auth-particles">
					<div class="bg-overlay"></div>

					<div class="shape">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							version="1.1"
							xmlns:xlink="http://www.w3.org/1999/xlink"
							viewBox="0 0 1440 120">
							<path
								d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
						</svg>
					</div>
				</div>

				<!-- auth page content -->
				<div class="auth-page-content text-center pt-4">
					<div class="mb-4">
						<!-- Inline SVG representing offline connectivity - highly reliable offline graphic -->
						<svg
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="#f06548"
							width="120"
							height="120"
							class="move-animation"
							style="max-width: 120px">
							<path
								d="M12.0001 18C12.7144 18 13.3704 18.2497 13.8856 18.6665L12.0001 21L10.1145 18.6665C10.6297 18.2497 11.2857 18 12.0001 18ZM2.80766 1.39343L20.4853 19.0711L19.0711 20.4853L13.8913 15.3042C13.2967 15.1069 12.6609 15 12.0001 15C10.5719 15 9.26024 15.499 8.22998 16.3322L6.97363 14.7759C8.24961 13.7442 9.84925 13.0969 11.5964 13.01L9.00025 10.414C7.55273 10.8234 6.22651 11.5217 5.0878 12.4426L3.83099 10.8868C4.89946 10.0226 6.10763 9.32438 7.41633 8.83118L5.13168 6.5451C3.98878 7.08913 2.92058 7.76472 1.94666 8.55228L0.689453 6.99674C1.60358 6.25747 2.59156 5.60589 3.64058 5.05479L1.39345 2.80765L2.80766 1.39343ZM14.5004 10.2854L12.2165 8.00243L12 8C15.0947 8 17.9369 9.08141 20.1693 10.8869L18.9123 12.4426C17.6438 11.4167 16.1427 10.6672 14.5004 10.2854ZM12.0001 3.00003C16.2849 3.00003 20.22 4.49719 23.3109 6.99691L22.0534 8.55228C19.3061 6.33062 15.8085 5.00003 12.0001 5.00003C11.122 5.00003 10.2604 5.07077 9.42075 5.20685L7.72455 3.51088C9.09498 3.17702 10.5268 3.00003 12.0001 3.00003Z"></path>
						</svg>
					</div>
					<div class="mt-2">
						<h1 class="display-5 fw-semibold text-danger">
							No Connection
						</h1>
						<h3 class="text-uppercase mt-2">
							You are currently offline!
						</h3>
						<p class="mb-4 max-width:600px mx-auto">
							Please check your internet connection or Wi-Fi
							network. This page will reload automatically as soon
							as your device reconnects.
						</p>
						<div class="d-flex justify-content-center gap-2">
							<button
								onclick="window.location.reload()"
								class="btn btn-success">
								<i class="mdi mdi-refresh me-1"></i>
								Retry Connection
							</button>
							<a
								href="index.html"
								class="btn btn-light">
								<i class="mdi mdi-home me-1"></i>
								Back to Home
							</a>
						</div>
					</div>
				</div>
				<!-- end auth page content -->
			</div>
			<!-- end auth-page-wrapper -->
		</div>
		<!-- end layout wrapper -->

		<!-- JAVASCRIPT -->
		<script src="./dist/CoCreate.js"></script>

		<!-- Offline Auto-detection Script -->
		<script>
			// Monitor when connection state returns online
			window.addEventListener("online", function () {
				// Instantly refresh the page once connectivity returns
				window.location.reload();
			});
		</script>
	</body>
</html>
