<!-- item-->
<h6 class="dropdown-header">
	Welcome
	<span
		array="contacts"
		object="$user_id"
		key="first_name"></span
	>!
</h6>
<a
	class="dropdown-item"
	state-to="offcanvas-app-view"
	state.src="/apps/profile/app.html"
	aria-controls="offcanvas-app"
	aria-expanded="false"
	aria-open
	role="menuitem"
	title="View your profile">
	<span
		state-to="offcanvas-app-form"
		state.array="contacts"
		state.object="$user_id"></span>
	<i
		src="/assets/svg/remix/account-circle-line.svg"
		class="text-muted fs-16 align-middle me-1"></i>
	<span class="align-middle">Profile</span>
</a>
<a
	class="dropdown-item"
	state-to="offcanvas-app-view"
	state.src="/apps/organizations/app.html"
	aria-controls="offcanvas-app"
	aria-expanded="false"
	aria-open
	role="menuitem"
	title="Organization settings">
	<span
		state-to="offcanvas-app-form"
		state.array="organizations"
		state.object="$organization_id"></span>
	<i
		src="/assets/svg/remix/building-line.svg"
		class="text-muted fs-16 align-middle me-1"></i>
	<span class="align-middle">Organization</span>
</a>
<button
	type="button"
	class="dropdown-item light-dark-mode"
	role="menuitem"
	title="Toggle light or dark theme"
	aria-label="Toggle light or dark theme"
	array="users"
	object="$user_id"
	key="theme.colorScheme"
	value=""
	input-query="$document html"
	input.color-scheme="$value"
	click.value="dark, light"
	click.$save
	state.color-scheme="$value"
	state-id="theme">
	<i
		src="/assets/svg/remix/moon-line.svg"
		class="theme-icon-moon text-muted fs-16 align-middle me-1"></i>
	<i
		src="/assets/svg/remix/sun-line.svg"
		class="theme-icon-sun text-muted fs-16 align-middle me-1"></i>
	<span class="align-middle">Theme</span>
</button>
<!-- Language Selector Dropdown -->
<a
	class="dropdown-item"
	aria-haspopup="menu"
	aria-expanded="false"
	aria-close="false"
	aria-controls="language-dropdown"
	title="Select language">
	<input
		array="contacts"
		object="$user_id"
		key="lang.flag"
		input-query="$next"
		input.src="$value"
		hidden />
	<i
		src="/assets/svg/globe.svg"
		class="d-inline-flex flex-shrink-0 align-middle text-muted me-1 width:16px height:16px"></i>
	<span class="align-middle">Language</span>
</a>

<div
	class="dropdown-menu w-100"
	id="language-dropdown"
	role="menu"
	style="box-shadow: none"
	aria-close-on="anywhere"
	aria-hidden="true"
	aria-close="true"
	src="/components/language-dropdown.html"></div>

<div class="dropdown-divider"></div>
<a
	class="dropdown-item"
	state-to="adminView"
	state.src="/apps/settings/index.html"
	role="menuitem"
	title="Global settings hub (includes Organization, Security, Integrations and more)">
	<i
		src="/assets/svg/remix/settings-3-line.svg"
		class="text-muted fs-16 align-middle me-1"></i>
	<span class="align-middle">Settings</span>
	<div
		state-to="app"
		state.object="68741e1d07a037d0d6d00eff"></div>
</a>
<a
	class="dropdown-item"
	state-to="adminView"
	state.src="/components/faqs.html"
	role="menuitem"
	title="Help & FAQs">
	<i
		src="/assets/svg/remix/question-line.svg"
		class="text-muted fs-16 align-middle me-1"></i>
	<span class="align-middle">Help</span>
	<div
		state-to="app"
		state.object=""></div>
</a>
<a
	class="dropdown-item"
	actions="signOut"
	href="/auth/"
	role="menuitem"
	title="Sign out">
	<i
		src="/assets/svg/remix/logout-box-line.svg"
		class="text-muted fs-16 align-middle me-1"></i>
	<span
		class="align-middle"
		data-key="t-logout"
		>Logout</span
	>
</a>
