<div class="layout-width">
	<div class="navbar-header">
		<div class="d-flex">
			<!-- LOGO -->
			<div class="navbar-brand-box horizontal-logo">
				<a
					href="index.html"
					class="logo logo-dark">
					<span class="logo-sm">
						<img
							src="/assets/images/icons/512x512.png"
							alt=""
							height="22" />
					</span>
					<span class="logo-lg">
						<img
							src="/assets/images/logos/dark.png"
							alt=""
							height="40" />
					</span>
				</a>

				<a
					href="index.html"
					class="logo logo-light">
					<span class="logo-sm">
						<img
							src="/assets/images/icons/512x512.png"
							alt=""
							height="22" />
					</span>
					<span class="logo-lg">
						<img
							src="/assets/images/logos/light.png"
							alt=""
							height="40" />
					</span>
				</a>
			</div>

			<div
				toggle.class="vertical-sidebar-enable"
				toggle-query="$document body@xs@sm"
				class="px-3 font-size:16px header-item vertical-menu-btn topnav-hamburger material-shadow-none">
				<span
					class="hamburger-icon"
					click.data-sidebar-size="lg, sm-hover"
					click-query="$document html@md@lg@xl"
					toggle.data-sidebar-size="lg"
					toggle-query="$document html@xs@sm">
					<span></span>
					<span></span>
					<span></span>
				</span>
			</div>

			<!-- App Search-->
			<form
				class="app-search d-none d-md-block"
				data-search-scope="view">
				<div class="search-scope-row">
					<div class="search-scope-field">
						<input
							type="text"
							class="form-control"
							placeholder="Search anything..."
							autocomplete="off"
							id="search-options"
							data-search-results-target="search-dropdown"
							value="" />
						<i
							src="/assets/svg/remix/search-line.svg"
							class="search-widget-icon"></i>
						<i
							src="/assets/svg/remix/close-circle-line.svg"
							class="search-widget-icon search-widget-icon-close d-none"
							id="search-close-options"></i>
					</div>
					<label
						class="search-scope-chip"
						data-search-scope-chip
						hidden>
						<input
							type="checkbox"
							class="form-check-input"
							data-search-scope-input
							aria-label="Search the current view"
							checked />
						<span class="search-scope-name">
							<span
								state-id="app"
								array="apps"
								object="pending"
								key="name"
								>Current view</span
							>
						</span>
					</label>
				</div>
				<button
					type="button"
					hidden
					tabindex="-1"
					data-search-results-controller
					aria-controls="search-dropdown"
					aria-expanded="false"
					aria-haspopup="listbox"
					aria-open></button>
				<div
					class="dropdown-menu dropdown-menu-lg"
					id="search-dropdown"
					aria-close-on="outside"
					role="listbox"
					aria-labelledby="search-options"
					data-search-results
					hidden
					src="/components/search/index.html"></div>
			</form>
		</div>

		<div class="d-flex align-items-center">
			<div class="topbar-search-compact d-md-none header-item">
				<button
					type="button"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
					id="header-search-button"
					data-search-expand
					aria-label="Open search"
					aria-expanded="false"
					aria-controls="header-search-options"
					title="Search">
					<i
						src="/assets/svg/remix/search-line.svg"
						class="fs-22"></i>
				</button>
				<form
					class="app-search app-search-mobile"
					data-search-scope="view">
					<div class="search-scope-row">
						<div class="search-scope-field">
							<input
								id="header-search-options"
								type="text"
								class="form-control"
								placeholder="Search anything..."
								autocomplete="off"
								data-search-results-target="header-search-results"
								aria-label="Search" />
							<i
								src="/assets/svg/remix/search-line.svg"
								class="search-widget-icon"></i>
						</div>
						<label
							class="search-scope-chip"
							data-search-scope-chip
							hidden>
							<input
								type="checkbox"
								class="form-check-input"
								data-search-scope-input
								aria-label="Search the current view"
								checked />
							<span class="search-scope-name">
								<span
									state-id="app"
									array="apps"
									object="pending"
									key="name"
									>Current view</span
								>
							</span>
						</label>
					</div>
					<button
						type="button"
						hidden
						tabindex="-1"
						data-search-results-controller
						aria-controls="header-search-results"
						aria-expanded="false"
						aria-haspopup="listbox"
						aria-open></button>
					<div
						id="header-search-results"
						class="dropdown-menu dropdown-menu-lg"
						data-search-results
						hidden
						src="/components/search/index.html"></div>
				</form>
			</div>

			<!-- AI Chat -->
			<div class="ms-1 header-item">
				<button
					type="button"
					id="ai-chat-button"
					state-id="ai-chat-btn"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
					aria-label="Open AI chat"
					aria-controls="ai-chat-panel"
					aria-expanded="false"
					state-to="ai-chat-panel-content"
					state.src="/apps/ai/index.html"
					title="Open AI chat">
					<i
						src="/assets/svg/remix/robot-2-line.svg"
						class="fs-22"
						aria-hidden="true"></i>
				</button>
			</div>

			<!-- Activities -->
			<div class="ms-1 header-item">
				<button
					type="button"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
					aria-label="Open recent activities"
					aria-controls="offcanvas-app"
					state-to="offcanvas-app-view"
					state.src="/apps/activities/index.html"
					aria-expanded="false"
					aria-open
					title="Recent activities">
					<i
						src="/assets/svg/remix/history-line.svg"
						class="fs-22"
						aria-hidden="true"></i>
				</button>
			</div>

			<!-- Fullscreen Icon with Badge -->
			<div class="ms-1 header-item">
				<button
					type="button"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
					fullscreen>
					<i
						src="/assets/svg/remix/fullscreen-line.svg"
						class="fullscreen-icon fs-22"></i>
					<i
						src="/assets/svg/remix/fullscreen-exit-line.svg"
						class="fullscreen-exit-icon fs-22"></i>
				</button>
			</div>

			<!-- Notifications Icon with Badge -->
			<div
				class="dropdown topbar-head-dropdown ms-1 header-item"
				id="notificationDropdown">
				<button
					type="button"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
					id="header-notifications-button"
					aria-haspopup="dialog"
					aria-expanded="false"
					aria-controls="header-notifications-dropdown">
					<i
						src="/assets/svg/remix/notification-line.svg"
						class="fs-22"></i>
					<!-- <span
						class="position-absolute topbar-badge fs-10 translate-middle badge rounded-pill bg-danger">
						3<span class="visually-hidden"> unread messages </span>
					</span> -->
				</button>
				<div
					class="dropdown-menu dropdown-menu-xl dropdown-menu-end p-0 right:0 top:72px"
					aria-labelledby="header-notifications-button"
					id="header-notifications-dropdown"
					role="dialog"
					aria-close-on="outside, btn"
					src="/components/notifications.html"></div>
			</div>

			<div class="dropdown ms-sm-3 header-item topbar-user">
				<button
					type="button"
					class="btn material-shadow-none"
					id="header-user-button"
					aria-label="Open account menu"
					aria-haspopup="true"
					aria-expanded="false"
					aria-controls="header-user-dropdown"
					title="Account menu">
					<form
						class="d-flex align-items-center"
						array="contacts"
						object="$user_id">
						<div
							class="avatar-sm rounded-circle position-relative overflow-hidden">
							<div
								class="avatar-title bg-secondary-subtle text-secondary material-shadow">
								<span
									key="first_name[0]"
									class="avatar-initial"></span>
								<span
									key="last_name[0]"
									class="avatar-initial"></span>
								<img
									class="position-absolute object-fit-cover"
									src="/assets/images/transparent.png"
									key="avatar"
									alt="Header Avatar"
									width="100%"
									height="100%" />
							</div>
						</div>
						<span class="text-start ms-xl-2">
							<span
								class="d-none d-sm-inline-block ms-1 fw-medium user-name-text">
								<span key="first_name"></span>
								<span key="last_name"></span>
							</span>
							<span
								class="d-none d-sm-block ms-1 fs-12 user-name-sub-text"
								key="title"></span>
						</span>
					</form>
				</button>
				<div
					class="dropdown-menu dropdown-menu-end right:0 top:72px w-100"
					id="header-user-dropdown"
					aria-labelledby="header-user-button"
					aria-close-on="anywhere"
					src="/components/user-dropdown.html"></div>
			</div>
		</div>
	</div>
</div>
