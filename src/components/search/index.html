<div
	scrollbar
	style="max-height: 320px">
	<div
		data-global-search-section
		hidden>
		<div class="dropdown-header">
			<h6 class="text-overflow text-muted mb-0 text-uppercase">
				Results
			</h6>
		</div>
		<div
			class="px-3 py-3 text-muted fs-12"
			data-search-status>
			Start typing to search.
		</div>
		<div
			class="global-search-results"
			data-global-search-results
			render-query="[template]">
			<button
				type="button"
				template
				class="dropdown-item global-search-result d-flex align-items-center gap-2"
				state-to="offcanvas-app-view"
				state.src="/apps/{{object.$array[0]}}/app.html"
				aria-controls="offcanvas-app"
				aria-open
				aria-haspopup="dialog"
				aria-expanded="false">
				<span
					class="avatar-xs rounded-circle d-inline-flex align-items-center justify-content-center bg-primary-subtle flex-shrink-0">
					<i src="{{object.$appIcon}}"></i>
				</span>
				<span class="min-width:0 flex-grow-1 text-start">
					<span
						class="global-search-primary d-block fw-medium text-truncate">
						{{object.$searchLabel}}
					</span>
					<span class="d-block fs-11 text-muted text-truncate">
						{{object.$searchMeta}}
					</span>
				</span>
				<span
					state-to="offcanvas-app-form"
					state.array="{{object.$array[0]}}"
					state.object="{{object._id}}"></span>
			</button>
		</div>
	</div>
</div>

<div class="text-center border-top pt-3 pb-3 d-none">
	<a
		state-to="adminView"
		state.src="/apps/search/index.html"
		class="btn btn-primary btn-sm">
		View All Results
		<i
			src="/assets/svg/remix/arrow-right-line.svg"
			class="ms-1"></i>
	</a>
</div>

<script src="/components/search/index.js"></script>
