<button
	onclick="(document.body.scrollTop = 0), (document.documentElement.scrollTop = 0)"
	scroll="display:none, display:block"
	scroll-attribute="style"
	scroll-up="10"
	scroll-down="10"
	class="btn btn-danger btn-icon"
	id="back-to-top">
	<i src="/assets/svg/remix/arrow-up-line.svg"></i>
</button>
