<!-- header -->
<div class="dropdown-header">Select Language</div>
<!-- item: English (en) -->
<a
	href="javascript:void(0);"
	class="dropdown-item notify-item language py-2"
	data-lang="en"
	title="English"
	role="menuitem"
	read="false"
	array="contacts"
	object="$user_id"
	key="lang"
	value-type="object"
	value='{
		"code": "en",
		"name": "English",
		"flag": "/assets/svg/flags/us.svg"
	}'
	click
	click.save>
	<img
		src="/assets/svg/flags/us.svg"
		alt="user-image"
		class="me-2 rounded"
		height="18" />
	<span class="align-middle">English</span>
</a>
