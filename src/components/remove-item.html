<div
	id="removeItemModal"
	class="dialog fade zoomIn"
	tabindex="-1"
	role="dialog"
	aria-modal="true"
	aria-labelledby="removeItemModalLabel"
	aria-describedby="removeItemModalDesc">
	<div
		class="card"
		aria-close-on="outside">
		<div class="card-body">
			<button
				type="button"
				class="btn-close float-end"
				id="btn-close"
				aria-label="Close"
				aria-controls="removeItemModal"
				aria-expanded="true"
				aria-close></button>

			<div class="mt-2 text-center">
				<div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
					<h4 id="removeItemModalLabel">Confirm deletion</h4>
					<p
						class="text-muted mx-4 mb-0"
						id="removeItemModalDesc">
						Are you sure you want to delete the selected records?
					</p>
				</div>
			</div>
			<div class="d-flex gap-2 justify-content-center mt-4 mb-2">
				<button
					type="button"
					class="btn w-sm btn-light"
					aria-controls="removeItemModal"
					aria-expanded="true"
					aria-close>
					Close
				</button>
				<button
					type="button"
					class="btn w-sm btn-danger"
					id="delete-record"
					state-id="delete-record"
					delete-query=""
					aria-controls="removeItemModal"
					aria-expanded="true"
					actions="delete, action($document [aria-controls='offcanvas-app'][aria-label='Close'])">
					Delete
				</button>
			</div>
		</div>
	</div>
</div>
