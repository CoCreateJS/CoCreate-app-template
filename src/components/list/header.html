<div
	class="list-header d-flex flex-wrap justify-content-between align-items-center gap-2">
	<link
		rel="stylesheet"
		href="/components/list/header.css" />
	<link
		rel="stylesheet"
		href="/components/list/selection.css" />

	<div class="list-header-primary d-flex align-items-center gap-2">
		<button
			type="button"
			class="list-toolbar-control list-toolbar-icon list-files-menu btn btn-light"
			aria-controls="files-sidebar"
			aria-expanded="false"
			aria-label="Toggle files menu"
			title="Files menu">
			<i
				src="/assets/svg/remix/menu-2-line.svg"
				aria-hidden="true"></i>
		</button>
		<button
			type="button"
			class="list-toolbar-control list-compact-action list-filter-button btn btn-light"
			aria-controls="context-sidebar"
			aria-haspopup="dialog"
			aria-expanded="false"
			aria-label="Filters"
			title="Filters">
			<i
				src="/assets/svg/remix/filter-3-line.svg"
				aria-hidden="true"></i>
			<span class="list-action-label">Filters</span>
		</button>
		<div
			class="list-header-extension d-flex align-items-center min-width:0"
			src="">
			<input
				type="hidden"
				state-id="app"
				array="apps"
				object
				key="listHeader"
				input.src="$value"
				input-query="$parent" />
		</div>
	</div>

	<textarea
		id="list-export-fields"
		state-id="app"
		array="apps"
		object
		key="fields"
		value-type="json"
		value-evaluate="false"
		hidden></textarea>

	<!-- List actions -->
	<div class="list-header-actions hstack gap-2 ms-auto">
		<div class="dropdown">
			<button
				class="list-toolbar-control list-compact-action btn btn-light dropdown-toggle"
				type="button"
				id="viewDropdown"
				aria-expanded="false"
				aria-controls="viewDropdownMenu"
				aria-haspopup="menu"
				aria-label="Change view"
				title="Change view">
				<i
					src="/assets/svg/remix/layout-grid-line.svg"
					class="list-view-grid-icon"
					aria-hidden="true"></i>
				<i
					src="/assets/svg/remix/list-unordered.svg"
					class="list-view-list-icon"
					aria-hidden="true"></i>
				<span class="list-action-label"
					><span class="list-view-grid-label">Grid</span
					><span class="list-view-list-label">List</span></span
				>
			</button>
			<ul
				id="viewDropdownMenu"
				class="dropdown-menu"
				role="menu"
				aria-labelledby="viewDropdown"
				aria-close-on="anywhere"
				aria-hidden="true">
				<li>
					<a
						class="dropdown-item"
						href="#"
						state-to="app-list-view"
						state.src="/components/list/grid.html">
						<i
							src="/assets/svg/remix/layout-grid-line.svg"
							class="me-2"></i>
						Grid
					</a>
				</li>
				<li>
					<a
						class="dropdown-item"
						href="#"
						state-to="app-list-view"
						state.src="/components/list/table.html">
						<i
							src="/assets/svg/remix/list-unordered.svg"
							class="me-2"></i>
						List
					</a>
				</li>
			</ul>
		</div>

		<button
			type="button"
			class="list-toolbar-control list-toolbar-icon btn btn-soft-danger"
			id="remove-actions"
			aria-controls="removeItemModal"
			state-to="delete-record"
			state.delete-query='$document #list-view :is([role="row"][aria-selected="true"], [role="row"] input[type="checkbox"][name="selected[]"]:checked):not(:disabled):not([template],[hidden]):not(:is([template], [hidden]) *)[]'
			state.actions="delete"
			state.array=""
			state.object=""
			aria-haspopup="dialog"
			aria-expanded="false"
			aria-open
			aria-label="Delete selected items"
			title="Delete selected items">
			<i
				src="/assets/svg/remix/delete-bin-2-line.svg"
				aria-hidden="true"></i>
		</button>
		<button
			type="button"
			class="list-toolbar-control list-compact-action btn btn-success add-btn"
			aria-controls="offcanvas-app"
			aria-open
			aria-haspopup="dialog"
			aria-expanded="false"
			state-to="offcanvas-app-view"
			state.src=""
			id="create-btn"
			aria-label="Create item"
			title="Create item">
			<input
				type="hidden"
				state-id="app"
				array="apps"
				object
				key="path"
				value-suffix="/create.html"
				input.state.src="$value"
				input-query="$parent" />
			<div
				state-to="offcanvas-app-form"
				state.$reset
				state.array=""
				hidden>
				<input
					type="hidden"
					state-id="app"
					array="apps"
					object
					key="array"
					input.state.array="$value"
					input-query="$parent" />
			</div>

			<i
				src="/assets/svg/remix/add-line.svg"
				aria-hidden="true"></i>
			<span class="list-action-label">
				New
				<span
					state-id="app"
					array="apps"
					object
					key="singularName"></span>
			</span>
		</button>
		<span class="dropdown">
			<button
				class="list-toolbar-control list-toolbar-icon btn btn-light"
				type="button"
				id="settingsDropdownButton"
				aria-controls="settingsDropdownMenu"
				aria-haspopup="menu"
				aria-expanded="false"
				title="More actions"
				aria-label="More actions">
				<i
					src="/assets/svg/remix/more-2-fill.svg"
					aria-hidden="true"></i>
			</button>
			<ul
				id="settingsDropdownMenu"
				class="dropdown-menu dropdown-menu-end"
				role="menu"
				aria-labelledby="settingsDropdownButton"
				aria-hidden="true"
				aria-close-on="anywhere">
				<li>
					<button
						type="button"
						class="dropdown-item"
						role="menuitem"
						actions="import"
						import-query='$document #list-view [state-id="list"]'>
						<i
							src="/assets/svg/remix/upload-2-line.svg"
							class="me-2"
							aria-hidden="true"></i
						>Import
					</button>
				</li>
				<li>
					<button
						type="button"
						class="dropdown-item"
						role="menuitem"
						actions="export"
						export-format="json"
						export-query='$document #list-view :is([role="row"][aria-selected="true"], [role="row"] input[type="checkbox"][name="selected[]"]:checked):not(:disabled):not([template],[hidden]):not(:is([template], [hidden]) *)[], $document #list-view:not(:has(:is([role="row"][aria-selected="true"], [role="row"] input[type="checkbox"][name="selected[]"]:checked):not(:disabled):not([template],[hidden]):not(:is([template], [hidden]) *))) [state-id="list"][]'>
						<i
							src="/assets/svg/remix/download-2-line.svg"
							class="me-2"
							aria-hidden="true"></i
						>Export JSON
					</button>
				</li>
				<li>
					<button
						type="button"
						class="dropdown-item"
						role="menuitem"
						actions="export"
						export-format="csv"
						export-columns-query="$document #list-view th[data-export-key]:not([template])[], $document #list-export-fields"
						export-query='$document #list-view :is([role="row"][aria-selected="true"], [role="row"] input[type="checkbox"][name="selected[]"]:checked):not(:disabled):not([template],[hidden]):not(:is([template], [hidden]) *)[], $document #list-view:not(:has(:is([role="row"][aria-selected="true"], [role="row"] input[type="checkbox"][name="selected[]"]:checked):not(:disabled):not([template],[hidden]):not(:is([template], [hidden]) *))) [state-id="list"][]'>
						<i
							src="/assets/svg/remix/download-2-line.svg"
							class="me-2"
							aria-hidden="true"></i
						>Export CSV
					</button>
				</li>
				<li>
					<button
						type="button"
						class="dropdown-item"
						role="menuitem"
						actions="print"
						print-query="$document #list-view">
						<i
							src="/assets/svg/remix/printer-line.svg"
							class="me-2"
							aria-hidden="true"></i
						>Print
					</button>
				</li>
				<li><hr class="dropdown-divider" /></li>
				<li>
					<a
						class="dropdown-item text-danger"
						role="menuitem"
						aria-controls="removeItemModal"
						state-to="delete-record"
						state.delete-query='$document #list-view :is([role="row"][aria-selected="true"], [role="row"] input[type="checkbox"][name="selected[]"]:checked):not(:disabled):not([template],[hidden]):not(:is([template], [hidden]) *)[]'
						state.actions="delete"
						state.array=""
						state.object=""
						aria-haspopup="dialog"
						aria-expanded="false"
						aria-open>
						<i
							src="/assets/svg/remix/delete-bin-2-line.svg"
							class="me-2"></i>
						Delete selected
					</a>
				</li>
				<!-- <li><a class="dropdown-item" href="#" role="menuitem">Customize Columns</a></li> -->
				<!-- <li><a class="dropdown-item" href="#" role="menuitem">Reset board view to default</a></li> -->
			</ul>
		</span>
	</div>
</div>
