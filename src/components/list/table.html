<div class="app-panel component-list-table">
	<div
		class="h-100"
		scrollbar>
		<div class="table-card">
			<table
				id="table"
				role="grid"
				aria-label="Records"
				aria-multiselectable="true"
				state-id="app"
				array="apps"
				object=""
				key="fields"
				filter-limit
				render-query="[template='column'][]"
				input.array=""
				input-set-timeout="500"
				input-query="tbody"
				class="table align-middle">
				<colgroup>
					<col class="table-selection-track" />
				</colgroup>
				<thead>
					<tr>
						<th class="table-selection-column" scope="col" aria-label="Select rows"></th>
						<!-- Render each column header dynamically -->
						<th
							template="column"
							render-as="column"
							data-export-key="{{column.key}}"
							data-export-label="{{column.label}}"
							scope="col">
							<div
								class="d-flex align-items-center justify-content-between gap-2">
								<span>{{column.label}}</span>
								<a
									class="float-end"
									filter-query="$closest table tbody"
									filter-sort-key="{{column.key}}"
									filter-sort-direction=""
									click
									click.filter-sort-direction="asc, desc">
									<i
										toggle.src="/assets/svg/sort-down.svg, /assets/svg/sort-up.svg"
										src="/assets/svg/sort.svg"></i>
								</a>
							</div>
						</th>
						<th
							class="table-fill-column"
							aria-hidden="true"></th>
					</tr>
				</thead>
				<tbody
					class="form-check-all list-view"
					state-id="list"
					filter-sort-key="updated.on"
					filter-sort-direction="desc"
					array=""
					object
					filter-limit="30"
					render-query="tr[template]">
					<tr template role="row" array="{{object.$array[0]}}" object="{{object._id}}">
						<td class="table-selection-column">
							<div class="form-check mb-0">
								<input
									class="form-check-input"
									type="checkbox"
									name="selected[]"
									value="{{object._id}}"
									array="{{object.$array[0]}}"
									object="{{object._id}}"
									aria-label="Select row {{object._id}}" />
							</div>
						</td>
						<td
							template="column"
							render-as="column"
							value-type="html">
							{{column.tableTemplate}}
						</td>
						<td
							class="table-fill-column"
							aria-hidden="true"></td>
					</tr>
					<tr
						style="height: 15px"
						filter-on="scroll"
						filter-query="$parent"></tr>
				</tbody>
			</table>

			<div
				class="noresult"
				style="display: none">
				<div class="text-center">
					<lord-icon
						src="https://cdn.lordicon.com/msoeawqm.json"
						trigger="loop"
						colors="primary:#121331,secondary:#08a88a"
						style="width: 75px; height: 75px"></lord-icon>
					<h5 class="mt-2">Sorry! No Result Found</h5>
					<p class="text-muted mb-0">
						We've searched more than 150+ leads We did not find any
						leads for you search.
					</p>
				</div>
			</div>
		</div>
	</div>
</div>
<!--end card-->
