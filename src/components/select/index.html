<div
	class="dropdown form-control select-control"
	search_id="select-options"
	data-options
	click-query="$this :scope > input[type=search]"
	click.$focus="$undefined">
	<div
		class="select-values"
		data-selected-options
		aria-label="Selected options"></div>
	<div
		value-type="outerHTML"
		src="/components/select/search.html"></div>
	<div
		value-type="outerHTML"
		src="/components/select/options.html"></div>
</div>
