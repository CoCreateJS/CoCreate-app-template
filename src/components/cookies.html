<div
	id="cookieModal"
	class="modal fade zoomIn"
	tabindex="-1"
	role="dialog"
	aria-modal="true"
	aria-labelledby="cookieModalLabel"
	aria-describedby="cookieModalDesc">
	<div class="card modal-dialog modal-dialog-bottom-right">
		<div class="card-body">
			<div class="mt-2 text-center">
				<lord-icon
					src="/assets/icons/gsqxdxog.json"
					trigger="loop"
					colors="primary:#f7b84b,secondary:#f06548"
					style="width: 100px; height: 100px"></lord-icon>
				<div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
					<h4 id="cookieModalLabel">Are you Sure?</h4>
					<p class="text-muted mx-4 mb-0" id="cookieModalDesc">					
						We use cookies to enhance your browsing experience, serve personalized ads
						or content, and analyze our traffic. By clicking "Allow cookies" you consent
						to our use of cookies.
						For more details, please read our 
						<a href="/privacy-policy" class="text-decoration-underline">Privacy Policy</a>.
					</p>
				</div>
			</div>
			<div class="d-flex gap-2 justify-content-center mt-4 mb-2">
				<button
					type="button"
					class="btn w-sm btn-light"
					id="decline-cookies"
					aria-controls="cookieModal"
					aria-expanded="true">
					Decline
				</button>
				<button
					type="button"
					class="btn w-sm "
					id="allow-cookies"
					aria-controls="cookieModal"
					aria-expanded="true"
					actions="save" >
					Allow
				</button>
			</div>
		</div>
	</div>
</div>
