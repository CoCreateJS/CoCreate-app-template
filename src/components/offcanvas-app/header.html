<header
	class="card-header offcanvas-app-topbar flex-shrink-0"
	aria-label="{{app.name}} view and window controls">
	<link
		rel="stylesheet"
		href="/components/offcanvas-app/header.css" />
	<link
		rel="stylesheet"
		href="/components/offcanvas-app/index.css?v=20261001-5" />
	<ul
		class="list-inline hstack justify-content-between align-items-center gap-2 mb-0"
		style="min-height: unset"
		role="toolbar"
		aria-label="{{app.name}} controls">
		<li
			class="offcanvas-app-record-actions {{app.name}}-record-actions list-inline-item">
			<div
				class="dropdown d-inline-block"
				role="region"
				aria-label="{{app.name}} actions">
				<a
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle dropdown text-muted"
					role="button"
					aria-haspopup="menu"
					aria-controls="{{app.name}}-header-dropdown"
					aria-expanded="false"
					aria-label="More actions">
					<i
						src="/assets/svg/remix/more-2-fill.svg"
						class="align-middle fs-22"
						aria-hidden="true"></i>
				</a>
				<ul
					id="{{app.name}}-header-dropdown"
					class="dropdown-menu dropdown-menu-start"
					aria-close-on="anywhere"
					role="menu"
					aria-label="{{app.name}} actions menu">
					<li>
						<a
							class="dropdown-item remove-item-btn text-danger"
							aria-haspopup="dialog"
							aria-label="Delete {{app.name}}"
							aria-controls="removeItemModal"
							role="menuitem"
							state-to="delete-record"
							state.delete-query="$document #offcanvas-app-view [state-id='offcanvas-app-form']"
							state.actions="delete, action($document [aria-controls='offcanvas-app'][aria-label='Close'])">
							<i
								src="/assets/svg/remix/delete-bin-fill.svg"
								class="align-bottom me-2"
								aria-hidden="true"></i
							>Delete
						</a>
					</li>
				</ul>
			</div>

			<div
				role="tablist"
				aria-label="{{app.name}} views"
				class="d-inline-block align-middle">
				<button
					id="{{app.name}}-details-btn"
					type="button"
					role="tab"
					aria-controls="{{app.name}}-details-view"
					aria-selected="true"
					class="btn btn-sm btn-outline-primary ms-2"
					title="Details"
					aria-label="View {{app.name}} details">
					<i
						src="/assets/svg/remix/eye-fill.svg"
						class="align-bottom"
						aria-hidden="true"></i>
					<span>Details</span>
				</button>

				<button
					id="{{app.name}}-form-btn"
					type="button"
					role="tab"
					aria-controls="{{app.name}}-form-view"
					aria-selected="false"
					class="btn btn-sm btn-outline-primary ms-2"
					title="Edit"
					aria-label="Edit {{app.name}}">
					<i
						src="/assets/svg/remix/pencil-fill.svg"
						class="align-bottom"
						aria-hidden="true"></i>
					<span>Edit</span>
				</button>
				<button
					id="{{app.name}}-code-btn"
					type="button"
					role="tab"
					aria-controls="{{app.name}}-code-view"
					aria-selected="false"
					class="btn btn-sm btn-outline-primary ms-2"
					title="JSON"
					aria-label="Edit {{app.name}} JSON">
					<i
						src="/assets/svg/remix/code-s-slash-line.svg"
						class="align-bottom"
						aria-hidden="true"></i>
					<span>JSON</span>
				</button>
			</div>
		</li>

		<div
			role="group"
			aria-label="Window controls"
			class="hstack gap-1 ms-auto">
			<li
				class="offcanvas-app-dock-control {{app.name}}-dock-control d-none d-md-inline">
				<a
					role="button"
					title="Dock Right"
					aria-label="Dock Right"
					state-to="offcanvas-app-dock"
					state.docked="true"
					class="offcanvas-app-dock btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
					<i
						src="/assets/svg/remix/layout-right-line.svg"
						class="align-middle fs-22"
						aria-hidden="true"></i>
				</a>
				<a
					role="button"
					title="Undock"
					aria-label="Undock"
					state-to="offcanvas-app-dock"
					state.docked="false"
					class="offcanvas-app-undock btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
					<i
						src="/assets/svg/remix/layout-right-2-line.svg"
						class="align-middle fs-22"
						aria-hidden="true"></i>
				</a>
			</li>
			<li title="Close">
				<a
					role="button"
					aria-label="Close"
					aria-controls="offcanvas-app"
					data-panel-close="offcanvas-app"
					aria-close
					aria-expanded="true"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
					<i
						src="/assets/svg/remix/close-line.svg"
						class="align-middle fs-22"
						aria-hidden="true"></i>
				</a>
				<a
					role="button"
					aria-label="Close"
					aria-controls="create-panel"
					data-panel-close="create-panel"
					aria-close
					aria-expanded="true"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
					<i
						src="/assets/svg/remix/close-line.svg"
						class="align-middle fs-22"
						aria-hidden="true"></i>
				</a>
			</li>
		</div>
	</ul>
</header>
